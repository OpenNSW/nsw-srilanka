# Export Facilitation Center (EFC) agency deployment, for a native run
# (`go run ./cmd/server` with efc.env loaded). See configs/agency/efc/README.md.
# The Docker Compose efc-api reads config.docker.yaml instead; the two differ
# only in reaching the shared services by container hostname there rather than
# localhost. Every key is documented in configs/config.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are set by efc.env.

mode: agency

# Its own database on the shared Postgres. ASSUMED name; create it before
# running migrations (`docker compose run --rm efc-init` does).
db:
  driver: postgres
  postgres:
    host: localhost
    port: 55432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: efc_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

server:
  # 8085 is where TNSW's services list in config.yaml points its "efc" service.
  port: 8085
  logLevel: debug
  serviceURL: http://localhost:8085
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s
  paymentMethodsConfigPath: ./configs/agency/efc/payment_methods.json
  catalogConfigPath: ./configs/agency/efc/catalog.json

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://localhost:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://localhost:8090/oauth2/token
        clientID: EFC_TO_NSW
        clientSecret: "{{env:M2M_EFC_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
        endpointParams:
          resource: https://api.nsw-srilanka.local

# The EFC portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5178
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# EFC stores the files its officers upload in its own storage. A file TNSW
# owns is opened through TNSW, which this deployment calls as EFC_TO_NSW
# (services entry tnsw).
storage:
  # local | s3
  type: local
  # How long a presigned upload/download URL stays valid, in seconds.
  presignTTLSeconds: 900
  # What officers may upload, as MIME types compared exactly with the upload's.
  allowedUploadTypes:
    - application/pdf
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls.
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    # XML is data to download, not to display: it is not in inlineTypes.
    - text/xml
    - application/xml
  # What a download opens in the browser; every other file is saved. text/html
  # is for the documents this service generates, and is never uploadable.
  inlineTypes:
    - application/pdf
    - image/png
    - image/jpeg
    - image/gif
    - image/webp
    - text/plain
    - text/html
  # Largest upload, in bytes (32 MiB).
  maxUploadBytes: 33554432
  # Seals the file tokens officers hold in place of stored file keys, and the
  # tokens given to TNSW: comma-separated kid:key pairs, newest first, each key 32
  # random bytes in base64. This agency's own, never TNSW's. Keep old keys: the
  # tokens TNSW holds never expire.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  local:
    baseDir: ./bucket/efc
    # The browser-facing URL presigned local URLs are built on: server.serviceURL.
    publicURL: http://localhost:8085
    # Signs presigned upload URLs.
    putSecret: "{{env:STORAGE_LOCAL_PUT_SECRET}}"

# Officers sign in through the EFC portal client, and NSW injects and replies as NSW_TO_EFC.
# The audience is the EFC API resource server in
# idp/bootstrap/20-agency-efc.yaml.
authn:
  jwksURL: http://localhost:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.efc.nsw-agency.local

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode

# Its own namespace, so TNSW and EFC workers never pick up each other's
# workflows. ASSUMED name; register it first (efc-init does).
temporal:
  host: localhost
  port: 7233
  namespace: efc

# The efc folder of a one-trade-artifacts clone next to this repo, relative
# to where the server runs (the repo root). Point root at another clone's
# efc dir to use that one.
artifactLoader:
  type: local
  local:
    root: ../one-trade-artifacts/efc
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: efc

# The efc artifacts use no REFID_GENERATOR tasks.
refid:
  issuers: []
