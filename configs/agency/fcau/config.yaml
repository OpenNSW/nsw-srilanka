# FCAU (Food Control Administration Unit) agency deployment, for a native run
# (`go run ./cmd/server` with fcau.env loaded). See configs/agency/fcau/README.md.
# The Docker Compose fcau-api reads config.docker.yaml instead; the two differ
# only in reaching the shared services by container hostname there rather than
# localhost. Every key is documented in configs/config.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are set by fcau.env.

mode: agency

server:
  # 8082 is where TNSW's services list in config.yaml points its "fcau" service.
  port: 8082
  logLevel: debug
  serviceURL: http://localhost:8082
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s

# Its own database on the shared Postgres. ASSUMED name; create it before
# running migrations (`docker compose run --rm fcau-init` does).
db:
  driver: postgres
  postgres:
    host: localhost
    port: 55432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: fcau_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

# Its own namespace, so TNSW and FCAU workers never pick up each other's
# workflows. ASSUMED name; register it first (fcau-init does).
temporal:
  host: localhost
  port: 7233
  namespace: fcau

# FCAU keeps no files of its own: it serves TNSW's storage, calling TNSW as
# FCAU_TO_NSW (services entry tnsw), so officers open the documents
# traders uploaded there. Officers' uploads go to TNSW's upload route
# (scope nsw:storage:write), so TNSW checks them like a trader's. The files this
# agency generates itself go to TNSW's internal upload route (scope
# nsw:storage:internalwrite), which accepts the types TNSW grants this client.
storage:
  type: proxy
  # Seals the file tokens officers hold in place of stored file keys (here,
  # the tokens TNSW gives this agency): comma-separated kid:key pairs, newest
  # first, each key 32 random bytes in base64. This agency's own, never TNSW's.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  proxy:
    service: "tnsw"
    uploadPath: /api/v1/storage
    internalUploadPath: /api/v1/internal/storage
    downloadPath: /api/v1/storage/{key}
    deletePath: /api/v1/storage/{key}
    # What this agency's officers may upload; anything else is refused with
    # 415 before it is sent to TNSW. Each is compared exactly with the upload's
    # type, as TNSW compares it, and TNSW's own list decides what it accepts.
    allowedUploadTypes:
      - application/pdf
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls.
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# Officers sign in through the FCAU portal client, and NSW injects and replies as NSW_TO_FCAU.
# The audience is the FCAU API resource server in
# idp/bootstrap/20-agency-fcau.yaml.
authn:
  jwksURL: http://localhost:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.fcau.nsw-agency.local

# The catalog: the logical names the agency's workflow rules use, mapped to
# this deployment's IdP token roles and OAuth2 client ids. Each role here
# owns an injected workflow; tnsw names the client TNSW calls this agency as.
catalog:
  roles:
    officer: FCAU Officer
  clients:
    tnsw: NSW_TO_FCAU

# The fcau folder of a one-trade-artifacts clone next to this repo, relative
# to where the server runs (the repo root). Point root at another clone's
# fcau dir to use that one.
artifactLoader:
  type: local
  local:
    root: ../one-trade-artifacts/fcau
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: fcau

# The FCAU portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5175
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://localhost:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://localhost:8090/oauth2/token
        clientID: FCAU_TO_NSW
        clientSecret: "{{env:M2M_FCAU_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
          - nsw:storage:write
          - nsw:storage:internalwrite
        endpointParams:
          resource: https://api.nsw-srilanka.local

# The fcau artifacts use no REFID_GENERATOR tasks.
refid:
  issuers: []

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode
