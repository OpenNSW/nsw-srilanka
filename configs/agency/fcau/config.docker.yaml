# FCAU (Food Control Administration Unit) agency deployment, for the Docker Compose
# fcau-init and fcau-api services (compose.yml points their CONFIG_PATH here). See
# configs/agency/fcau/README.md. A native run reads config.yaml instead; the two
# differ only in reaching the shared services by container hostname here rather
# than localhost. Every key is documented in configs/config.docker.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are passed to the containers by compose.yml.

mode: agency

# Its own database on the shared Postgres, created by fcau-init.
db:
  driver: postgres
  postgres:
    host: db
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: fcau_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

server:
  port: 8080
  logLevel: debug
  # The browser-facing URL: the host port compose publishes. TNSW's
  # config.docker.yaml services entry "fcau" also calls 8082.
  serviceURL: http://localhost:8082
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s
  paymentMethodsConfigPath: configs/agency/fcau/payment_methods.json
  catalogConfigPath: configs/agency/fcau/catalog.json

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://api:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://thunderid:8090/oauth2/token
        clientID: FCAU_TO_NSW
        clientSecret: "{{env:M2M_FCAU_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
        endpointParams:
          resource: https://api.nsw-srilanka.local

# The FCAU portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5175
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# FCAU stores the files its officers upload in its own storage. A file TNSW
# owns is opened through TNSW, which this deployment calls as FCAU_TO_NSW
# (services entry tnsw).
storage:
  # local | s3
  type: local
  # How long a presigned upload/download URL stays valid, in seconds.
  presignTTLSeconds: 900
  # What officers may upload, as MIME types compared exactly with the upload's.
  allowedUploadTypes:
    - application/pdf
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls.
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    # XML is data to download, not to display: it is not in inlineTypes.
    - text/xml
    - application/xml
  # What a download opens in the browser; every other file is saved. text/html
  # is for the documents this service generates, and is never uploadable.
  inlineTypes:
    - application/pdf
    - image/png
    - image/jpeg
    - image/gif
    - image/webp
    - text/plain
    - text/html
  # Largest upload, in bytes (32 MiB).
  maxUploadBytes: 33554432
  # Seals the file tokens officers hold in place of stored file keys, and the
  # tokens given to TNSW: comma-separated kid:key pairs, newest first, each key 32
  # random bytes in base64. This agency's own, never TNSW's. Keep old keys: the
  # tokens TNSW holds never expire.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  local:
    baseDir: ./bucket
    # The browser-facing URL presigned local URLs are built on: server.serviceURL.
    publicURL: http://localhost:8082
    # Signs presigned upload URLs.
    putSecret: "{{env:STORAGE_LOCAL_PUT_SECRET}}"

# Officers sign in through the FCAU portal client, and NSW injects and replies as NSW_TO_FCAU.
# The audience is the FCAU API resource server in
# idp/bootstrap/20-agency-fcau.yaml. The keys are fetched in-network;
# the issuer is the browser-facing host the tokens are minted for.
authn:
  jwksURL: http://thunderid:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.fcau.nsw-agency.local

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode

# Its own namespace, created by fcau-init, so TNSW and FCAU workers never pick up
# each other's workflows.
temporal:
  host: temporal
  port: 7233
  namespace: fcau

# The fcau folder of a one-trade-artifacts clone, which compose bind-mounts
# at /app/artifacts: ../one-trade-artifacts/fcau by default, or set
# FCAU_ARTIFACT_LOCAL_ROOT in .env to another clone's fcau dir.
artifactLoader:
  type: local
  local:
    root: /app/artifacts
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: fcau

# The fcau artifacts use no REFID_GENERATOR tasks.
refid:
  issuers: []
