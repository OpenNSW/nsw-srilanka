# CDA (Coconut Development Authority) agency deployment, for the Docker Compose
# cda-init and cda-api services (compose.yml points their CONFIG_PATH here). See
# configs/agency/cda/README.md. A native run reads config.yaml instead; the two
# differ only in reaching the shared services by container hostname here rather
# than localhost. Every key is documented in configs/config.docker.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are passed to the containers by compose.yml.

mode: agency

server:
  port: 8080
  logLevel: debug
  # The browser-facing URL: the host port compose publishes. TNSW's
  # config.docker.yaml services entry "cda" also calls 8083.
  serviceURL: http://localhost:8083
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s

# Its own database on the shared Postgres, created by cda-init.
db:
  driver: postgres
  postgres:
    host: db
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: cda_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

# Its own namespace, created by cda-init, so TNSW and CDA workers never pick up
# each other's workflows.
temporal:
  host: temporal
  port: 7233
  namespace: cda

# CDA keeps no files of its own: it serves TNSW's storage, calling TNSW as
# CDA_TO_NSW (services entry tnsw), so officers open the documents
# traders uploaded there. Officers' uploads go to TNSW's upload route
# (scope nsw:storage:write), so TNSW checks them like a trader's. CDA
# generates no files itself, so CDA_TO_NSW doesn't hold
# nsw:storage:internalwrite, the scope of TNSW's internal upload route
# (internalUploadPath). A step that stores a generated file needs it granted
# in the IdP and added to the tnsw service's scopes.
storage:
  type: proxy
  # Seals the file tokens officers hold in place of stored file keys (here,
  # the tokens TNSW gives this agency): comma-separated kid:key pairs, newest
  # first, each key 32 random bytes in base64. This agency's own, never TNSW's.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  proxy:
    service: "tnsw"
    uploadPath: /api/v1/storage
    internalUploadPath: /api/v1/internal/storage
    downloadPath: /api/v1/storage/{key}
    deletePath: /api/v1/storage/{key}
    # What this agency's officers may upload; anything else is refused with
    # 415 before it is sent to TNSW. Each is compared exactly with the upload's
    # type, as TNSW compares it, and TNSW's own list decides what it accepts.
    allowedUploadTypes:
      - application/pdf
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls.
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# Officers sign in through the CDA portal client, and NSW injects and replies as NSW_TO_CDA.
# The audience is the CDA API resource server in
# idp/bootstrap/20-agency-cda.yaml. The keys are fetched in-network;
# the issuer is the browser-facing host the tokens are minted for.
authn:
  jwksURL: http://thunderid:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.cda.nsw-agency.local

# The catalog: the logical names the agency's workflow rules use, mapped to
# this deployment's IdP token roles and OAuth2 client ids. Each role here
# owns an injected workflow; tnsw names the client TNSW calls this agency as.
catalog:
  roles:
    officer: CDA Officer
  clients:
    tnsw: NSW_TO_CDA

# The cda folder of a one-trade-artifacts clone, which compose bind-mounts
# at /app/artifacts: ../one-trade-artifacts/cda by default, or set
# CDA_ARTIFACT_LOCAL_ROOT in .env to another clone's cda dir.
artifactLoader:
  type: local
  local:
    root: /app/artifacts
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: cda

# The CDA portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5176
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://api:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://thunderid:8090/oauth2/token
        clientID: CDA_TO_NSW
        clientSecret: "{{env:M2M_CDA_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
          - nsw:storage:write
        endpointParams:
          resource: https://api.nsw-srilanka.local

# Reference ID formats for the cda REFID_GENERATOR tasks, in the schema of
# github.com/OpenNSW/core/refid. The counters live in cda_db (refid_sequences)
# and restart at 0001 each year, on the Sri Lanka calendar (Asia/Colombo).
refid:
  issuers:
    - issuer: CDA
      formats:
        # Salmonella Free / Physical Quality Certificate application, numbered
        # when the officer review opens. certType is the trader's cert_type: P
        # (physical), S (salmonella) or PS (both). Produces: PQC/PS/0042/26/T
        - idType: pqc_application_ref
          timezone: Asia/Colombo
          segments:
            - type: literal
              value: "PQC/"
            - type: list
              list: pqc_cert_type
              param: certType
            - type: literal
              value: "/"
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{yyyy}"
                padding: 4
            - type: literal
              value: "/"
            - type: date
              format: "yy"
            - type: literal
              value: "/T"

        # The certificates' shared serial, drawn once per issuance so that when
        # both are issued they carry the same number and year. Produces: 1205/26
        - idType: pqc_certificate_serial
          timezone: Asia/Colombo
          segments:
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{yyyy}"
                padding: 4
            - type: literal
              value: "/"
            - type: date
              format: "yy"

        # Physical Quality Certificate number, from the serial. Produces:
        # PQC/P/1205/26
        - idType: pqc_physical_certificate
          segments:
            - type: literal
              value: "PQC/P/"
            - type: param
              param: serial
              pattern: "[0-9]{4}/[0-9]{2}"

        # Salmonella Free Certificate number, from the serial. Produces:
        # PQC/S/1205/26
        - idType: pqc_salmonella_certificate
          segments:
            - type: literal
              value: "PQC/S/"
            - type: param
              param: serial
              pattern: "[0-9]{4}/[0-9]{2}"
  lists:
    pqc_cert_type: [P, S, PS]

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode
