# NPQS (National Plant Quarantine Service) agency deployment, for a native run
# (`go run ./cmd/server` with npqs.env loaded). See configs/agency/npqs/README.md.
# The Docker Compose npqs-api reads config.docker.yaml instead; the two differ
# only in reaching the shared services by container hostname there rather than
# localhost. Every key is documented in configs/config.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are set by npqs.env.

mode: agency

# Its own database on the shared Postgres. ASSUMED name; create it before
# running migrations (`docker compose run --rm npqs-init` does).
db:
  driver: postgres
  postgres:
    host: localhost
    port: 55432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: npqs_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

server:
  # 8081 is where TNSW's services list in config.yaml points its "npqs" service.
  port: 8081
  logLevel: debug
  serviceURL: http://localhost:8081
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s
  paymentMethodsConfigPath: ./configs/agency/npqs/payment_methods.json
  catalogConfigPath: ./configs/agency/npqs/catalog.json

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://localhost:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://localhost:8090/oauth2/token
        clientID: NPQS_TO_NSW
        clientSecret: "{{env:M2M_NPQS_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
          - nsw:storage:write
        endpointParams:
          resource: https://api.nsw-srilanka.local

# The NPQS portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5174
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# NPQS keeps no files of its own: it serves TNSW's storage, calling TNSW as
# NPQS_TO_NSW (services entry tnsw), so officers open the documents
# traders uploaded there. TNSW applies its own upload limits.
storage:
  type: proxy
  # Seals the file tokens officers hold in place of stored file keys (here,
  # the tokens TNSW gives this agency): comma-separated kid:key pairs, newest
  # first, each key 32 random bytes in base64. This agency's own, never TNSW's.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  proxy:
    service: "tnsw"
    uploadPath: /api/v1/storage
    downloadPath: /api/v1/storage/{key}
    deletePath: /api/v1/storage/{key}

# Officers sign in through the NPQS portal client, and NSW injects and replies as NSW_TO_NPQS.
# The audience is the NPQS API resource server in
# idp/bootstrap/20-agency-npqs.yaml.
authn:
  jwksURL: http://localhost:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.npqs.nsw-agency.local

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode

# Its own namespace, so TNSW and NPQS workers never pick up each other's
# workflows. ASSUMED name; register it first (npqs-init does).
temporal:
  host: localhost
  port: 7233
  namespace: npqs

# The npqs folder of a one-trade-artifacts clone next to this repo, relative
# to where the server runs (the repo root). Point root at another clone's
# npqs dir to use that one.
artifactLoader:
  type: local
  local:
    root: ../one-trade-artifacts/npqs
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: npqs

refid:
  issuers:
    - issuer: NPQS
      formats:
        # Application reference: office-specific sequence, reset by UTC year.
        # Produces: TNSW/NPQS/SEA-CMB/PC/2026/000001
        - idType: phyto_request_ref
          segments:
            - type: literal
              value: "TNSW/NPQS/"
            - type: list
              list: npqs_office_location
              param: officeLocation
            - type: literal
              value: "/PC/"
            - type: date
              layout: "2006"
            - type: literal
              value: "/"
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{officeLocation}:{yyyy}"
                padding: 6

        # Lab sample reference, reset by UTC year. Produces: PQS/2026/0001
        - idType: lab_sample_ref
          segments:
            - type: literal
              value: "PQS/"
            - type: date
              layout: "2006"
            - type: literal
              value: "/"
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{yyyy}"
                padding: 4

        # Shared by the ePhyto NPPO certificate number sent to the IPPC Hub and
        # the replacement certificate reference. The Hub tracking number is a
        # separate value returned by the Hub. Produces: PCTSL-4FKU5794MV
        - idType: phytosanitary_certificate_ref
          segments:
            - type: literal
              value: "PCTSL-"
            - type: random
              random:
                scopeKey: "{issuer}:{idType}"
                charset: alphanumeric
                length: 10
  lists:
    npqs_office_location:
      - NPQS-KAT
      - SEA-CMB
      - AIR-BIA
      - AIR-JAF
      - AIR-CIAR
      - AIR-MRIA
      - SEA-HAM
      - SEA-KKS
      - PO-CME
      - PO-GAL
      - PO-KDY
      - PO-JAF
