# NPQS (National Plant Quarantine Service) agency deployment, for the Docker Compose
# npqs-init and npqs-api services (compose.yml points their CONFIG_PATH here). See
# configs/agency/npqs/README.md. A native run reads config.yaml instead; the two
# differ only in reaching the shared services by container hostname here rather
# than localhost. Every key is documented in configs/config.docker.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are passed to the containers by compose.yml.

mode: agency

# Its own database on the shared Postgres, created by npqs-init.
db:
  driver: postgres
  postgres:
    host: db
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: npqs_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

server:
  port: 8080
  logLevel: debug
  # The browser-facing URL: the host port compose publishes. TNSW's
  # services.docker.json "npqs" entry also calls 8081.
  serviceURL: http://localhost:8081
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s
  # services.docker.json: "tnsw" at api:8080, where notify_decision posts the
  # decision back.
  servicesConfigPath: configs/agency/npqs/services.docker.json
  paymentMethodsConfigPath: configs/agency/npqs/payment_methods.json
  catalogConfigPath: configs/agency/npqs/catalog.json

# The NPQS portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5174
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# NPQS keeps no files of its own: it serves TNSW's storage, calling TNSW as
# NPQS_TO_NSW (services.json, service tnsw), so officers open the documents
# traders uploaded there. TNSW applies its own upload limits.
storage:
  type: proxy
  # Seals the file tokens officers hold in place of stored file keys (here,
  # the tokens TNSW gives this agency): comma-separated kid:key pairs, newest
  # first, each key 32 random bytes in base64. This agency's own, never TNSW's.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long an officer's file token lasts, in seconds. Optional: 3600 when unset.
  tokenTTLSeconds: 3600
  proxy:
    service: "tnsw"
    uploadPath: /api/v1/storage
    downloadPath: /api/v1/storage/{key}
    deletePath: /api/v1/storage/{key}

# Officers sign in through the NPQS portal client, and NSW injects and replies as NSW_TO_NPQS.
# The audience is the NPQS API resource server in
# idp/bootstrap/20-agency-npqs.yaml. The keys are fetched in-network;
# the issuer is the browser-facing host the tokens are minted for.
authn:
  jwksURL: https://thunderid:8090/oauth2/jwks
  issuer: https://localhost:8090
  audience: https://api.npqs.nsw-agency.local
  clientIDs:
    - OGA_PORTAL_APP_NPQS
    - NSW_TO_NPQS
  # Only honored when APP_ENV=development.
  insecureSkipTLSVerify: true

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode

# Its own namespace, created by npqs-init, so TNSW and NPQS workers never pick up
# each other's workflows.
temporal:
  host: temporal
  port: 7233
  namespace: npqs

# The npqs-v2 folder of a one-trade-artifacts clone, which compose bind-mounts
# at /app/artifacts: ../one-trade-artifacts/npqs-v2 by default, or set
# NPQS_ARTIFACT_LOCAL_ROOT in .env to another clone's npqs-v2 dir.
artifactLoader:
  type: local
  local:
    root: /app/artifacts
  # Or straight from GitHub (branch feat/npqs-v2-agency
  # until it merges), with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: feat/npqs-v2-agency
  #   basePath: npqs-v2

# The npqs-v2 artifacts use no REFID_GENERATOR tasks.
refid:
  issuers: []
