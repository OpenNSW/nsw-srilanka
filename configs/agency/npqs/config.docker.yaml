# NPQS (National Plant Quarantine Service) agency deployment, for the Docker Compose
# npqs-init and npqs-api services (compose.yml points their CONFIG_PATH here). See
# configs/agency/npqs/README.md. A native run reads config.yaml instead; the two
# differ only in reaching the shared services by container hostname here rather
# than localhost. Every key is documented in configs/config.docker.example.yaml.
#
# Never write a secret into this file: use "{{env:NAME}}" or "{{file:/path}}".
# The ones below are passed to the containers by compose.yml.

mode: agency

# Its own database on the shared Postgres, created by npqs-init.
db:
  driver: postgres
  postgres:
    host: db
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: npqs_db
    sslMode: disable
    pool:
      maxIdleConns: 10
      maxOpenConns: 100
      maxConnLifetimeSeconds: 3600

server:
  port: 8080
  logLevel: debug
  # The browser-facing URL: the host port compose publishes. TNSW's
  # config.docker.yaml services entry "npqs" also calls 8081.
  serviceURL: http://localhost:8081
  maxRequestBytes: 33554432
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s
  paymentMethodsConfigPath: configs/agency/npqs/payment_methods.json

# The catalog: the logical names the agency's workflow rules use, mapped to
# this deployment's IdP token roles and OAuth2 client ids. Each role here
# owns an injected workflow; tnsw names the client TNSW calls this agency as.
catalog:
  roles:
    officer: NPQS Officer
  clients:
    tnsw: NSW_TO_NPQS

# Outbound HTTP services (core/remote). Secrets use {{env:NAME}} or
# {{file:/path}} placeholders, expanded with the rest of this config at load.
services:
  - id: tnsw
    url: http://api:8080
    timeout: 30s
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://thunderid:8090/oauth2/token
        clientID: NPQS_TO_NSW
        clientSecret: "{{env:M2M_NPQS_TO_NSW_SECRET}}"
        scopes:
          - nsw:task:write
          - nsw:storage:read
          - nsw:storage:write
          - nsw:storage:internalwrite
        endpointParams:
          resource: https://api.nsw-srilanka.local

# The NPQS portal (the trader-app in agency mode).
cors:
  allowedOrigins:
    - http://localhost:5174
  allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization]
  allowCredentials: true
  maxAge: 3600

# NPQS keeps no files of its own: it serves TNSW's storage, calling TNSW as
# NPQS_TO_NSW (services entry tnsw), so officers open the documents
# traders uploaded there. Officers' uploads go to TNSW's upload route
# (scope nsw:storage:write), so TNSW checks them like a trader's. The files this
# agency generates itself go to TNSW's internal upload route (scope
# nsw:storage:internalwrite), which accepts the types TNSW grants this client.
storage:
  type: proxy
  # Seals the file tokens officers hold in place of stored file keys (here,
  # the tokens TNSW gives this agency): comma-separated kid:key pairs, newest
  # first, each key 32 random bytes in base64. This agency's own, never TNSW's.
  tokenKeyset: "{{env:STORAGE_TOKEN_KEYSET}}"
  # How long the file tokens an officer reads with last, in seconds. Optional:
  # 3600 when unset. Upload tokens, which can only be submitted, don't expire.
  tokenTTLSeconds: 3600
  proxy:
    service: "tnsw"
    uploadPath: /api/v1/storage
    internalUploadPath: /api/v1/internal/storage
    downloadPath: /api/v1/storage/{key}
    deletePath: /api/v1/storage/{key}
    # What this agency's officers may upload; anything else is refused with
    # 415 before it is sent to TNSW. Each is compared exactly with the upload's
    # type, as TNSW compares it, and TNSW's own list decides what it accepts.
    allowedUploadTypes:
      - application/pdf
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls.
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/xml
      - application/xml

# Officers sign in through the NPQS portal client, and NSW injects and replies as NSW_TO_NPQS.
# The audience is the NPQS API resource server in
# idp/bootstrap/20-agency-npqs.yaml. The keys are fetched in-network;
# the issuer is the browser-facing host the tokens are minted for.
authn:
  jwksURL: http://thunderid:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: https://api.npqs.nsw-agency.local

# Placeholder providers.
notification:
  providers:
    email:
      baseURL: https://email.svc.local
      token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
    sms:
      baseURL: https://smsservice.lk
      userName: replace-with-actual-username
      password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
      sidCode: sidCode

# Its own namespace, created by npqs-init, so TNSW and NPQS workers never pick up
# each other's workflows.
temporal:
  host: temporal
  port: 7233
  namespace: npqs

# The npqs folder of a one-trade-artifacts clone, which compose bind-mounts
# at /app/artifacts: ../one-trade-artifacts/npqs by default, or set
# NPQS_ARTIFACT_LOCAL_ROOT in .env to another clone's npqs dir.
artifactLoader:
  type: local
  local:
    root: /app/artifacts
  # Or straight from GitHub, with type: github:
  # github:
  #   owner: OpenNSW
  #   repo: one-trade-artifacts
  #   ref: main
  #   basePath: npqs

refid:
  issuers:
    - issuer: NPQS
      formats:
        # Application reference: office-specific sequence, reset by UTC year.
        # Produces: TNSW/NPQS/SEA-CMB/PC/2026/000001
        - idType: phyto_request_ref
          segments:
            - type: literal
              value: "TNSW/NPQS/"
            - type: list
              list: npqs_office_location
              param: officeLocation
            - type: literal
              value: "/PC/"
            - type: date
              layout: "2006"
            - type: literal
              value: "/"
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{officeLocation}:{yyyy}"
                padding: 6

        # Lab sample reference, reset by UTC year. Produces: PQS/2026/0001
        - idType: lab_sample_ref
          segments:
            - type: literal
              value: "PQS/"
            - type: date
              layout: "2006"
            - type: literal
              value: "/"
            - type: sequence
              sequence:
                scopeKey: "{issuer}:{idType}:{yyyy}"
                padding: 4

        # Shared by the ePhyto NPPO certificate number sent to the IPPC Hub and
        # the replacement certificate reference. The Hub tracking number is a
        # separate value returned by the Hub. Produces: PCTSL-4FKU5794MV
        - idType: phytosanitary_certificate_ref
          segments:
            - type: literal
              value: "PCTSL-"
            - type: random
              random:
                scopeKey: "{issuer}:{idType}"
                charset: alphanumeric
                length: 10
  lists:
    npqs_office_location:
      - NPQS-KAT
      - SEA-CMB
      - AIR-BIA
      - AIR-JAF
      - AIR-CIAR
      - AIR-MRIA
      - SEA-HAM
      - SEA-KKS
      - PO-CME
      - PO-GAL
      - PO-KDY
      - PO-JAF
