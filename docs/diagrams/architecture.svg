<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1290" width="1200" height="1290" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">National Single Window architecture</title>
  <desc id="desc">Traders and CHAs use TNSW, the Trader Portal and backend; agency officers use the CDA, FCAU, NPQS, SLTB and EFC agencies, which exchange applications with TNSW. The platform relies on ThunderID, Temporal, email, audit, PostgreSQL and S3 object storage for documents and configurations. TNSW connects to SLPA's CMS, GovPay, SLC Edge and through it ASYCUDA, an SMS provider, and the IPPC hub, which reaches plant protection organisations in other countries.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #6e7781; fill: none; stroke-width: 1.75; }
    .head { fill: #6e7781; }
    .upload { stroke: #bf8700; fill: none; stroke-width: 1.75; stroke-dasharray: 7 6; }
    .uploadhead { fill: #bf8700; }
    .notify { stroke: #8c959f; fill: none; stroke-width: 1.75; stroke-dasharray: 5 5; }
    .panel-infra { fill: #f6f8fa; stroke: #d0d7de; }
    .panel-nsw { fill: #f3fbf7; stroke: #a7dcc4; }
    .actor { fill: #ffffff; stroke: #d0d7de; }
    .nsw { fill: #e1f5ee; stroke: #0f6e56; }
    .nsw-text { fill: #0b5a46; }
    .nsw-sub { fill: #2f7d68; }
    .ext { fill: #faece7; stroke: #993c1d; }
    .ext-text { fill: #7a2e14; }
    .ext-sub { fill: #a4532f; }
    .doc { fill: #faeeda; stroke: #854f0b; }
    .doc-text { fill: #6b3f08; }
    .store { fill: #ffffff; stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .upload { stroke: #d29922; }
      .uploadhead { fill: #d29922; }
      .notify { stroke: #6e7681; }
      .panel-infra { fill: #161b22; stroke: #30363d; }
      .panel-nsw { fill: #0f1d18; stroke: #1f4d3d; }
      .actor { fill: #161b22; stroke: #3d444d; }
      .nsw { fill: #0c2e24; stroke: #3fb68b; }
      .nsw-text { fill: #b7ecd7; }
      .nsw-sub { fill: #7cc9ab; }
      .ext { fill: #331a12; stroke: #e0794f; }
      .ext-text { fill: #f6c4ae; }
      .ext-sub { fill: #d99a7c; }
      .doc { fill: #33250b; stroke: #d29922; }
      .doc-text { fill: #f2d68f; }
      .store { fill: #0d1117; stroke: #3d444d; }
    }
    rect { stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .n { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .s { font-size: 13px; text-anchor: middle; }
    .big { font-size: 26px; font-weight: 700; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    .note { font-size: 12px; font-style: italic; }
    .legend { font-size: 15px; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="arrow-upload" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="uploadhead"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="1290"/>

  <!-- People -->
  <rect class="actor card" x="364" y="50" width="200" height="54" rx="27"/>
  <text class="n title" x="464" y="83">Agency officers</text>
  <rect class="actor card" x="613" y="50" width="200" height="54" rx="27"/>
  <text class="n title" x="713" y="83">Traders and CHAs</text>

  <!-- Infrastructure -->
  <rect class="panel-infra" x="40" y="170" width="260" height="760" rx="18"/>
  <text class="label muted" x="64" y="206">INFRASTRUCTURE</text>

  <rect class="nsw card" x="64" y="230" width="212" height="64" rx="12"/>
  <text class="n nsw-text" x="170" y="257">ThunderID</text>
  <text class="s nsw-sub" x="170" y="279">identity and sign-in</text>
  <rect class="nsw card" x="64" y="312" width="212" height="64" rx="12"/>
  <text class="n nsw-text" x="170" y="339">Temporal</text>
  <text class="s nsw-sub" x="170" y="361">workflow engine</text>
  <rect class="nsw card" x="64" y="394" width="212" height="64" rx="12"/>
  <text class="n nsw-text" x="170" y="421">Email</text>
  <text class="s nsw-sub" x="170" y="443">Silver Mail</text>
  <rect class="nsw card" x="64" y="476" width="212" height="64" rx="12"/>
  <text class="n nsw-text" x="170" y="503">Audit</text>
  <text class="s nsw-sub" x="170" y="525">Argus</text>
  <rect class="nsw card" x="64" y="558" width="212" height="64" rx="12"/>
  <text class="n nsw-text" x="170" y="585">PostgreSQL</text>
  <text class="s nsw-sub" x="170" y="607">databases</text>

  <rect class="store" x="64" y="646" width="212" height="250" rx="14"/>
  <text class="s muted" x="170" y="676">Object storage (S3)</text>
  <rect class="doc card" x="84" y="694" width="172" height="80" rx="12"/>
  <text class="n doc-text" x="170" y="728">Documents</text>
  <text class="s doc-text" x="170" y="750">uploaded by traders</text>
  <rect class="nsw card" x="84" y="792" width="172" height="80" rx="12"/>
  <text class="n nsw-text" x="170" y="826">Configurations</text>
  <text class="s nsw-sub" x="170" y="848">workflows and forms</text>

  <!-- TNSW platform -->
  <rect class="panel-nsw" x="340" y="170" width="500" height="760" rx="18"/>
  <text class="label muted" x="364" y="904">TNSW PLATFORM</text>

  <rect class="nsw card" x="364" y="236" width="200" height="100" rx="12"/>
  <text class="n nsw-text" x="464" y="276">CDA</text>
  <text class="s nsw-sub" x="464" y="298">Coconut Development</text>
  <text class="s nsw-sub" x="464" y="316">Authority</text>
  <rect class="nsw card" x="364" y="366" width="200" height="100" rx="12"/>
  <text class="n nsw-text" x="464" y="406">FCAU</text>
  <text class="s nsw-sub" x="464" y="428">Food Control</text>
  <text class="s nsw-sub" x="464" y="446">Administration Unit</text>
  <rect class="nsw card" x="364" y="496" width="200" height="100" rx="12"/>
  <text class="n nsw-text" x="464" y="536">NPQS</text>
  <text class="s nsw-sub" x="464" y="558">National Plant</text>
  <text class="s nsw-sub" x="464" y="576">Quarantine Service</text>
  <rect class="nsw card" x="364" y="626" width="200" height="100" rx="12"/>
  <text class="n nsw-text" x="464" y="666">SLTB</text>
  <text class="s nsw-sub" x="464" y="688">Sri Lanka</text>
  <text class="s nsw-sub" x="464" y="706">Tea Board</text>
  <rect class="nsw card" x="364" y="756" width="200" height="100" rx="12"/>
  <text class="n nsw-text" x="464" y="796">EFC</text>
  <text class="s nsw-sub" x="464" y="818">Export Facilitation</text>
  <text class="s nsw-sub" x="464" y="836">Center</text>

  <rect class="nsw card" x="610" y="236" width="206" height="620" rx="14"/>
  <text class="big nsw-text" x="713" y="530">TNSW</text>
  <text class="s nsw-sub" x="713" y="558">Trader Portal</text>
  <text class="s nsw-sub" x="713" y="577">and backend</text>

  <!-- Connected systems -->
  <rect class="ext card" x="880" y="236" width="280" height="76" rx="12"/>
  <text class="n ext-text" x="1020" y="268">CMS</text>
  <text class="s ext-sub" x="1020" y="291">Sri Lanka Ports Authority</text>
  <rect class="ext card" x="880" y="366" width="280" height="76" rx="12"/>
  <text class="n ext-text" x="1020" y="398">GovPay</text>
  <text class="s ext-sub" x="1020" y="421">online payments</text>
  <rect class="ext card" x="880" y="496" width="280" height="76" rx="12"/>
  <text class="n ext-text" x="1020" y="528">SLC Edge</text>
  <text class="s ext-sub" x="1020" y="551">customs gateway</text>
  <rect class="ext card" x="880" y="626" width="280" height="76" rx="12"/>
  <text class="n ext-text" x="1020" y="658">ASYCUDA</text>
  <text class="s ext-sub" x="1020" y="681">Sri Lanka Customs</text>
  <rect class="ext card" x="880" y="756" width="280" height="76" rx="12"/>
  <text class="n ext-text" x="1020" y="788">SMS provider</text>
  <text class="s ext-sub" x="1020" y="811">text messages</text>

  <rect class="ext card" x="593" y="980" width="240" height="76" rx="12"/>
  <text class="n ext-text" x="713" y="1012">IPPC hub</text>
  <text class="s ext-sub" x="713" y="1035">ePhyto certificates</text>
  <rect class="ext card" x="593" y="1100" width="240" height="76" rx="12"/>
  <text class="n ext-text" x="713" y="1132">NPPO</text>
  <text class="s ext-sub" x="713" y="1155">plant protection, other countries</text>

  <!-- People to the platform -->
  <path class="line" d="M464 104 V232" marker-end="url(#arrow)"/>
  <path class="line" d="M713 104 V232" marker-end="url(#arrow)"/>

  <!-- Traders upload documents straight to storage -->
  <path class="upload" d="M713 50 V24 H18 V734 H80" marker-end="url(#arrow-upload)"/>
  <text class="note muted" x="30" y="44">documents upload from the browser (signed URL)</text>

  <!-- Infrastructure and platform -->
  <path class="line" d="M303 550 H337" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Agencies and TNSW -->
  <path class="line" d="M567 286 H607" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M567 416 H607" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M567 546 H607" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M567 676 H607" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M567 806 H607" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- TNSW and connected systems -->
  <path class="line" d="M819 274 H877" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M877 404 H819" marker-end="url(#arrow)"/>
  <path class="line" d="M819 534 H877" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M1020 575 V623" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M819 794 H877" marker-end="url(#arrow)"/>

  <!-- GovPay payment notifications -->
  <path class="notify" d="M1020 363 V315" marker-end="url(#arrow)"/>
  <path class="notify" d="M1020 445 V493" marker-end="url(#arrow)"/>
  <text class="note muted" x="1032" y="343">payment status</text>
  <text class="note muted" x="1032" y="473">payment status</text>

  <!-- ePhyto -->
  <path class="line" d="M713 856 V977" marker-end="url(#arrow)"/>
  <path class="line" d="M713 1056 V1097" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect class="nsw" x="40" y="1226" width="22" height="22" rx="5"/>
  <text class="legend muted" x="72" y="1243">NSW platform and its services</text>
  <rect class="ext" x="330" y="1226" width="22" height="22" rx="5"/>
  <text class="legend muted" x="362" y="1243">Connected systems</text>
  <rect class="doc" x="540" y="1226" width="22" height="22" rx="5"/>
  <text class="legend muted" x="572" y="1243">Documents traders upload</text>
</svg>
