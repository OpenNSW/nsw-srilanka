networks:
  nsw-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  thunderid-db:
    driver: local
  # Key material is generated per deployment, not shipped in the image. Without these
  # volumes the server regenerates a different AES key and cannot decrypt the client
  # secrets already stored in configdb.db.
  thunderid-certs:
    driver: local
  thunderid-secrets:
    driver: local
  temporal_data:
    driver: local
  bucket_data:
    driver: local

# The environment every service that reads the server's config file needs —
# api, migrate and seed-companies all run on configs/config.docker.yaml (seeded
# by `make setup` from configs/config.docker.example.yaml). Each reads only its
# own sections of it, but every {{env:...}} placeholder in the file is resolved
# regardless, so all of them get every secret the file references.
x-config-env: &config-env
  CONFIG_PATH: configs/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  ARGUS_API_KEY: ${ARGUS_API_KEY:-nsw-super-secret-audit-token}
  SLPA_WEBHOOK_SECRET: ${SLPA_WEBHOOK_SECRET:-local-dev-slpa-webhook-secret}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}
  STORAGE_LOCAL_PUT_SECRET: ${STORAGE_LOCAL_PUT_SECRET:-local-dev-put-secret}
  STORAGE_TOKEN_KEYSET: ${STORAGE_TOKEN_KEYSET:-dev:dG5zdy1sb2NhbC1kZXYtZmlsZS10b2tlbi1rZXktMDE=}
  # For a private artifacts repo: reference it as {{env:ARTIFACT_GITHUB_TOKEN}}
  # under artifactLoader.github.token.
  ARTIFACT_GITHUB_TOKEN: ${ARTIFACT_GITHUB_TOKEN:-}

# The same for CDA's cda-init and cda-api, on configs/agency/cda/config.docker.yaml.
x-cda-config-env: &cda-config-env
  CONFIG_PATH: configs/agency/cda/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  # Each deployment seals its own file tokens, so not TNSW's keyset.
  STORAGE_TOKEN_KEYSET: ${CDA_STORAGE_TOKEN_KEYSET:-dev:Y2RhLWxvY2FsLWRldi1maWxlLXRva2VuLWtleS0wMDE=}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}

# The same for EFC's efc-init and efc-api, on
# configs/agency/efc/config.docker.yaml.
x-efc-config-env: &efc-config-env
  CONFIG_PATH: configs/agency/efc/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  STORAGE_TOKEN_KEYSET: ${EFC_STORAGE_TOKEN_KEYSET:-dev:ZWZjLWxvY2FsLWRldi1maWxlLXRva2VuLWtleS0wMDE=}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}

# The same for NPQS' npqs-init and npqs-api, on
# configs/agency/npqs/config.docker.yaml.
x-npqs-config-env: &npqs-config-env
  CONFIG_PATH: configs/agency/npqs/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  STORAGE_TOKEN_KEYSET: ${NPQS_STORAGE_TOKEN_KEYSET:-dev:bnBxcy1sb2NhbC1kZXYtZmlsZS10b2tlbi1rZXktMDE=}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}

# The same for SLTB's sltb-init and sltb-api, on
# configs/agency/sltb/config.docker.yaml.
x-sltb-config-env: &sltb-config-env
  CONFIG_PATH: configs/agency/sltb/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  STORAGE_TOKEN_KEYSET: ${SLTB_STORAGE_TOKEN_KEYSET:-dev:c2x0Yi1sb2NhbC1kZXYtZmlsZS10b2tlbi1rZXktMDE=}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}

# The same for FCAU's fcau-init and fcau-api, on
# configs/agency/fcau/config.docker.yaml.
x-fcau-config-env: &fcau-config-env
  CONFIG_PATH: configs/agency/fcau/config.docker.yaml
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  STORAGE_TOKEN_KEYSET: ${FCAU_STORAGE_TOKEN_KEYSET:-dev:ZmNhdS1sb2NhbC1kZXYtZmlsZS10b2tlbi1rZXktMDE=}
  NOTIFICATION_EMAIL_TOKEN: ${NOTIFICATION_EMAIL_TOKEN:-replace-with-actual-token}
  NOTIFICATION_SMS_PASSWORD: ${NOTIFICATION_SMS_PASSWORD:-replace-with-actual-password}

services:
  # -------------------------------------------------------------------
  # 1. Shared Infrastructure Database (PostgreSQL)
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nsw-postgres
    networks:
      - nsw-network
    ports:
      # Expose standard port on localhost for migration tooling scripts to fire against
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-nsw_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nsw_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # 2. Identity Provider Core Services (Thunder Stack)
  # -------------------------------------------------------------------
  # Stage A: Seed static database schemas from container image layer
  thunderid-db-init:
    image: ghcr.io/thunder-id/thunderid:1.0.1
    container_name: thunderid-db-init
    # Seed only when the volume is empty. An unconditional copy would overwrite
    # configdb.db on every `up`, silently reverting the bootstrap and seed.
    command: sh -c '[ -f /data/configdb.db ] || cp -r /opt/thunderid/database/* /data/'
    volumes:
      - thunderid-db:/data
    restart: "no"

  # Stage B: generate key material, then import the declarative bootstrap resources:
  # the image's own, then every document in idp/bootstrap/ (admin-cli, the NSW
  # platform, the agencies and the sample data). See idp/README.md.
  thunderid-setup:
    image: ghcr.io/thunder-id/thunderid:1.0.1
    container_name: thunderid-setup
    command: ./setup.sh
    networks:
      - nsw-network
    env_file:
      - ./idp/.env
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Generated here, so must outlive this container.
      - thunderid-certs:/opt/thunderid/config/certs
      - thunderid-secrets:/opt/thunderid/config/secrets
      # A subdirectory, so the image's 01-/02- documents stay visible beside it.
      - ./idp/bootstrap:/opt/thunderid/bootstrap/nsw:ro
      # setup.sh derives the public URL from it, which the Console's redirect URIs
      # use. Without it, it reads the image's https:// default.
      - ./idp/deployment.yaml:/opt/thunderid/deployment.yaml:ro
    depends_on:
      thunderid-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stage C: Boot active server instances listening for authentication queries
  thunderid:
    image: ghcr.io/thunder-id/thunderid:1.0.1
    container_name: thunderid
    networks:
      - nsw-network
    ports:
      # Loopback only: the IdP serves plain HTTP (server.http_only in
      # idp/deployment.yaml). Containers reach it over nsw-network.
      - "127.0.0.1:${IDP_PORT:-8090}:8090"
    env_file:
      - ./idp/.env
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Read-only: consume the key material Stage B generated, never regenerate it.
      - thunderid-certs:/opt/thunderid/config/certs:ro
      - thunderid-secrets:/opt/thunderid/config/secrets:ro
      - ./idp/deployment.yaml:/opt/thunderid/deployment.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8090/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      thunderid-setup:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # 3. Temporal Workflow Engine Infrastructure
  # -------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.28.3
    container_name: temporal
    networks:
      - nsw-network
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-changeme}
      - POSTGRES_SEEDS=db
      - DB_NAME=temporal
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.48.0
    container_name: temporal-ui
    networks:
      - nsw-network
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # -------------------------------------------------------------------
  # 4. Database Migrations
  # -------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        # Passed through from the environment, so overriding the migrator version
        # needs no edit here:
        #   MIGRATE_VERSION=<pseudo-version> docker compose build migrate
        # Listed by name with no value on purpose — when the variable is unset,
        # Compose omits the build arg entirely and the Dockerfile's pinned
        # default applies. Repeating the version here instead would give it a
        # second home to drift from.
        - MIGRATE_VERSION
    container_name: tnsw-migrate
    networks:
      - nsw-network
    volumes:
      # The api's config file, for its db section; the SQL itself is baked in.
      - ./configs:/app/configs:ro
    environment: *config-env
    # No `command:` — the migrate image's default CMD is ["migrate", "up"].
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # 4b. Local Dev Seed Data
  # -------------------------------------------------------------------
  # Declaratively (re)applies the example companies via `otc company apply`
  # every time the stack comes up. Idempotent (upsert by id), so it's safe to
  # re-run on every `docker compose up`. Not a dependency of `api` — company
  # data isn't required for the API to start, so this runs alongside it
  # rather than gating it.
  seed-companies:
    build:
      context: .
      dockerfile: Dockerfile
      # No `target:` — defaults to the last stage (`runtime`), which already
      # bakes the `otc` binary at /usr/local/bin/otc.
    container_name: tnsw-seed-companies
    networks:
      - nsw-network
    volumes:
      # Mount live, not baked-in, so editing the file needs no rebuild.
      - ./configs:/app/configs:ro
    # The api's own config file: otc reads only its db section.
    environment: *config-env
    command: ["otc", "company", "apply", "-f", "configs/companies.json"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # 5. Backend Orchestration API Layer
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tnsw-api
    networks:
      - nsw-network
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Mount configs from the repo (read-only) instead of baking them into
      # the image — a config change needs no rebuild, just a restart.
      - ./configs:/app/configs:ro
      # Mount local test artifacts for development and workflow test harnesses.
      - ./test:/app/test:ro
      # Operator-supplied IPPC Hub mTLS material (git-ignored), referenced by
      # the "ippc-hub" service's tls block in services.docker.json. Create
      # ./certs/ippc/{nppo.crt,nppo.key} from your Hub Admin Console connection.
      - ./certs/ippc:/certs/ippc:ro
      # This GO's GovPay+ RSA private key (git-ignored), referenced by the govpay
      # gateway's "private_key": "file:/certs/govpay/go_private.pem" in
      # payment_methods.json.
      - ./certs/govpay:/certs/govpay:ro
      # Host-side artifacts dir for artifactLoader.type: local — the tnsw/ dir of
      # a OpenNSW/one-trade-artifacts clone, set in .env; config.docker.yaml
      # then reads it at the target path below (artifactLoader.local.root).
      # Unused by the default GitHub loader (Docker just creates the dir if the
      # clone is absent).
      - ${ARTIFACT_LOCAL_ROOT:-../one-trade-artifacts/tnsw}:/app/artifacts:ro
      # Persist runtime blob storage written by the storage driver.
      - bucket_data:/app/bucket
    environment:
      # Every server setting lives in config.docker.yaml (see x-config-env) —
      # edit it there, not here; what follows is only what the file cannot hold.
      <<: *config-env
      # APP_ENV gates the insecure-TLS flags (authn.insecureSkipTLSVerify in
      # config.yaml, insecure_skip_tls_verify in services.json): they are only
      # honored when APP_ENV=development, otherwise the backend refuses to start.
      # Injected as "development" by `make dev`/`make preview` (dev only); left empty
      # for a raw `docker compose up` or any deployment, which then fails closed.
      APP_ENV: ${APP_ENV:-}
      # NSW -> Agency m2m client secrets, referenced as env:... in services.*.json
      M2M_NSW_TO_NPQS_SECRET: ${M2M_NSW_TO_NPQS_SECRET:-1234}
      M2M_NSW_TO_FCAU_SECRET: ${M2M_NSW_TO_FCAU_SECRET:-1234}
      M2M_NSW_TO_CDA_SECRET: ${M2M_NSW_TO_CDA_SECRET:-1234}
      M2M_NSW_TO_SLPA_SECRET: ${M2M_NSW_TO_SLPA_SECRET:-1234}
      M2M_NSW_TO_EFC_SECRET: ${M2M_NSW_TO_EFC_SECRET:-1234}
      M2M_NSW_TO_SLTB_SECRET: ${M2M_NSW_TO_SLTB_SECRET:-1234}
      M2M_NSW_TO_ASYCUDA_SECRET: ${M2M_NSW_TO_ASYCUDA_SECRET:-1234}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      thunderid:
        condition: service_started
      argus:
        condition: service_started

  # -------------------------------------------------------------------
  # 6a. Trader Portal Runtime Config Bootstrap
  # -------------------------------------------------------------------
  # One-shot: creates apps/trader-app/public/config.js from
  # config.example.js if missing, then exits — before trader-portal starts.
  # Mounts the (already-existing) public/ directory, not the config.js file
  # itself: a directory bind mount writes straight through to the real host
  # file, whereas bind-mounting a not-yet-existing single file would make
  # Docker silently create an empty directory there instead.
  trader-portal-config:
    image: alpine:3.22
    volumes:
      - ./portals/apps/trader-app/public:/config
    command: sh -c "test -f /config/config.js || cp /config/config.example.js /config/config.js"

  # -------------------------------------------------------------------
  # 6b. Trader Portal Frontend (React SPA served via Nginx)
  # -------------------------------------------------------------------
  trader-portal:
    build:
      # Build context is the portals workspace root; the Dockerfile copies
      # the root pnpm files and apps/trader-app, then builds with pnpm.
      context: ./portals
      dockerfile: apps/trader-app/Dockerfile
    container_name: tnsw-web
    networks:
      - nsw-network
    ports:
      # Nginx listens on 8080 inside the container; expose on 5173 to match
      # APP_URL and the backend CORS allow-list.
      - "${TRADER_PORTAL_PORT:-5173}:8080"
    volumes:
      # Bind-mounted directly — same config.js the raw `vite dev` workflow
      # uses (see public/config.example.js). trader-portal-config (above)
      # guarantees it exists first. The image doesn't generate this file
      # itself (see Dockerfile).
      - ./portals/apps/trader-app/public/config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      trader-portal-config:
        condition: service_completed_successfully
      api:
        condition: service_started
      thunderid:
        condition: service_started

  # -------------------------------------------------------------------
  # 7. Audit Service (Argus)
  # -------------------------------------------------------------------
  argus:
    build:
      context: https://github.com/LSFLK/argus.git#main
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: 858f4ee608e839fac48873bfb4d582e14105a8df
    image: nsw-argus:local
    container_name: nsw-argus
    networks:
      - nsw-network
    ports:
      - "${ARGUS_PORT:-3001}:3001"
    volumes:
      - ./configs/argus/config.yaml:/app/configs/config.yaml:ro
    environment:
      - ENVIRONMENT=development
      - PORT=3001
      - AUDIT_ENUMS_CONFIG=/app/configs/config.yaml
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nsw_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ARGUS_API_KEY=${ARGUS_API_KEY:-nsw-super-secret-audit-token}
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------
  # 8. CDA Agency
  # -------------------------------------------------------------------
  # The same backend and trader-app run as the Coconut Development Authority
  # (mode: agency, see docs/agency.md), next to TNSW. CDA shares Postgres, Temporal and the IdP with TNSW, but has its own database
  # and Temporal namespace, so neither picks up the other's workflows. Config lives
  # in configs/agency/cda/ (config.docker.yaml for these services). TNSW reaches it at host.docker.internal:8083, as its
  # services.docker.json "cda" entry already expects.

  # One-shot: creates cda_db on the shared Postgres and the cda Temporal namespace if
  # missing, then migrates cda_db. Its image puts psql (the base), the temporal CLI and
  # the migrator with its migrations (from the migrate service's image) in one place.
  # The migrator reads cda_db from the db section of CDA's config file, as cda-api does.
  cda-init:
    build:
      context: .
      additional_contexts:
        migrate: service:migrate
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY --from=temporalio/auto-setup:1.28.3 /usr/local/bin/temporal /usr/local/bin/temporal
        COPY --from=migrate /usr/local/bin/migrate /usr/local/bin/migrate
        COPY --from=migrate /app/migrations /app/migrations
        WORKDIR /app
    container_name: cda-init
    networks:
      - nsw-network
    volumes:
      - ./configs:/app/configs:ro
    environment:
      <<: *cda-config-env
      PGHOST: db
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'cda_db'" | grep -q 1 \
          || psql -d postgres -c 'CREATE DATABASE cda_db'
        temporal operator namespace describe --namespace cda --address temporal:7233 >/dev/null 2>&1 \
          || temporal operator namespace create --namespace cda --address temporal:7233
        migrate up
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  cda-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cda-api
    networks:
      - nsw-network
    ports:
      # Fixed: the CDA portal's config and TNSW's "cda" service entry both call 8083.
      - "8083:8080"
    volumes:
      - ./configs:/app/configs:ro
      # For artifactLoader.type: local in config.docker.yaml — a one-trade-artifacts
      # clone's cda-v2/ dir.
      - ${CDA_ARTIFACT_LOCAL_ROOT:-../one-trade-artifacts/cda-v2}:/app/artifacts:ro
    environment:
      # Every server setting lives in configs/agency/cda/config.docker.yaml (see
      # x-cda-config-env); what follows is only what the file cannot hold.
      <<: *cda-config-env
      # Same gate as the api service: insecure TLS is honored only in development.
      APP_ENV: ${APP_ENV:-}
      # CDA -> NSW m2m client secret, referenced as env:... in services.docker.json.
      M2M_CDA_TO_NSW_SECRET: ${M2M_CDA_TO_NSW_SECRET:-1234}
    depends_on:
      cda-init:
        condition: service_completed_successfully
      thunderid:
        condition: service_started

  cda-portal:
    build:
      context: ./portals
      dockerfile: apps/trader-app/Dockerfile
    container_name: cda-web
    networks:
      - nsw-network
    ports:
      # Fixed: portal-config.js's APP_URL and the IdP's redirect URI for
      # OGA_PORTAL_APP_CDA are both on 5176.
      - "5176:8080"
    volumes:
      - ./configs/agency/cda/portal-config.js:/usr/share/nginx/html/config.js:ro
      - ./configs/agency/cda/branding.json:/usr/share/nginx/html/configs/branding.json:ro

  # -------------------------------------------------------------------
  # 9. EFC Agency
  # -------------------------------------------------------------------
  # The same backend and trader-app run as the Export Facilitation Center, EFC
  # (mode: agency, see docs/agency.md), next to TNSW, exactly as CDA does above: shared Postgres, Temporal
  # and IdP, but its own database and Temporal namespace. Config lives in
  # configs/agency/efc/ (config.docker.yaml for these services). TNSW reaches it at
  # host.docker.internal:8085, as its services.docker.json "efc" entry already expects.

  # One-shot: creates efc_db on the shared Postgres and the efc Temporal
  # namespace if missing, then migrates efc_db. Same image as cda-init.
  efc-init:
    build:
      context: .
      additional_contexts:
        migrate: service:migrate
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY --from=temporalio/auto-setup:1.28.3 /usr/local/bin/temporal /usr/local/bin/temporal
        COPY --from=migrate /usr/local/bin/migrate /usr/local/bin/migrate
        COPY --from=migrate /app/migrations /app/migrations
        WORKDIR /app
    container_name: efc-init
    networks:
      - nsw-network
    volumes:
      - ./configs:/app/configs:ro
    environment:
      <<: *efc-config-env
      PGHOST: db
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'efc_db'" | grep -q 1 \
          || psql -d postgres -c 'CREATE DATABASE efc_db'
        temporal operator namespace describe --namespace efc --address temporal:7233 >/dev/null 2>&1 \
          || temporal operator namespace create --namespace efc --address temporal:7233
        migrate up
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  efc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efc-api
    networks:
      - nsw-network
    ports:
      # Fixed: the EFC portal's config and TNSW's "efc" service entry both call 8085.
      - "8085:8080"
    volumes:
      - ./configs:/app/configs:ro
      # For artifactLoader.type: local in config.docker.yaml — a one-trade-artifacts
      # clone's efc-v2/ dir.
      - ${EFC_ARTIFACT_LOCAL_ROOT:-../one-trade-artifacts/efc-v2}:/app/artifacts:ro
    environment:
      # Every server setting lives in configs/agency/efc/config.docker.yaml (see
      # x-efc-config-env); what follows is only what the file cannot hold.
