  # -------------------------------------------------------------------
  # 10. NPQS Agency
  # -------------------------------------------------------------------
  # The same backend and trader-app run as NPQS, the National Plant Quarantine Service
  # (mode: agency, see docs/agency.md), next to TNSW, exactly as CDA and EFC do
  # above: shared Postgres, Temporal and IdP, but its own database and Temporal
  # namespace. Config lives in configs/agency/npqs/ (config.docker.yaml for these
  # services). TNSW reaches it at host.docker.internal:8081, as its
  # services.docker.json "npqs" entry already expects.

  # One-shot: creates npqs_db on the shared Postgres and the npqs Temporal
  # namespace if missing, then migrates npqs_db. Same image as cda-init.
  npqs-init:
    build:
      context: .
      additional_contexts:
        migrate: service:migrate
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY --from=temporalio/auto-setup:1.28.3 /usr/local/bin/temporal /usr/local/bin/temporal
        COPY --from=migrate /usr/local/bin/migrate /usr/local/bin/migrate
        COPY --from=migrate /app/migrations /app/migrations
        WORKDIR /app
    container_name: npqs-init
    networks:
      - nsw-network
    volumes:
      - ./configs:/app/configs:ro
    environment:
      <<: *npqs-config-env
      PGHOST: db
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'npqs_db'" | grep -q 1 \
          || psql -d postgres -c 'CREATE DATABASE npqs_db'
        temporal operator namespace describe --namespace npqs --address temporal:7233 >/dev/null 2>&1 \
          || temporal operator namespace create --namespace npqs --address temporal:7233
        migrate up
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

