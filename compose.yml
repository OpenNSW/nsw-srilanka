    build:
      context: .
      dockerfile: Dockerfile
    container_name: npqs-api
    networks:
      - nsw-network
    ports:
      # Fixed: the NPQS portal's config and TNSW's "npqs" service entry both call 8081.
      - "8081:8080"
    volumes:
      - ./configs:/app/configs:ro
      # For artifactLoader.type: local in config.docker.yaml — a one-trade-artifacts
      # clone's npqs-v2/ dir.
      - ${NPQS_ARTIFACT_LOCAL_ROOT:-../one-trade-artifacts/npqs-v2}:/app/artifacts:ro
    environment:
      # Every server setting lives in configs/agency/npqs/config.docker.yaml (see
