networks:
  nsw-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  thunderid-db:
    driver: local
  # Key material is generated per deployment, not shipped in the image. Without these
  # volumes the server regenerates a different AES key and cannot decrypt the client
  # secrets already stored in configdb.db.
  thunderid-certs:
    driver: local
  thunderid-secrets:
    driver: local
  temporal_data:
    driver: local
  bucket_data:
    driver: local

services:
  # -------------------------------------------------------------------
  # 1. Shared Infrastructure Database (PostgreSQL)
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nsw-postgres
    networks:
      - nsw-network
    ports:
      # Expose standard port on localhost for migration tooling scripts to fire against
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-nsw_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nsw_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # 2. Identity Provider Core Services (Thunder Stack)
  # -------------------------------------------------------------------
  # Stage A: Seed static database schemas from container image layer
  thunderid-db-init:
    image: ghcr.io/thunder-id/thunderid:1.0.0-beta2
    container_name: thunderid-db-init
    # Seed only when the volume is empty. An unconditional copy would overwrite
    # configdb.db on every `up`, silently reverting the bootstrap and seed.
    command: sh -c '[ -f /data/configdb.db ] || cp -r /opt/thunderid/database/* /data/'
    volumes:
      - thunderid-db:/data
    restart: "no"

  # Stage B: generate key material, then import the declarative bootstrap resources.
  # Project sample resources are seeded separately by Stage D. See idp/README.md.
  thunderid-setup:
    image: ghcr.io/thunder-id/thunderid:1.0.0-beta2
    container_name: thunderid-setup
    command: ./setup.sh
    networks:
      - nsw-network
    env_file:
      - ./idp/.env
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Generated here, so must outlive this container.
      - thunderid-certs:/opt/thunderid/config/certs
      - thunderid-secrets:/opt/thunderid/config/secrets
      - ./idp/bootstrap/03-nsw-resources.yaml:/opt/thunderid/bootstrap/03-nsw-resources.yaml
    depends_on:
      thunderid-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stage C: Boot active server instances listening for authentication queries
  thunderid:
    image: ghcr.io/thunder-id/thunderid:1.0.0-beta2
    container_name: thunderid
    networks:
      - nsw-network
    ports:
      - "${IDP_PORT:-8090}:${IDP_PORT:-8090}"
    env_file:
      - ./idp/.env
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Read-only: consume the key material Stage B generated, never regenerate it.
      - thunderid-certs:/opt/thunderid/config/certs:ro
      - thunderid-secrets:/opt/thunderid/config/secrets:ro
      - ./idp/deployment.yaml:/opt/thunderid/deployment.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8090/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      thunderid-setup:
        condition: service_completed_successfully

  # Stage D (dev only): once thunderid is healthy, mint an ADMIN_CLI management
  # token and run the data-driven seed (idp/sample-resources.sh). This is NOT a
  # dependency of the thunderid service, so `docker compose up thunderid` skips
  # it, while a full `docker compose up` runs it. The seed is idempotent.
  thunderid-seed:
    image: alpine:3
    container_name: thunderid-seed
    networks:
      - nsw-network
    env_file:
      - ./idp/.env
    volumes:
      - ./idp:/idp:ro
    depends_on:
      thunderid:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache bash curl jq coreutils >/dev/null 2>&1
        echo "Fetching ADMIN_CLI management token..."
        # RFC 8707 resource indicator; required, and this is the System resource server.
        TOKEN=$$(curl -k -s -u "ADMIN_CLI:$${ADMIN_CLI_SECRET:?ADMIN_CLI_SECRET must be set (see idp/.env / idp/.env.example)}" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials" -d "scope=system" \
          -d "resource=$${IDP_SYSTEM_RESOURCE:-https://localhost:8090/mcp}" \
          https://thunderid:8090/oauth2/token | jq -r '.access_token // empty')
        if [ -z "$$TOKEN" ]; then echo "Failed to obtain ADMIN_CLI token"; exit 1; fi
        # Copy the seed tree out of the read-only mount and drop .env so the
        # script does NOT source it: idp/.env "wins" and would reset API_BASE to
        # localhost (wrong inside this container) and use a stale AUTH_TOKEN.
        # Secrets/redirect URIs still come from env_file; API_BASE + the fresh
        # ADMIN_CLI token are passed explicitly below.
        cp -r /idp /seed && rm -f /seed/.env
        API_BASE=https://thunderid:8090 AUTH_TOKEN="$$TOKEN" INSECURE=1 bash /seed/sample-resources.sh
    restart: "no"

  # -------------------------------------------------------------------
  # 3. Temporal Workflow Engine Infrastructure
  # -------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.28.3
    container_name: temporal
    networks:
      - nsw-network
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-changeme}
      - POSTGRES_SEEDS=db
      - DB_NAME=temporal
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.48.0
    container_name: temporal-ui
    networks:
      - nsw-network
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # -------------------------------------------------------------------
  # 4. Database Migrations
  # -------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        # Passed through from the environment, so overriding the migrator version
        # needs no edit here:
        #   MIGRATE_VERSION=<pseudo-version> docker compose build migrate
        # Listed by name with no value on purpose — when the variable is unset,
        # Compose omits the build arg entirely and the Dockerfile's pinned
        # default applies. Repeating the version here instead would give it a
        # second home to drift from.
        - MIGRATE_VERSION
    container_name: tnsw-migrate
    networks:
      - nsw-network
    environment:
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nsw_db}
      - DB_USER=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    # No `command:` — the migrate image's default CMD is ["migrate", "up"].
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # 5. Backend Orchestration API Layer
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tnsw-api
    networks:
      - nsw-network
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Mount configs from the repo (read-only) instead of baking them into
      # the image — a config change needs no rebuild, just a restart.
      - ./configs:/app/configs:ro
      # Mount local test artifacts for development and workflow test harnesses.
      - ./test:/app/test:ro
      # Operator-supplied IPPC Hub mTLS material (git-ignored), referenced by
      # the "ippc-hub" service's tls block in services.docker.json. Create
      # ./certs/ippc/{nppo.crt,nppo.key} from your Hub Admin Console connection.
      - ./certs/ippc:/certs/ippc:ro
      # Host-side artifacts dir for ARTIFACT_LOADER_TYPE=local — the tnsw/ dir of
      # a OpenNSW/one-trade-artifacts clone. Same .env variable a native run uses,
      # so one line covers both; the container reads it at the target path below.
      # Unused by the default GitHub loader (Docker just creates the dir if the
      # clone is absent).
      - ${ARTIFACT_LOCAL_ROOT:-../one-trade-artifacts/tnsw}:/app/artifacts:ro
      # Persist runtime blob storage written by the storage driver.
      - bucket_data:/app/bucket
    environment:
      # Target relational store parameter mapping
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nsw_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      # Engine configuration variables
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      # Context variables translated directly from old start-dev parameters
      - SERVER_PORT=8080
      - SERVER_DEBUG=${SERVER_DEBUG:-true}
      - SERVER_LOG_LEVEL=${SERVER_LOG_LEVEL:-info}
      - SERVICE_URL=${SERVICE_URL:-http://localhost:${BACKEND_PORT:-8080}}
      # Request-body size cap and server timeouts (Slowloris/DoS hardening).
      - SERVER_MAX_REQUEST_BYTES=${SERVER_MAX_REQUEST_BYTES:-33554432}
      - SERVER_READ_HEADER_TIMEOUT=${SERVER_READ_HEADER_TIMEOUT:-5s}
      - SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-15s}
      - SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-30s}
      - SERVER_IDLE_TIMEOUT=${SERVER_IDLE_TIMEOUT:-60s}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179}
      - AUTH_ISSUER=https://localhost:${IDP_PORT:-8090}
      - AUTH_JWKS_URL=https://thunderid:${IDP_PORT:-8090}/oauth2/jwks
      - AUTH_CLIENT_IDS=${AUTH_CLIENT_IDS:-TRADER_PORTAL_APP,FCAU_TO_NSW,NPQS_TO_NSW,CDA_TO_NSW,SLPA_TO_NSW,CUSTOMS_TO_NSW,SLTB_TO_NSW,SLCE_TO_NSW,GOVPAY_TO_NSW}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-https://api.nsw-srilanka.local}
      - AUTH_JWKS_INSECURE_SKIP_VERIFY=${AUTH_JWKS_INSECURE_SKIP_VERIFY:-true}
      # APP_ENV gates the insecure-TLS flags above/in services.json: they are only
      # honored when APP_ENV=development, otherwise the backend refuses to start.
      # Injected as "development" by `make dev`/`make preview` (dev only); left empty
      # for a raw `docker compose up` or any deployment, which then fails closed.
      - APP_ENV=${APP_ENV:-}
      # NSW -> Agency m2m client secrets, referenced as env:... in services.*.json
      - M2M_NSW_TO_NPQS_SECRET=${M2M_NSW_TO_NPQS_SECRET:-1234}
      - M2M_NSW_TO_FCAU_SECRET=${M2M_NSW_TO_FCAU_SECRET:-1234}
      - M2M_NSW_TO_CDA_SECRET=${M2M_NSW_TO_CDA_SECRET:-1234}
      - M2M_NSW_TO_SLPA_SECRET=${M2M_NSW_TO_SLPA_SECRET:-1234}
      - SLPA_CLIENT_SECRET=${SLPA_CLIENT_SECRET:-}
      - SLPA_WEBHOOK_SECRET=${SLPA_WEBHOOK_SECRET:-local-dev-slpa-webhook-secret}
      - M2M_NSW_TO_CUSTOMS_SECRET=${M2M_NSW_TO_CUSTOMS_SECRET:-1234}
      - M2M_NSW_TO_SLTB_SECRET=${M2M_NSW_TO_SLTB_SECRET:-1234}
      - M2M_NSW_TO_ASYCUDA_SECRET=${M2M_NSW_TO_ASYCUDA_SECRET:-1234}
      - SERVICES_CONFIG_PATH=${SERVICES_CONFIG_PATH:-configs/services.docker.json}
      - PAYMENT_METHODS_CONFIG_PATH=${PAYMENT_METHODS_CONFIG_PATH:-configs/payment_methods.json}
      - NOTIFICATIONS_CONFIG_PATH=${NOTIFICATIONS_CONFIG_PATH:-configs/notification.json}
      - CATALOG_CONFIG_PATH=${CATALOG_CONFIG_PATH:-configs/catalog.json}
      # Workflow/form artifacts are no longer baked into the repo/image; they are
      # fetched at startup from the public OpenNSW/one-trade-artifacts repo under
      # the tnsw/ base path. `make dev` works with no local clone. Override any of
      # these in .env (e.g. ARTIFACT_LOADER_TYPE=local with a local clone).
      - ARTIFACT_LOADER_TYPE=${ARTIFACT_LOADER_TYPE:-github}
      - ARTIFACT_GITHUB_OWNER=${ARTIFACT_GITHUB_OWNER:-OpenNSW}
      - ARTIFACT_GITHUB_REPO=${ARTIFACT_GITHUB_REPO:-one-trade-artifacts}
      - ARTIFACT_GITHUB_REF=${ARTIFACT_GITHUB_REF:-main}
      - ARTIFACT_GITHUB_BASE_PATH=${ARTIFACT_GITHUB_BASE_PATH:-tnsw}
      - ARTIFACT_GITHUB_TOKEN=${ARTIFACT_GITHUB_TOKEN:-}
      # Pinned to the bind-mount target above, not interpolated: the host path in
      # .env does not resolve inside the container.
      - ARTIFACT_LOCAL_ROOT=/app/artifacts
      - ENABLE_DEV_FEATURES=${ENABLE_DEV_FEATURES:-true}
      - TEST_MANIFEST_PATHS=${TEST_MANIFEST_PATHS:-}
      - ARGUS_SERVICE_URL=http://argus:3001
      - ARGUS_API_KEY=${ARGUS_API_KEY:-nsw-super-secret-audit-token}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      thunderid:
        condition: service_started
      argus:
        condition: service_started

  # -------------------------------------------------------------------
  # 6. Trader Portal Frontend (React SPA served via Nginx)
  # -------------------------------------------------------------------
  trader-portal:
    build:
      # Build context is the portals workspace root; the Dockerfile copies
      # the root pnpm files and apps/trader-app, then builds with pnpm.
      context: ./portals
      dockerfile: apps/trader-app/Dockerfile
    container_name: tnsw-web
    networks:
      - nsw-network
    ports:
      # Nginx listens on 8080 inside the container; expose on 5173 to match
      # VITE_APP_URL and the backend CORS allow-list.
      - "${TRADER_PORTAL_PORT:-5173}:8080"
    environment:
      # Injected into runtime-env.js at container start. These are read by the
      # browser, so they must target host-exposed ports (localhost), not the
      # internal service hostnames.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_IDP_BASE_URL=${VITE_IDP_BASE_URL:-https://localhost:8090}
      - VITE_IDP_CLIENT_ID=${VITE_IDP_CLIENT_ID:-TRADER_PORTAL_APP}
      # Extra /authorize parameters, query-string encoded. No defaultResourceServer is
      # configured, so omitting `resource` fails the token request with invalid_target.
      - VITE_IDP_EXTRA_QUERY_PARAMS=${VITE_IDP_EXTRA_QUERY_PARAMS:-resource=https://api.nsw-srilanka.local}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:5173}
      - VITE_IDP_SCOPES=${VITE_IDP_SCOPES:-openid,profile,email,group,role,ou,nsw:consignment:read,nsw:consignment:write,nsw:task:read,nsw:task:write,nsw:hscode:read,nsw:company:read,nsw:cha:read,nsw:storage:read,nsw:storage:write,nsw:profile:read}
      - VITE_IDP_TRADER_GROUP_NAME=${VITE_IDP_TRADER_GROUP_NAME:-Traders}
      - VITE_IDP_CHA_GROUP_NAME=${VITE_IDP_CHA_GROUP_NAME:-CHA}
      - VITE_SHOW_AUTOFILL_BUTTON=${VITE_SHOW_AUTOFILL_BUTTON:-true}
      - VITE_ENABLE_TEST_FLOW=${VITE_ENABLE_TEST_FLOW:-true}
    depends_on:
      api:
        condition: service_started
      thunderid:
        condition: service_started

  # -------------------------------------------------------------------
  # 7. Audit Service (Argus)
  # -------------------------------------------------------------------
  argus:
    build:
      context: https://github.com/LSFLK/argus.git#main
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: 858f4ee608e839fac48873bfb4d582e14105a8df
    image: nsw-argus:local
    container_name: nsw-argus
    networks:
      - nsw-network
    ports:
      - "${ARGUS_PORT:-3001}:3001"
    volumes:
      - ./configs/argus/config.yaml:/app/configs/config.yaml:ro
    environment:
      - ENVIRONMENT=development
      - PORT=3001
      - AUDIT_ENUMS_CONFIG=/app/configs/config.yaml
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nsw_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ARGUS_API_KEY=${ARGUS_API_KEY:-nsw-super-secret-audit-token}
    depends_on:
      db:
        condition: service_healthy
