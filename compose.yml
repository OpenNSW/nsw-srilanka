      # Same gate as the api service: insecure TLS is honored only in development.
      APP_ENV: ${APP_ENV:-}
      # NPQS -> NSW m2m client secret, referenced as env:... in services.docker.json.
      M2M_NPQS_TO_NSW_SECRET: ${M2M_NPQS_TO_NSW_SECRET:-1234}
    depends_on:
      npqs-init:
        condition: service_completed_successfully
      thunderid:
        condition: service_started

