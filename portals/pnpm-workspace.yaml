packages:
  - apps/*
  - packages/*

# Force transitive dependencies up to patched versions to clear high-severity
# advisories that upstream packages have not yet picked up themselves.
overrides:
  # lodash <4.17.24 (pulled transitively by @jsonforms/*) — GHSA-r5fr-rjxr-66jc.
  lodash: '>=4.17.24'
  # fast-uri <3.1.8 (pulled transitively by ajv, via @jsonforms/* and ajv-formats) —
  # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-4c8g-83qw-93j6,
  # GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g.
  fast-uri: '^3.1.8'

# Declare dependencies a package uses but leaves out of its package.json, so
# they resolve to the right version rather than whichever one pnpm hoists.
packageExtensions:
  # @jsonforms/react's types import ajv (JsonForms.d.ts) without depending on
  # it. Left to hoisting, the ajv@6 that ESLint pulls in can win, and
  # FormRenderer's additionalErrors then fails to type-check against ajv@6's
  # ErrorObject. Same range as @jsonforms/core.
  '@jsonforms/react':
    dependencies:
      ajv: '^8.18.0'

allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true

# Fail the install when Node.js or pnpm don't satisfy package.json `engines`.
engineStrict: true

minimumReleaseAgeExclude:
  - '@opennsw/jsonforms-renderers@0.18.0'
