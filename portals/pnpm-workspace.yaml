packages:
  - apps/*

# Force transitive dependencies up to patched versions to clear high-severity
# advisories that upstream packages have not yet picked up themselves.
overrides:
  # lodash <4.17.24 (pulled transitively by @jsonforms/*) — GHSA-r5fr-rjxr-66jc.
  lodash: '>=4.17.24'
  # fast-uri <3.1.5 (pulled transitively by ajv, via @jsonforms/* and ajv-formats) —
  # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-4c8g-83qw-93j6.
  fast-uri: '^3.1.6'

allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
