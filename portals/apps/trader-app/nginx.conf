# Master runs as a non-root user, so omit `user` (nginx warns when set as
# non-root) and place the PID and temp buffers under /tmp, which is writable
# for any UID including OpenShift random UIDs and readOnlyRootFilesystem with
# a /tmp emptyDir.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;

    # Health check for the portal itself
    location /health {
      access_log off;
      return 200 'OK';
    }

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # config.js and index.html must never be cached
    location = /config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed static assets — cache aggressively
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
