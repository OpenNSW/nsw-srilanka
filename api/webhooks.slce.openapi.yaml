openapi: 3.0.3
info:
  title: ASYCUDA / SLC Edge Inbound Webhook API
  description: |
    OpenAPI 3.0 specification for National Single Window (NSW) inbound ASYCUDA / SLC Edge webhook endpoints.

    All callback events are delivered through a single central endpoint (`POST /webhooks/slce`) and dynamically routed based on the `eventType` discriminator field.

    The route is mounted in TNSW mode only (`internal/bootstrap/tnsw.go`) and is
    handled by `external-integration/customs/asycuda`. It requires a JWT bearer
    token carrying scope `nsw:slce-webhooks:write` (see
    `securitySchemes.BearerAuth`).

    **Delivery and retries.** §2 has SLC Edge retry a callback up to four times.
    Every event is therefore safe to redeliver: a repeat is acknowledged
    (`200`, or `202` for `CUSDEC_INTEGRATED`) and nothing is re-run. Only `503`
    and `500` ask SLC Edge to try again; every other answer is final.

    **Request handling, common to every event.**
    - The body is read up to 1 MiB (1,048,576 bytes); a longer body is refused
      with `400`, not `413`.
    - `Content-Type` is not checked; the body is always decoded as JSON.
    - Unknown fields are ignored. Field names are matched as Go's
      `encoding/json` matches them (exact name first, then case-insensitively).
    - `eventType` is read from the top level of the body, trimmed and
      upper-cased before it is matched, so `cdn_integrated` routes like
      `CDN_INTEGRATED`.
    - `processedAt` is required and must be an RFC 3339 date-time. The live
      API's `processAt` is accepted in its place.
    - Every error body is `{"error": "<message>", "correlationId": "<trace id>"}`;
      `correlationId` is the request's trace ID, also returned in the
      `X-Trace-ID` response header on every response.
  version: 1.3.0

servers:
  - url: http://localhost:8080
    description: Local Docker Compose (TNSW API)

tags:
  - name: SLC Edge callbacks
    description: |
      Callbacks SLC Edge (Sri Lanka Customs' ASYCUDA World gateway) pushes to TNSW
      as a declaration (CusDec) or cargo dispatch note (CDN) moves through
      customs.

paths:
  /webhooks/slce:
    post:
      tags:
        - SLC Edge callbacks
      summary: Central SLCE Webhook Callback Handler
      description: |
        Receives inbound ASYCUDA World callback events (CusDec integration results, payment notifications, warranting notifications, export release, declaration amendments, CDN integration results, CDN acknowledgments, CDN amendments, and CDN cancellations).

        | `eventType` | Spec | Correlated by | Resumes |
        | --- | --- | --- | --- |
        | `CUSDEC_INTEGRATED` | §6.2 | `payload.edgeId` | the declaration's external review step |
        | `PAYMENT_CONFIRMED` | §6.5.1 | `payload.cusDecRef` | the payment wait |
        | `WARRANTING_COMPLETED` | §6.5.2 | `payload.cusDecRef` | the warranting wait |
        | `EXPORT_RELEASED` | §6.5.3 | `payload.cusDecRef` | the export release wait |
        | `CUSDEC_AMENDED` | §6.5.4 | `payload.cusDecRef` | nothing: opens an amendment flow on the consignment |
        | `CDN_INTEGRATED` | §7.2 | `payload.edgeId` | the dispatch note's integration wait |
        | `CDN_ACKNOWLEDGED` | §7.3 | `payload.cdnRef` | the dispatch note's acknowledgment wait |
        | `CDN_AMENDED` | §7.6 | `payload.cdnRef` | nothing: opens an amendment flow on the consignment |
        | `CDN_CANCELLED` | §7.7 | `payload.cdnRef` | the dispatch note's acknowledgment wait, released as cancelled |

        Any other `eventType`, or none, is refused with `400`.

        Requires scope `nsw:slce-webhooks:write`.
      operationId: processSLCEWebhook
      x-required-scope: nsw:slce-webhooks:write
      x-deployment-modes:
        - tnsw
      x-callers:
        - slc-edge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CusdecIntegrationResultRequest'
                - $ref: '#/components/schemas/CusdecPaymentNotificationRequest'
                - $ref: '#/components/schemas/CusdecWarrantingNotificationRequest'
                - $ref: '#/components/schemas/CusdecExportReleaseRequest'
                - $ref: '#/components/schemas/CDNIntegrationResultRequest'
                - $ref: '#/components/schemas/CDNAcknowledgmentRequest'
                - $ref: '#/components/schemas/CDNAmendedRequest'
                - $ref: '#/components/schemas/CDNCancelledRequest'
              discriminator:
                propertyName: eventType
                mapping:
                  CUSDEC_INTEGRATED: '#/components/schemas/CusdecIntegrationResultRequest'
                  PAYMENT_CONFIRMED: '#/components/schemas/CusdecPaymentNotificationRequest'
                  WARRANTING_COMPLETED: '#/components/schemas/CusdecWarrantingNotificationRequest'
                  EXPORT_RELEASED: '#/components/schemas/CusdecExportReleaseRequest'
                  CDN_INTEGRATED: '#/components/schemas/CDNIntegrationResultRequest'
                  CDN_ACKNOWLEDGED: '#/components/schemas/CDNAcknowledgmentRequest'
                  CDN_AMENDED: '#/components/schemas/CDNAmendedRequest'
                  CDN_CANCELLED: '#/components/schemas/CDNCancelledRequest'
            examples:
              cusdecIntegrated:
                summary: CUSDEC Integration Result — success (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "41d31df5-afab-40e8-bf32-1bec8180c0f6"
                    integrated: true
                    totalAssessedAmount: 1350.0
                    amountPaid: 1350.0
                    amountPayable: 0.0
                    cusdecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 59
                    duties:
                      globalDuties:
                        - typeCode: "EPF"
                          taxBaseAmount: 550
                          taxRateNumeric: 2.0
                          taxAssessedAmount: 1100
                          paymentMethodCode: "1"
                        - typeCode: "COM"
                          taxBaseAmount: 1
                          taxRateNumeric: 250.0
                          taxAssessedAmount: 250
                          paymentMethodCode: "1"
                      itemDutiesList:
                        - itemSequenceNumeric: 1
                          dutyTaxFees:
                            - typeCode: "CED"
                              taxBaseAmount: 125
                              taxRateNumeric: 0.0
                              taxAssessedAmount: 0
                              paymentMethodCode: "1"
                    errors: {}
              cusdecIntegrationFailed:
                summary: CUSDEC Integration Result — failure (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: false
                    duties: {}
                    errors:
                      "0":
                        - code: 300
                          description: "Invalid HS code for the declared item"
              paymentConfirmed:
                summary: CUSDEC Payment Notification (§6.5.1)
                value:
                  eventType: "PAYMENT_CONFIRMED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    amountPaid: 2035.00
                    currency: "LKR"
                    bankReference: "BNK-2026-0098765"
              warrantingCompleted:
                summary: CUSDEC Warranting Notification (§6.5.2)
                value:
                  eventType: "WARRANTING_COMPLETED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    releaseOrderNo: "RO/2026/004567"
                    examinationRequired: false
              exportReleased:
                summary: CUSDEC Export Release (§6.5.3)
                value:
                  eventType: "EXPORT_RELEASED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    vesselName: "EVER GIVEN"
                    voyageNo: "023W 08/01/2025"
                    portOfLoading: "LKCMB"
              cdnIntegrated:
                summary: CDN Integration Result — success (§7.2)
                value:
                  eventType: "CDN_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: true
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 333
                    errors: {}
              cdnIntegrationFailed:
                summary: CDN Integration Result — failure (§7.2)
                value:
                  eventType: "CDN_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: false
                    errors:
                      "0":
                        - code: 210
                          description: "Unknown carrier code"
              cdnAcknowledged:
                summary: CDN Acknowledgment (§7.3)
                value:
                  eventType: "CDN_ACKNOWLEDGED"
                  processedAt: "2026-04-27T14:30:10Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "C"
                      number: 28237
              cdnAmended:
                summary: CDN Amended (§7.6)
                value:
                  eventType: "CDN_AMENDED"
                  processedAt: "2026-04-27T14:30:10Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "C"
                      number: 28237
                    cdn:
                      properties:
                        submitter: ""
                        nswId: ""
                      officeCode: "CBEX1"
                      containerNumber: "MSCU1234567"
                      cusDecRefs:
                        - office: "CBEX1"
                          year: "2026"
                          serial: "E"
                          number: 1047
                    operationTime: "2026-10-14T05:07:38Z"
              cdnCancelled:
                summary: CDN Cancelled (§7.7)
                value:
                  eventType: "CDN_CANCELLED"
                  processedAt: "2026-04-27T14:30:10Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "C"
                      number: 28237
      responses:
        '200':
          description: |
            OK, with an empty body. The callback was validated and applied — or
            it repeats one already applied and is acknowledged as a no-op. Final:
            SLC Edge stops retrying.

            - `CUSDEC_INTEGRATED`: the result was recorded against `edgeId` and
              the review step completed. When no workflow or parked review step
              matches the `edgeId`, the result is still recorded and answered
              `200`; nothing is advanced.
            - `PAYMENT_CONFIRMED`, `WARRANTING_COMPLETED`, `EXPORT_RELEASED`: the
              declaration's status advanced and its wait completed. A
              declaration already at or past the event's status (`PAID`,
              `WARRANTED`, `RELEASED` in that order) is a repeat: `200`, nothing
              changed. When no waiting step is found, the status is still
              advanced and `200` returned.
            - `CDN_INTEGRATED`: the dispatch note was recorded and its
              integration wait released. A redelivery for a note already
              integrated or acknowledged is `200`, and releases the wait if it
              is still parked.
            - `CDN_ACKNOWLEDGED`: the note moved to `ACKNOWLEDGED` and its wait
              was released. A note already acknowledged, or one Customs
              cancelled, is `200` with no action.
            - `CUSDEC_AMENDED`, `CDN_AMENDED`: an amendment flow was opened on
              the consignment, showing the declaration or note as amended. The
              document's own workflow is not touched. A redelivery of the same
              amendment (same reference and `operationTime`) opens nothing
              again.
            - `CDN_CANCELLED`: the note's acknowledgment wait was released as
              cancelled and the note moved to `CANCELLED`. A note already
              cancelled is `200` with no action.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
        '202':
          description: |
            Accepted, with an empty body. `CUSDEC_INTEGRATED` only: an
            integration result for this `edgeId` is already recorded (the
            declaration is `INTEGRATED` or `FAILED`). §2 has SLC Edge retry a
            callback up to four times, so a repeat is expected whenever a prior
            200 was lost in transit — it is acknowledged and nothing is re-run.
            Final: SLC Edge stops retrying.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
        '400':
          description: |
            Bad Request. Final: a redelivery fails the same way. Returned when:

            - the body cannot be read, or exceeds 1 MiB;
            - the body is not JSON, or a field has the wrong JSON type (e.g. a
              string `number`, or a non-RFC 3339 `processedAt`);
            - `eventType` is missing or not one of the six above — `error` is
              `unknown or unsupported event type`;
            - `processedAt` (or `processAt`) is missing;
            - `CUSDEC_INTEGRATED`/`CDN_INTEGRATED`: `payload.edgeId` is missing
              or empty;
            - `CUSDEC_INTEGRATED` with `integrated: true`: the reference is not
              fully populated, or `totalAssessedAmount` or `amountPayable` is
              absent;
            - `CDN_INTEGRATED` with `integrated: true`: `cdnRef` is not fully
              populated;
            - `PAYMENT_CONFIRMED`/`WARRANTING_COMPLETED`/`EXPORT_RELEASED`:
              `cusDecRef` is not fully populated;
            - `CDN_ACKNOWLEDGED`: `cdnRef` is not fully populated;
            - `duties` is a non-empty array, or `itemSequenceNumeric` is not a
              whole number.

            Every case but the unknown event type answers `invalid request payload`.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPayload:
                  value:
                    error: "invalid request payload"
                    correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
                unknownEvent:
                  value:
                    error: "unknown or unsupported event type"
                    correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found. `CDN_INTEGRATED` only: no customs workflow recorded this
            `edgeId` for a dispatch note. The result itself has been recorded
            before this answer, so a redelivery of the same callback is answered
            `200`; there is nothing for SLC Edge to gain by retrying. Also
            `CUSDEC_AMENDED` and `CDN_AMENDED`: the declaration or dispatch note
            has no consignment case recorded to open the amendment flow on.
            Permanent: SLC Edge should not retry.

            The handler also maps a missing workflow on `CUSDEC_INTEGRATED` to
            `404 workflow not found`, but the service records the result first
            and answers `200` when no workflow matches, so that event does not
            return `404` today.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "dispatch note not found"
                correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
        '500':
          description: |
            Internal Server Error. A database or workflow failure while applying
            the event, logged server-side. Also returned for `CDN_ACKNOWLEDGED`
            when the dispatch note is not `INTEGRATED` (e.g. it is still
            `SUBMITTED` or `FAILED`), or when no workflow is found for the note's
            `edgeId`. SLC Edge may retry.

            A retry does not always re-run the work. `CUSDEC_INTEGRATED` records
            the result before it advances the workflow, so a retry after a `500`
            from the workflow step is answered `202` and the review step is not
            completed; the same holds for `CDN_ACKNOWLEDGED`, whose retry is
            answered `200`. Those cases need an operator.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "An error occurred while processing your request"
                correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
        '503':
          description: |
            Service Unavailable. The declaration named by `cusDecRef`
            (PAYMENT_CONFIRMED, WARRANTING_COMPLETED, EXPORT_RELEASED, CUSDEC_AMENDED) or the
            dispatch note named by `cdnRef` (CDN_ACKNOWLEDGED, CDN_AMENDED, CDN_CANCELLED) does not exist yet
            — this event likely raced the CUSDEC_INTEGRATED / CDN_INTEGRATED
            callback for the same document. Or the dispatch note's wait for its
            acknowledgment has not parked yet (CDN_ACKNOWLEDGED, CDN_CANCELLED);
            the note is left as it was, so the retry releases it. Transient:
            SLC Edge should retry.
            No `Retry-After` header is sent.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                declarationNotFound:
                  value:
                    error: "declaration not found, retry later"
                    correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
                dispatchNoteNotFound:
                  value:
                    error: "dispatch note not found, retry later"
                    correlationId: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access token>`: a JWT access token issued by the
        deployment's ThunderID IdP to SLC Edge's M2M client `SLCE_TO_NSW`
        (`idp/bootstrap/10-nsw-platform.yaml`), obtained with the
        `client_credentials` grant (`client_secret_basic`). The token request
        must send `resource=https://api.nsw-srilanka.local`, or the IdP refuses
        it with `invalid_target` (see `idp/README.md`). Tokens are valid for
        3600 s.

        `internal/authn` (core/authn) accepts the token only if:
        - it is signed RS256, RS384 or RS512 by a key in the JWKS at
          `authn.jwksURL`, and its header names that key's `kid`;
        - `iss` equals `authn.issuer` and `aud` contains `authn.audience`
          (`https://api.nsw-srilanka.local` in the examples);
        - `exp` is present and not past (30 s leeway is allowed on time claims);
        - `client_id` is present and `grant_type` is `client_credentials`.

        core/authz then requires `nsw:slce-webhooks:write` among the
        space-delimited `scope` claim. The route checks the scope only: any
        client granted that scope is admitted, not only `SLCE_TO_NSW`.

  headers:
    XTraceID:
      description: |
        The request's trace ID: the caller's `X-Trace-ID`, `X-Correlation-ID`
        or `X-Request-ID` header when it is a valid ID, otherwise one
        generated here. It is the `correlationId` in error bodies.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        Unauthorized, from the authentication middleware (core/authn) before the
        body is read. `message` is `authentication required` when there is no
        `Authorization` header, and `invalid authentication token` when the
        header is not `Bearer <token>` or the token fails any check listed under
        `securitySchemes.BearerAuth`. No `WWW-Authenticate` header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            missingToken:
              value:
                error: "unauthorized"
                message: "authentication required"
            invalidToken:
              value:
                error: "unauthorized"
                message: "invalid authentication token"
    Forbidden:
      description: |
        Forbidden, from core/authz `RequireScope`: the token is valid but its
        `scope` claim does not include `nsw:slce-webhooks:write`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          example:
            error: "forbidden"
            message: "insufficient scope"

  schemas:
    ErrorResponse:
      type: object
      description: The handler's error body (`github.com/OpenNSW/core/httputil`).
      required:
        - error
      properties:
        error:
          type: string
          example: "invalid request payload"
        correlationId:
          type: string
          description: The request's trace ID; also the `X-Trace-ID` response header.
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

    AuthErrorResponse:
      type: object
      description: The authentication and authorization middleware's error body.
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: [unauthorized, forbidden]
        message:
          type: string
          enum:
            - authentication required
            - invalid authentication token
            - insufficient scope

    DocumentReference:
      type: object
      description: |
        A registered ASYCUDA document reference (§4.1). Where a reference is
        required, all four fields must be present and non-empty, and `number`
        greater than 0; otherwise the callback is refused with `400`.
      required:
        - office
        - year
        - serial
        - number
      properties:
        office:
          type: string
          minLength: 1
          example: "CBEX1"
          description: Customs office code
        year:
          type: string
          minLength: 1
          example: "2026"
          description: Registration year
        serial:
          type: string
          minLength: 1
          example: "E"
          description: Registration serial
        number:
          type: integer
          minimum: 1
          example: 1047
          description: Registration number

    SegmentErrors:
      description: |
        Segment-keyed errors (§4.5): `"0"` is the document as a whole, any other
        key an item number, each holding `{code, description}` entries. Stored
        as received and shown to the trader; any JSON value is accepted, and one
        that does not have this shape is shown as raw text. Empty object {} on
        success.
      example:
        "0":
          - code: 300
            description: "Invalid HS code for the declared item"

    DutyTaxFee:
      type: object
      description: One assessed duty or tax line (spec v1.9 §6.2). All amounts in LKR.
      properties:
        typeCode:
          type: string
          description: Duty/tax type code (e.g. EPF, COM, CED).
          example: "EPF"
        taxBaseAmount:
          type: number
          description: Base amount the rate is applied to.
          example: 550
        taxRateNumeric:
          type: number
          description: Rate applied to the base.
          example: 2.0
        taxAssessedAmount:
          type: number
          description: Calculated amount payable.
          example: 1100
        paymentMethodCode:
          type: string
          description: Method of payment code.
          example: "1"

    DutyAssessment:
      type: object
      description: |
        Calculated duties and taxes (spec v1.9 §6.2): charges on the declaration
        as a whole, and charges on each item. Empty when integration failed.
      properties:
        globalDuties:
          type: array
          description: Duties and taxes assessed at declaration level.
          items:
            $ref: '#/components/schemas/DutyTaxFee'
        itemDutiesList:
          type: array
          description: One entry per item carrying duties.
          items:
            type: object
            properties:
              itemSequenceNumeric:
                type: number
                multipleOf: 1
                description: |
                  Item number; matches goodsShipments[].sequenceNumeric. A whole
                  number written as `1.0` is read as 1; a fractional value is
                  refused with `400`.
                example: 1
              dutyTaxFees:
                type: array
                description: Duties and taxes assessed on that item.
                items:
                  $ref: '#/components/schemas/DutyTaxFee'

    CusdecIntegrationResultRequest:
      type: object
      description: |
        §6.2 Declaration Integration Result. Carries the outcome of processing the
        submission identified by `edgeId`. `edgeId`, `integrated` and `errors`
        travel inside `payload`; any copy at the top level is ignored.

        On success: `integrated` = true; `cusdecRef` present; `duties` populated; `errors` = {}.
        On failure: `integrated` = false (an absent `integrated` is read as false);
        `duties` empty; `errors` populated and keyed by segment. On failure the
        reference, amounts and duties are not read.

        All amounts are in LKR. `amountPayable` = `totalAssessedAmount` − `amountPaid`, and it is
        what the trader is asked to pay. A successful result must carry `totalAssessedAmount` and
        `amountPayable`; one without them is refused with 400, since a missing `amountPayable`
        would otherwise read as nothing to pay. A declaration settled from a prepayment account
        (generalSegment.deferredPayment) arrives with `amountPayable` 0, and no Payment
        Notification (§6.5.1) follows for it.

        `cusdecRef` is the canonical field name, as spec v1.9 uses throughout.
        `cusDecRef` (capital `D`), from an earlier draft of this contract, is
        still accepted as an alias; when both are sent, a fully populated
        `cusDecRef` wins.

        Other fields SLC Edge sends (e.g. `nswId`, `status`) are accepted and
        ignored.

        Idempotency: the first result for an `edgeId` is recorded (declaration
        `INTEGRATED` or `FAILED`); every later one for it is answered `202` and
        not applied, whatever it carries.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CUSDEC_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          required:
            - edgeId
          properties:
            edgeId:
              type: string
              minLength: 1
              description: Correlation ID from the 202 acknowledgement of the declaration submission.
              example: "5516e4c8-a93d-429d-8a18-6a484d331176"
            integrated:
              type: boolean
              description: true on success, false on failure. Absent is read as false.
              example: true
            cusdecRef:
              $ref: '#/components/schemas/DocumentReference'
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            totalAssessedAmount:
              type: number
              description: Total duties and taxes assessed on the declaration, in LKR. Required on success.
              example: 1350.0
            amountPaid:
              type: number
              description: Amount already paid against the declaration, in LKR. 0 when no payment has been recorded.
              example: 1350.0
            amountPayable:
              type: number
              description: Amount still due, in LKR (totalAssessedAmount − amountPaid). 0 when fully paid. Required on success.
              example: 0.0
            duties:
              description: |
                The duty breakdown. Populated on success. Empty on failure, where an
                empty object, an empty array and null are all accepted; a
                non-empty array is refused with `400`.
              anyOf:
                - $ref: '#/components/schemas/DutyAssessment'
                - type: array
                  nullable: true
                  maxItems: 0
            errors:
              $ref: '#/components/schemas/SegmentErrors'
          anyOf:
            - title: Integrated
              required:
                - integrated
                - totalAssessedAmount
                - amountPayable
              anyOf:
                - required: [cusDecRef]
                - required: [cusdecRef]
              properties:
                integrated:
                  type: boolean
                  enum: [true]
            - title: Rejected
              properties:
                integrated:
                  type: boolean
                  enum: [false]

    CusdecEventPayload:
      type: object
      description: |
        The §6.5 notification payload: `cusDecRef` names the declaration, which
        must already be recorded by its `CUSDEC_INTEGRATED` result (otherwise
        `503`). `cusdecRef` is accepted as an alias. The event-specific fields
        are optional and are passed to the waiting step as received.

        Idempotency: a declaration already at or past the status this event
        sets is answered `200` and not changed, so an event that arrives after a
        later one cannot move the status backwards.
      required:
        - cusDecRef
      properties:
        cusDecRef:
          $ref: '#/components/schemas/DocumentReference'
        cusdecRef:
          $ref: '#/components/schemas/DocumentReference'

    CusdecPaymentNotificationRequest:
      type: object
      description: §6.5.1 Payment Notification. Moves the declaration to `PAID`.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [PAYMENT_CONFIRMED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-04-26T11:15:22Z"
        payload:
          allOf:
            - $ref: '#/components/schemas/CusdecEventPayload'
            - type: object
              properties:
                amountPaid:
                  type: number
                  description: What Customs took, in `currency`.
                  example: 2035.00
                currency:
                  type: string
                  example: "LKR"
                bankReference:
                  type: string
                  example: "BNK-2026-0098765"

    CusdecWarrantingNotificationRequest:
      type: object
      description: §6.5.2 Warranting Notification. Moves the declaration to `WARRANTED`.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [WARRANTING_COMPLETED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-04-26T11:15:22Z"
        payload:
          allOf:
            - $ref: '#/components/schemas/CusdecEventPayload'
            - type: object
              properties:
                releaseOrderNo:
                  type: string
                  description: Sent by some deployments; shown when present.
                  example: "RO/2026/004567"
                examinationRequired:
                  type: boolean
                  description: Accepted; not acted on.
                  example: false

    CusdecExportReleaseRequest:
      type: object
      description: §6.5.3 Export Release. Moves the declaration to `RELEASED`.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [EXPORT_RELEASED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-04-26T11:15:22Z"
        payload:
          allOf:
            - $ref: '#/components/schemas/CusdecEventPayload'
            - type: object
              properties:
                vesselName:
                  type: string
                  example: "EVER GIVEN"
                voyageNo:
                  type: string
                  example: "023W 08/01/2025"
                portOfLoading:
                  type: string
                  example: "LKCMB"

    CDNIntegrationResultRequest:
      type: object
      description: |
        §7.2 CDN Integration Result. As in §6.2, `edgeId`, `integrated`, `cdnRef`
        and `errors` all travel inside `payload`; the top level carries only the
        event discriminator and its timestamp, and any copy of those fields there
        is ignored.

        Same success/failure conditions as the declaration result (§6.2), with no
        taxes block for CDN: on success `cdnRef` must be fully populated; on
        failure (`integrated` false or absent) `cdnRef` is not read and `errors`
        is stored as the reason.

        Idempotency: a redelivery for a note already `INTEGRATED` or
        `ACKNOWLEDGED` is not recorded again — the reference already stored is
        kept — and is answered `200`, releasing the integration wait if it is
        still parked. A redelivered failure for a `FAILED` note does the same.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          required:
            - edgeId
          properties:
            edgeId:
              type: string
              minLength: 1
              description: Correlation ID from the 202 acknowledgement of the CDN submission.
              example: "5516e4c8-a93d-429d-8a18-6a484d331176"
            integrated:
              type: boolean
              description: true on success, false on failure. Absent is read as false.
              example: true
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'
            errors:
              $ref: '#/components/schemas/SegmentErrors'
          anyOf:
            - title: Integrated
              required:
                - integrated
                - cdnRef
              properties:
                integrated:
                  type: boolean
                  enum: [true]
            - title: Rejected
              properties:
                integrated:
                  type: boolean
                  enum: [false]

    CDNAcknowledgmentRequest:
      type: object
      description: |
        §7.3 CDN Acknowledgment. Correlated by `cdnRef`, which must name a
        dispatch note already recorded as `INTEGRATED` by its `CDN_INTEGRATED`
        result: an unknown `cdnRef` is `503` (retry), a note in any other state
        `500`. A note already `ACKNOWLEDGED` is answered `200`.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_ACKNOWLEDGED]
        processedAt:
          type: string
          format: date-time
          description: Processing time. `processAt` is accepted in its place.
          example: "2026-04-27T14:30:10Z"
        payload:
          type: object
          required:
            - cdnRef
          properties:
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'

    CDNAmendedRequest:
      type: object
      description: |
        §7.6 CDN Amended. Opens a flow on the dispatch note's consignment showing
        the note as amended, for the trader to acknowledge. The note's own
        workflow is not changed.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_AMENDED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-27T14:30:10Z"
        payload:
          type: object
          required:
            - cdnRef
            - cdn
            - operationTime
          properties:
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'
            cdn:
              type: object
              description: |
                The full dispatch note after the amendment, with its linked
                declarations, as Annex B. `properties.submitter` and
                `properties.nswId` are empty strings.
              additionalProperties: true
            operationTime:
              type: string
              description: When the amendment was made in ASYCUDA World.
              example: "2026-10-14T05:07:38Z"

    CDNCancelledRequest:
      type: object
      description: |
        §7.7 CDN Cancelled. Ends the cancelled dispatch note's container branch:
        its wait for the acknowledgment is released as cancelled, and the note
        is left off the boat note. The consignment's other dispatch notes, and
        its declaration, carry on.
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_CANCELLED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-27T14:30:10Z"
        payload:
          type: object
          required:
            - cdnRef
          properties:
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'
