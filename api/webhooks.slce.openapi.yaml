openapi: 3.0.3
info:
  title: ASYCUDA / SLC Edge Inbound Webhook API
  description: |
    OpenAPI 3.0 specification for National Single Window (NSW) inbound ASYCUDA / SLC Edge webhook endpoints.

    All callback events are delivered through a single central endpoint (`POST /webhooks/slce`) and dynamically routed based on the `eventType` discriminator field.
  version: 1.3.0

paths:
  /webhooks/slce:
    post:
      summary: Central SLCE Webhook Callback Handler
      description: |
        Receives inbound ASYCUDA World callback events (CusDec integration results, payment notifications, warranting notifications, export release, CDN integration results, and CDN acknowledgments).
      operationId: processSLCEWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CusdecIntegrationResultRequest'
                - $ref: '#/components/schemas/CusdecPaymentNotificationRequest'
                - $ref: '#/components/schemas/CusdecWarrantingNotificationRequest'
                - $ref: '#/components/schemas/CusdecExportReleaseRequest'
                - $ref: '#/components/schemas/CDNIntegrationResultRequest'
                - $ref: '#/components/schemas/CDNAcknowledgmentRequest'
              discriminator:
                propertyName: eventType
                mapping:
                  CUSDEC_INTEGRATED: '#/components/schemas/CusdecIntegrationResultRequest'
                  PAYMENT_CONFIRMED: '#/components/schemas/CusdecPaymentNotificationRequest'
                  WARRANTING_COMPLETED: '#/components/schemas/CusdecWarrantingNotificationRequest'
                  EXPORT_RELEASED: '#/components/schemas/CusdecExportReleaseRequest'
                  CDN_INTEGRATED: '#/components/schemas/CDNIntegrationResultRequest'
                  CDN_ACKNOWLEDGED: '#/components/schemas/CDNAcknowledgmentRequest'
            examples:
              cusdecIntegrated:
                summary: CUSDEC Integration Result — success (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: true
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    taxes:
                      - code: "tax1"
                        rate: 1
                        amount: 222
                      - code: "tax2"
                        rate: 1
                        amount: 1022
                    errors: {}
              cusdecIntegrationFailed:
                summary: CUSDEC Integration Result — failure (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: false
                    errors:
                      Declaration.HSCode: ["Invalid HS code for the declared item"]
              paymentConfirmed:
                summary: CUSDEC Payment Notification (§6.5.1)
                value:
                  eventType: "PAYMENT_CONFIRMED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    amountPaid: 2035.00
                    currency: "LKR"
                    bankReference: "BNK-2026-0098765"
              warrantingCompleted:
                summary: CUSDEC Warranting Notification (§6.5.2)
                value:
                  eventType: "WARRANTING_COMPLETED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    releaseOrderNo: "RO/2026/004567"
                    examinationRequired: false
              exportReleased:
                summary: CUSDEC Export Release (§6.5.3)
                value:
                  eventType: "EXPORT_RELEASED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    vesselName: "EVER GIVEN"
                    voyageNo: "023W 08/01/2025"
                    portOfLoading: "LKCMB"
              cdnIntegrated:
                summary: CDN Integration Result (§7.2)
                value:
                  eventType: "CDN_INTEGRATED"
                  edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                  integrated: true
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 333
                  errors: {}
              cdnAcknowledged:
                summary: CDN Acknowledgment (§7.3)
                value:
                  eventType: "CDN_ACKNOWLEDGED"
                  processedAt: "2026-04-27T14:30:10Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "C"
                      number: 28237
      responses:
        '200':
          description: |
            OK. Either the callback was validated and processed successfully, or
            (for the (6.5) CusdecEventRequest / CDNAcknowledgmentRequest event
            types only) it repeats an event already applied to the declaration
            or dispatch note — acknowledged as a no-op rather than re-run.
        '202':
          description: |
            Accepted. CUSDEC_INTEGRATED only: this edgeId's integration result was
            already recorded by an earlier delivery. §2 has SLC Edge retry a
            callback up to four times, so a repeat is expected whenever a prior
            200 was lost in transit — it is acknowledged and nothing is re-run.
        '400':
          description: Bad Request. Malformed JSON, missing mandatory fields, validation failure, or an unrecognized `eventType`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "invalid request payload"
                  correlationId:
                    type: string
                    example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
        '401':
          description: Unauthorized. Missing or invalid OAuth 2.0 Bearer token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "unauthorized"
        '404':
          description: |
            Not Found. No task workflow matches the callback's `edgeId`
            (CUSDEC_INTEGRATED, CDN_INTEGRATED), or no dispatch note matches the
            `cdnRef` (CDN_INTEGRATED). Permanent — SLC Edge should not retry.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "workflow not found"
        '503':
          description: |
            Service Unavailable. The declaration named by `cusDecRef`
            (PAYMENT_CONFIRMED, WARRANTING_COMPLETED, EXPORT_RELEASED) or the
            dispatch note named by `cdnRef` (CDN_ACKNOWLEDGED) does not exist yet
            — this event likely raced the CUSDEC_INTEGRATED / CDN_INTEGRATED
            callback for the same document. Transient: SLC Edge should retry.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "declaration not found, retry later"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DocumentReference:
      type: object
      required:
        - office
        - year
        - serial
        - number
      properties:
        office:
          type: string
          example: "CBEX1"
          description: Customs office code
        year:
          type: string
          example: "2026"
          description: Registration year
        serial:
          type: string
          example: "E"
          description: Registration serial
        number:
          type: integer
          example: 1047
          description: Registration number

    TaxEntry:
      type: object
      required:
        - code
        - rate
        - amount
      properties:
        code:
          type: string
          example: "tax1"
        rate:
          type: number
          example: 1.0
        amount:
          type: number
          example: 222.0

    CusdecIntegrationResultRequest:
      type: object
      description: |
        §6.2 Declaration Integration Result. Carries the outcome of processing the
        submission identified by `edgeId`.

        On success: `integrated` = true; `cusDecRef` present; `taxes` populated; `errors` = {}.
        On failure: `integrated` = false; `cusDecRef` absent/null; `taxes` empty; `errors` populated
        and keyed by segment. Success and errors are mutually exclusive.

        `cusDecRef` is the canonical field name; a `cusdecRef` (lowercase `d`)
        alias is also accepted for compatibility with an earlier draft of this
        contract, but `cusDecRef` should be sent going forward.
      required:
        - eventType
        - processedAt
        - payload
      additionalProperties: false
      properties:
        eventType:
          type: string
          enum: [CUSDEC_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          description: Processing time.
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          required:
            - edgeId
            - integrated
            - errors
          additionalProperties: false
          properties:
            edgeId:
              type: string
              format: uuid
              description: Correlation ID from the 202 acknowledgement.
              example: "5516e4c8-a93d-429d-8a18-6a484d331176"
            integrated:
              type: boolean
              description: true on success, false on failure.
              example: true
            cusDecRef:
              description: Registered reference (§4.1). Present on success; absent/null on failure.
            cusdecRef:
              description: |
                Deprecated alias for `cusDecRef` (lowercase `d`), accepted for
                compatibility with an earlier draft of this contract. Present
                on success; absent/null on failure.
            taxes:
              type: array
              maxItems: 100
              description: Assessed taxes (code, rate, amount). Declaration only.
              items:
                $ref: '#/components/schemas/TaxEntry'
            errors:
              type: object
              description: Segment-keyed errors (§4.4). Empty object {} on success.
          oneOf:
            - title: Integrated
              required:
                - taxes
                - errors
              anyOf:
                - required: [cusDecRef]
                - required: [cusdecRef]
              properties:
                integrated:
                  enum: [true]
                cusDecRef:
                  $ref: '#/components/schemas/DocumentReference'
                cusdecRef:
                  $ref: '#/components/schemas/DocumentReference'
                taxes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Assessed taxes (code, rate, amount). Declaration only.
                  items:
                    $ref: '#/components/schemas/TaxEntry'
                errors:
                  type: object
                  maxProperties: 0
            - title: Rejected
              required:
                - errors
              properties:
                integrated:
                  enum: [false]
                cusDecRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Registered reference (§4.1). Present on success; absent/null on failure.
                cusdecRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Deprecated alias for `cusDecRef`. Present on success; absent/null on failure.
                taxes:
                  type: array
                  maxItems: 0
                  description: Empty array on failure.
                errors:
                  type: object
                  minProperties: 1

    CusdecPaymentNotificationRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [PAYMENT_CONFIRMED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            amountPaid:
              type: number
              example: 2035.00
            currency:
              type: string
              example: "LKR"
            bankReference:
              type: string
              example: "BNK-2026-0098765"

    CusdecWarrantingNotificationRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [WARRANTING_COMPLETED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            releaseOrderNo:
              type: string
              example: "RO/2026/004567"
            examinationRequired:
              type: boolean
              example: false

    CusdecExportReleaseRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [EXPORT_RELEASED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            vesselName:
              type: string
              example: "EVER GIVEN"
            voyageNo:
              type: string
              example: "023W 08/01/2025"
            portOfLoading:
              type: string
              example: "LKCMB"

    CDNIntegrationResultRequest:
      type: object
      description: |
        §7.2 CDN Integration Result. Single shape: `edgeId`, `integrated`, and
        `errors` are top-level; `payload` carries only `cdnRef`.

        Same success/failure conditions as the declaration result (§6.2), with no
        taxes block for CDN. Present on success; absent/null on failure.
      required:
        - edgeId
        - integrated
        - eventType
        - processedAt
        - payload
        - errors
      additionalProperties: false
      properties:
        edgeId:
          type: string
          format: uuid
          description: Correlation ID from the 202 acknowledgement.
          example: "5516e4c8-a93d-429d-8a18-6a484d331176"
        integrated:
          type: boolean
          description: true on success, false on failure.
          example: true
        eventType:
          type: string
          enum: [CDN_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          additionalProperties: false
          description: Payload carrying cdnRef on success or absent/null on failure.
          properties:
            cdnRef:
              description: Registered CDN reference. Present on success; absent/null on failure.
        errors:
          type: object
          description: Segment-keyed errors (§4.4). Empty object {} on success.
      oneOf:
        - title: Integrated
          required:
            - errors
          properties:
            integrated:
              enum: [true]
            payload:
              type: object
              required:
                - cdnRef
              additionalProperties: false
              properties:
                cdnRef:
                  $ref: '#/components/schemas/DocumentReference'
            errors:
              type: object
              maxProperties: 0
        - title: Rejected
          required:
            - errors
          properties:
            integrated:
              enum: [false]
            payload:
              type: object
              additionalProperties: false
              properties:
                cdnRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Registered reference. Present on success; absent/null on failure.
            errors:
              type: object
              minProperties: 1

    CDNAcknowledgmentRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_ACKNOWLEDGED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-27T14:30:10Z"
        payload:
          type: object
          required:
            - cdnRef
          properties:
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'
