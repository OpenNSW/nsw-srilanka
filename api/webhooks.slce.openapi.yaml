openapi: 3.0.3
info:
  title: ASYCUDA / SLC Edge Inbound Webhook API
  description: |
    OpenAPI 3.0 specification for National Single Window (NSW) inbound ASYCUDA / SLC Edge webhook endpoints.

    All callback events are delivered through a single central endpoint (`POST /webhooks/slce`) and dynamically routed based on the `eventType` discriminator field.
  version: 1.3.0

paths:
  /webhooks/slce:
    post:
      summary: Central SLCE Webhook Callback Handler
      description: |
        Receives inbound ASYCUDA World callback events (CusDec integration results, payment notifications, warranting notifications, export release, CDN integration results, and CDN acknowledgments).
      operationId: processSLCEWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CusdecIntegrationResultRequest'
                - $ref: '#/components/schemas/CusdecPaymentNotificationRequest'
                - $ref: '#/components/schemas/CusdecWarrantingNotificationRequest'
                - $ref: '#/components/schemas/CusdecExportReleaseRequest'
                - $ref: '#/components/schemas/CDNIntegrationResultRequest'
                - $ref: '#/components/schemas/CDNAcknowledgmentRequest'
              discriminator:
                propertyName: eventType
                mapping:
                  CUSDEC_INTEGRATED: '#/components/schemas/CusdecIntegrationResultRequest'
                  PAYMENT_CONFIRMED: '#/components/schemas/CusdecPaymentNotificationRequest'
                  WARRANTING_COMPLETED: '#/components/schemas/CusdecWarrantingNotificationRequest'
                  EXPORT_RELEASED: '#/components/schemas/CusdecExportReleaseRequest'
                  CDN_INTEGRATED: '#/components/schemas/CDNIntegrationResultRequest'
                  CDN_ACKNOWLEDGED: '#/components/schemas/CDNAcknowledgmentRequest'
            examples:
              cusdecIntegrated:
                summary: CUSDEC Integration Result — success (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "41d31df5-afab-40e8-bf32-1bec8180c0f6"
                    integrated: true
                    nswId: "111222437000"
                    totalAssessedAmount: 1350.0
                    amountPaid: 1350.0
                    amountPayable: 0.0
                    cusdecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 59
                    duties:
                      globalDuties:
                        - typeCode: "EPF"
                          taxBaseAmount: 550
                          taxRateNumeric: 2.0
                          taxAssessedAmount: 1100
                          paymentMethodCode: "1"
                        - typeCode: "COM"
                          taxBaseAmount: 1
                          taxRateNumeric: 250.0
                          taxAssessedAmount: 250
                          paymentMethodCode: "1"
                      itemDutiesList:
                        - itemSequenceNumeric: 1
                          dutyTaxFees:
                            - typeCode: "CED"
                              taxBaseAmount: 125
                              taxRateNumeric: 0.0
                              taxAssessedAmount: 0
                              paymentMethodCode: "1"
                    errors: {}
                    status: "Paid"
              cusdecIntegrationFailed:
                summary: CUSDEC Integration Result — failure (§6.2)
                value:
                  eventType: "CUSDEC_INTEGRATED"
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                    integrated: false
                    errors:
                      Declaration.HSCode: ["Invalid HS code for the declared item"]
              paymentConfirmed:
                summary: CUSDEC Payment Notification (§6.5.1)
                value:
                  eventType: "PAYMENT_CONFIRMED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    amountPaid: 2035.00
                    currency: "LKR"
                    bankReference: "BNK-2026-0098765"
              warrantingCompleted:
                summary: CUSDEC Warranting Notification (§6.5.2)
                value:
                  eventType: "WARRANTING_COMPLETED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    releaseOrderNo: "RO/2026/004567"
                    examinationRequired: false
              exportReleased:
                summary: CUSDEC Export Release (§6.5.3)
                value:
                  eventType: "EXPORT_RELEASED"
                  processedAt: "2026-04-26T11:15:22Z"
                  payload:
                    cusDecRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 1047
                    vesselName: "EVER GIVEN"
                    voyageNo: "023W 08/01/2025"
                    portOfLoading: "LKCMB"
              cdnIntegrated:
                summary: CDN Integration Result (§7.2)
                value:
                  eventType: "CDN_INTEGRATED"
                  edgeId: "5516e4c8-a93d-429d-8a18-6a484d331176"
                  integrated: true
                  processedAt: "2026-06-26T04:04:52Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "E"
                      number: 333
                  errors: {}
              cdnAcknowledged:
                summary: CDN Acknowledgment (§7.3)
                value:
                  eventType: "CDN_ACKNOWLEDGED"
                  processedAt: "2026-04-27T14:30:10Z"
                  payload:
                    cdnRef:
                      office: "CBEX1"
                      year: "2026"
                      serial: "C"
                      number: 28237
      responses:
        '200':
          description: |
            OK. Either the callback was validated and processed successfully, or
            (for the (6.5) CusdecEventRequest / CDNAcknowledgmentRequest event
            types only) it repeats an event already applied to the declaration
            or dispatch note — acknowledged as a no-op rather than re-run.
        '202':
          description: |
            Accepted. CUSDEC_INTEGRATED only: this edgeId's integration result was
            already recorded by an earlier delivery. §2 has SLC Edge retry a
            callback up to four times, so a repeat is expected whenever a prior
            200 was lost in transit — it is acknowledged and nothing is re-run.
        '400':
          description: Bad Request. Malformed JSON, missing mandatory fields, validation failure, or an unrecognized `eventType`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "invalid request payload"
                  correlationId:
                    type: string
                    example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
        '401':
          description: Unauthorized. Missing or invalid OAuth 2.0 Bearer token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "unauthorized"
        '404':
          description: |
            Not Found. No task workflow matches the callback's `edgeId`
            (CUSDEC_INTEGRATED, CDN_INTEGRATED), or no dispatch note matches the
            `cdnRef` (CDN_INTEGRATED). Permanent — SLC Edge should not retry.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "workflow not found"
        '503':
          description: |
            Service Unavailable. The declaration named by `cusDecRef`
            (PAYMENT_CONFIRMED, WARRANTING_COMPLETED, EXPORT_RELEASED) or the
            dispatch note named by `cdnRef` (CDN_ACKNOWLEDGED) does not exist yet
            — this event likely raced the CUSDEC_INTEGRATED / CDN_INTEGRATED
            callback for the same document. Transient: SLC Edge should retry.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "declaration not found, retry later"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DocumentReference:
      type: object
      required:
        - office
        - year
        - serial
        - number
      properties:
        office:
          type: string
          example: "CBEX1"
          description: Customs office code
        year:
          type: string
          example: "2026"
          description: Registration year
        serial:
          type: string
          example: "E"
          description: Registration serial
        number:
          type: integer
          example: 1047
          description: Registration number

    DutyTaxFee:
      type: object
      description: One assessed duty or tax line (spec v1.9 §6.2). All amounts in LKR.
      properties:
        typeCode:
          type: string
          description: Duty/tax type code (e.g. EPF, COM, CED).
          example: "EPF"
        taxBaseAmount:
          type: number
          description: Base amount the rate is applied to.
          example: 550
        taxRateNumeric:
          type: number
          description: Rate applied to the base.
          example: 2.0
        taxAssessedAmount:
          type: number
          description: Calculated amount payable.
          example: 1100
        paymentMethodCode:
          type: string
          description: Method of payment code.
          example: "1"

    DutyAssessment:
      type: object
      description: |
        Calculated duties and taxes (spec v1.9 §6.2): charges on the declaration
        as a whole, and charges on each item. Empty when integration failed.
      properties:
        globalDuties:
          type: array
          description: Duties and taxes assessed at declaration level.
          items:
            $ref: '#/components/schemas/DutyTaxFee'
        itemDutiesList:
          type: array
          description: One entry per item carrying duties.
          items:
            type: object
            properties:
              itemSequenceNumeric:
                type: integer
                description: Item number; matches goodsShipments[].sequenceNumeric.
                example: 1
              dutyTaxFees:
                type: array
                description: Duties and taxes assessed on that item.
                items:
                  $ref: '#/components/schemas/DutyTaxFee'

    CusdecIntegrationResultRequest:
      type: object
      description: |
        §6.2 Declaration Integration Result. Carries the outcome of processing the
        submission identified by `edgeId`.

        On success: `integrated` = true; `cusdecRef` present; `duties` populated; `errors` = {}.
        On failure: `integrated` = false; `cusdecRef` absent/null; `duties` empty; `errors` populated
        and keyed by segment. Success and errors are mutually exclusive.

        All amounts are in LKR. `amountPayable` = `totalAssessedAmount` − `amountPaid`, and it is
        what the trader is asked to pay. A successful result must carry `totalAssessedAmount` and
        `amountPayable`; one without them is refused with 400, since a missing `amountPayable`
        would otherwise read as nothing to pay. A declaration settled from a prepayment account
        (generalSegment.deferredPayment) arrives with `amountPayable` 0, and no Payment
        Notification (§6.5.1) follows for it.

        `cusdecRef` is the canonical field name, as spec v1.9 uses throughout.
        `cusDecRef` (capital `D`), from an earlier draft of this contract, is
        still accepted as an alias.
      required:
        - eventType
        - processedAt
        - payload
      additionalProperties: false
      properties:
        eventType:
          type: string
          enum: [CUSDEC_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          description: Processing time.
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          required:
            - edgeId
            - integrated
            - errors
          additionalProperties: false
          properties:
            edgeId:
              type: string
              format: uuid
              description: Correlation ID from the 202 acknowledgement.
              example: "5516e4c8-a93d-429d-8a18-6a484d331176"
            integrated:
              type: boolean
              description: true on success, false on failure.
              example: true
            cusdecRef:
              description: Registered reference (§4.1). Present on success; absent/null on failure.
            cusDecRef:
              description: |
                Alias for `cusdecRef` (capital `D`), from an earlier draft of
                this contract; still accepted. Present on success; absent/null
                on failure.
            nswId:
              type: string
              description: NSW-assigned submission identifier (§2.2).
              example: "111222437000"
            status:
              type: string
              description: Declaration status in ASYCUDA after integration (e.g. Assessed, Paid).
              example: "Paid"
            totalAssessedAmount:
              type: number
              description: Total duties and taxes assessed on the declaration, in LKR.
              example: 1350.0
            amountPaid:
              type: number
              description: Amount already paid against the declaration, in LKR. 0 when no payment has been recorded.
              example: 1350.0
            amountPayable:
              type: number
              description: Amount still due, in LKR (totalAssessedAmount − amountPaid). 0 when fully paid.
              example: 0.0
            duties:
              $ref: '#/components/schemas/DutyAssessment'
            errors:
              type: object
              description: Segment-keyed errors (§4.4). Empty object {} on success.
          oneOf:
            - title: Integrated
              required:
                - errors
                - totalAssessedAmount
                - amountPayable
              anyOf:
                - required: [cusDecRef]
                - required: [cusdecRef]
              properties:
                integrated:
                  enum: [true]
                cusDecRef:
                  $ref: '#/components/schemas/DocumentReference'
                cusdecRef:
                  $ref: '#/components/schemas/DocumentReference'
                errors:
                  type: object
                  maxProperties: 0
            - title: Rejected
              required:
                - errors
              properties:
                integrated:
                  enum: [false]
                cusdecRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Registered reference (§4.1). Present on success; absent/null on failure.
                cusDecRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Alias for `cusdecRef`, from an earlier draft. Present on success; absent/null on failure.
                duties:
                  type: object
                  description: Empty on failure.
                  properties:
                    globalDuties:
                      type: array
                      maxItems: 0
                    itemDutiesList:
                      type: array
                      maxItems: 0
                errors:
                  type: object
                  minProperties: 1

    CusdecPaymentNotificationRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [PAYMENT_CONFIRMED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            amountPaid:
              type: number
              example: 2035.00
            currency:
              type: string
              example: "LKR"
            bankReference:
              type: string
              example: "BNK-2026-0098765"

    CusdecWarrantingNotificationRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [WARRANTING_COMPLETED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            releaseOrderNo:
              type: string
              example: "RO/2026/004567"
            examinationRequired:
              type: boolean
              example: false

    CusdecExportReleaseRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [EXPORT_RELEASED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-26T11:15:22Z"
        payload:
          type: object
          required:
            - cusDecRef
          properties:
            cusDecRef:
              $ref: '#/components/schemas/DocumentReference'
            vesselName:
              type: string
              example: "EVER GIVEN"
            voyageNo:
              type: string
              example: "023W 08/01/2025"
            portOfLoading:
              type: string
              example: "LKCMB"

    CDNIntegrationResultRequest:
      type: object
      description: |
        §7.2 CDN Integration Result. Single shape: `edgeId`, `integrated`, and
        `errors` are top-level; `payload` carries only `cdnRef`.

        Same success/failure conditions as the declaration result (§6.2), with no
        taxes block for CDN. Present on success; absent/null on failure.
      required:
        - edgeId
        - integrated
        - eventType
        - processedAt
        - payload
        - errors
      additionalProperties: false
      properties:
        edgeId:
          type: string
          format: uuid
          description: Correlation ID from the 202 acknowledgement.
          example: "5516e4c8-a93d-429d-8a18-6a484d331176"
        integrated:
          type: boolean
          description: true on success, false on failure.
          example: true
        eventType:
          type: string
          enum: [CDN_INTEGRATED]
        processedAt:
          type: string
          format: date-time
          example: "2026-06-26T04:04:52Z"
        payload:
          type: object
          additionalProperties: false
          description: Payload carrying cdnRef on success or absent/null on failure.
          properties:
            cdnRef:
              description: Registered CDN reference. Present on success; absent/null on failure.
        errors:
          type: object
          description: Segment-keyed errors (§4.4). Empty object {} on success.
      oneOf:
        - title: Integrated
          required:
            - errors
          properties:
            integrated:
              enum: [true]
            payload:
              type: object
              required:
                - cdnRef
              additionalProperties: false
              properties:
                cdnRef:
                  $ref: '#/components/schemas/DocumentReference'
            errors:
              type: object
              maxProperties: 0
        - title: Rejected
          required:
            - errors
          properties:
            integrated:
              enum: [false]
            payload:
              type: object
              additionalProperties: false
              properties:
                cdnRef:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Registered reference. Present on success; absent/null on failure.
            errors:
              type: object
              minProperties: 1

    CDNAcknowledgmentRequest:
      type: object
      required:
        - eventType
        - processedAt
        - payload
      properties:
        eventType:
          type: string
          enum: [CDN_ACKNOWLEDGED]
        processedAt:
          type: string
          format: date-time
          example: "2026-04-27T14:30:10Z"
        payload:
          type: object
          required:
            - cdnRef
          properties:
            cdnRef:
              $ref: '#/components/schemas/DocumentReference'
