openapi: 3.0.3
info:
  title: NSW Sri Lanka / Tasks API
  description: |
    OpenAPI 3.0 specification for the task-orchestrator HTTP surface: reading
    a single task's rendered "zone view", advancing it by submitting a step,
    and claiming it. A task is one node of a consignment's workflow; access is
    derived from the caller's role-tied ownership of the task's consignment.

    A claim records which user is working a task. Any user who can read a
    task may claim it, where its task template sets `claimable: true`.
    Elsewhere claim and release answer 404.

    All routes require a JWT bearer token (see `securitySchemes.BearerAuth`)
    carrying the scope named on each operation. Every error response uses the
    shared `ErrorResponse` envelope (`{"error": "...", "correlationId": "..."}`).
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /api/v1/tasks/{id}:
    get:
      summary: Get a task's rendered zone view
      description: |
        Returns the ZoneView payload for a single task, scoped to the
        caller: they must own the task's consignment in a role the task's
        render config admits. A task the caller may not read is reported the
        same as one that does not exist (404), so the response cannot be
        used to probe which task IDs exist.

        Each value the task's render config declares under `files` is
        replaced by a **file reference** issued to the caller: an opaque
        string to pass to `GET /api/v1/storage/{key}`, never the stored
        file's key. When the caller may act on the task's active step, it
        can also be sent back in a submission or a draft. A reference
        expires after the deployment's `storage.tokenTTLSeconds`; refetch
        the task for fresh ones.

        Where the task can be claimed, the response says who holds its claim
        (`claim`).

        Requires scope `nsw:task:read`.
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Missing task ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. No usable principal on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `nsw:task:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such task, or the caller may not read it (indistinguishable
            from "not found" by design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal error resolving access, issuing file references (a
            render config whose `files` does not parse, or does not match
            the task's data, included), or assembling the view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/steps/{stepId}:
    post:
      summary: Advance a task by completing a step (portal)
      description: |
        Submits a command (and optional payload) to advance the task's
        underlying workflow. The request body must contain exactly one JSON
        value; trailing data after it is rejected.

        `{stepId}` is the step being completed: the `step_id` the task's zone
        view reported. Only that step is completed; a submission for a step
        the task has since left is rejected with 409 and changes nothing.
        External reviewers call back on `POST /api/v1/callbacks/{token}`
        instead.

        Each `payload` field the task's render config declares under `files`
        must hold a file reference issued to the caller that can be
        submitted, from an upload or the task's zone view; the stored value
        it stands for is what gets stored. A value that is not a reference,
        such as a raw storage key, is refused with 400.

        Requires scope `nsw:task:write`.
      operationId: completeTaskStep
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/StepID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskStepRequest'
      responses:
        '204':
          description: |
            No Content. The workflow accepted the step; the task shows
            ADVANCING (or its next step) from then on, so refetch it rather
            than assume its state.
        '400':
          description: |
            Missing task or step ID, malformed JSON, unexpected trailing data,
            a missing/empty `command`, a `payload` that sets the reserved
            `__command` key, or a declared file field that does not have the
            declared shape (such as a list where one file is declared) or
            holds a value that is not a file reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller may not perform this action on this task, or a
            declared file field holds a file reference issued to someone
            else, or one that can't be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `{stepId}` is not the task's active step: the task has moved on (or
            completed) since the caller read it. Refetch the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            A declared file field holds a file reference from the task's view
            that has expired. Refetch the task and resubmit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal error resolving the submission's file references (a
            render config whose `files` does not parse included) or
            completing the step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/steps/{stepId}/draft:
    put:
      summary: Save a draft of the task's active step
      description: |
        Stores `payload` as a draft of the step, without completing it. The
        draft is stored where a submission would be, so the next read of the
        task shows it, but the step, its `step_id` and the task's `version`
        do not change, and other open views stay current. Drafts may be
        partial. Only a step whose template declares drafts accepts one;
        the server authorizes it as the command the template names for
        drafts, so the body carries no `command`.

        Declared file fields follow the same rule as a submission.

        Requires scope `nsw:task:write`.
      operationId: saveTaskStepDraft
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/StepID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTaskStepDraftRequest'
      responses:
        '204':
          description: No Content. The draft is stored.
        '400':
          description: |
            Missing task or step ID, malformed JSON, unexpected trailing data,
            a `command` in the body, a `payload` that sets the reserved
            `__command` key, a declared file field that does not have the
            declared shape or holds a value that is not a file reference, or
            a step that does not accept drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller may not save a draft of this step, or a declared file
            field holds a file reference issued to someone else, or one that
            can't be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `{stepId}` is not the task's active step, or it has already been
            submitted. Refetch the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            A declared file field holds a file reference from the task's view
            that has expired. Refetch the task and save again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error resolving file references or storing the draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/callbacks/{token}:
    post:
      summary: Complete the step an external reviewer was dispatched for
      description: |
        The route an external reviewer (an OGA portal or agency) calls back
        on. `{token}` is the opaque `callbackToken` from the dispatch envelope
        (the reviewer posts to `{serviceUrl}/{callbackToken}`). It names one
        step of one task, so a callback that arrives after the task has moved
        on is rejected with 409 instead of completing a later step. Treat it
        as an opaque string; it is also the reviewer's idempotency key (the
        same on every retry of one dispatch, different for every step).

        The body is the same envelope as the portal's
        `POST /api/v1/tasks/{id}/steps/{stepId}`, and must contain exactly one
        JSON value. Its declared file fields follow the same rule: each must
        hold a file reference issued to the caller's client that can be
        submitted, such as one an upload returned. A reference the dispatch
        carried can only be opened, so it can't be sent back.

        Requires scope `nsw:task:write`.
      operationId: completeTaskStepByCallbackToken
      parameters:
        - name: token
          in: path
          required: true
          description: The `callbackToken` from the dispatch envelope.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskStepRequest'
      responses:
        '204':
          description: No Content. The workflow accepted the step.
        '400':
          description: |
            A malformed token, malformed JSON, unexpected trailing data, a
            missing/empty `command`, a `payload` that sets the reserved
            `__command` key, or a declared file field that does not have the
            declared shape or holds a value that is not a file reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller may not perform this action on this task, or a
            declared file field holds a file reference issued to someone
            else, or one that can't be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The token's step is no longer the task's active step: this callback
            was already applied, or the task has moved on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            A declared file field holds a file reference from the task's view
            that has expired. Refetch the task and resubmit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal error resolving the submission's file references (a
            render config whose `files` does not parse included) or
            completing the step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/claim:
    post:
      summary: Claim a task
      description: |
        Claims the task for the calling user, so others can see who is working
        on it. A claim is a hint, not a lock: submitting a step never checks
        it. Claiming a task you already hold succeeds and keeps the original
        claim time. If another user holds the claim, the caller takes it over:
        the holder's claim is released and the caller's recorded. Only a user
        who can read the task may claim it; anyone else gets the same 404 as
        for a missing task. The claim lasts until its holder releases it or
        someone takes it over, including after the task completes.

        The task view changes with the claim, so refetch the task afterwards.

        Requires scope `nsw:task:write`.
      operationId: claimTask
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '204':
          description: No Content. The caller holds the claim.
        '400':
          description: Missing task ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The bearer token lacks scope `nsw:task:write`, or the caller is a
            client (only users can claim tasks).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such task, the caller may not read it (indistinguishable from
            "not found" by design), or the task can't be claimed: its task
            template doesn't set `claimable: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The task is completed and can no longer be claimed or taken over,
            or the claim changed while it was being taken over (refetch the
            task and try again).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error claiming the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/release:
    post:
      summary: Release a task
      description: |
        Releases the calling user's claim on the task. Releasing a task nobody
        holds succeeds, so a repeated release is harmless. A completed task's
        claim can still be released. Only a user who can read the task may
        release it. Nobody releases another user's claim: they claim the task
        to take it over.

        Requires scope `nsw:task:write`.
      operationId: releaseTask
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '204':
          description: No Content. Nobody holds the claim.
        '400':
          description: Missing task ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Another user holds the claim, the bearer token lacks scope
            `nsw:task:write`, or the caller is a client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such task, the caller may not read it (indistinguishable from
            "not found" by design), or the task can't be claimed: its task
            template doesn't set `claimable: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error releasing the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
    StepID:
      name: stepId
      in: path
      required: true
      description: The step being completed (the task's `step_id`).
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "task not found"
        correlationId:
          type: string
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

    CompleteTaskStepRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          minLength: 1
          description: The step command to submit, e.g. "submit".
          example: "submit"
        payload:
          type: object
          description: |
            Command-specific data. Genuinely dynamic per task type; must not
            set the reserved `__command` key, which the server adds itself.
          additionalProperties: true
          not:
            required:
              - __command

    SaveTaskStepDraftRequest:
      type: object
      not:
        required:
          - command
      properties:
        payload:
          type: object
          description: |
            The form data so far, as a submission would carry it. Must not set
            the reserved `__command` key.
          additionalProperties: true
          not:
            required:
              - __command

    HandleClaim:
      type: object
      description: One zone's binding of a command to a renderer-defined screen element.
      required:
        - command
        - label
      properties:
        command:
          type: string
        label:
          type: string
        element:
          type: string

    EnrichedComponent:
      type: object
      description: The per-zone wire shape after merging projector output with the zone's legal handles.
      required:
        - id
        - type
        - payload
      properties:
        id:
          type: string
          description: The section key from the task's render config. Unique within a view.
        title:
          type: string
          description: Heading for the section. Omitted when the render config gives none.
        type:
          type: string
        handles:
          type: array
          description: Present (non-empty) iff this zone is interactive in the task's current state.
          items:
            $ref: '#/components/schemas/HandleClaim'
        payload:
          description: Renderer-defined payload for this zone's component type.
          additionalProperties: true

    ZoneView:
      type: object
      description: |
        The wire shape the trader-app's zone renderer consumes. `view` is the
        ordered list of EnrichedComponent to render, in the order the task's
        render config lays them out for the current state; there is no separate
        top-level actions list — actions ship inside their claiming zone's `handles`.
      required:
        - task_id
        - task_type
        - state
        - view
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        task_type:
          type: string
        state:
          type: string
          description: e.g. PENDING_USER, QUEUED_EXTERNALLY, COMPLETED.
        step_id:
          type: string
          description: |
            The step the task is on. A submission is posted to
            `/api/v1/tasks/{id}/steps/{step_id}`. Omitted before the task's
            first step starts.
        version:
          type: integer
          format: int64
          description: Increases every time the task moves on. Read-only.
        view:
          type: array
          description: Sections in render order.
          items:
            $ref: '#/components/schemas/EnrichedComponent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskResponse:
      description: |
        The task's zone view plus its claim, as the caller sees it. `claim` is
        present only where the task can be claimed.
      allOf:
        - $ref: '#/components/schemas/ZoneView'
        - type: object
          properties:
            claim:
              $ref: '#/components/schemas/TaskClaim'

    TaskClaim:
      type: object
      description: |
        Who holds the task's claim, as the caller sees it.
      required:
        - mine
      properties:
        holder:
          $ref: '#/components/schemas/ClaimHolder'
        claimed_at:
          type: string
          format: date-time
          description: When the holder claimed the task; omitted when unclaimed.
        mine:
          type: boolean
          description: |
            Whether the caller holds the claim. Decided by the server from the
            caller's identity; clients should not compare IDs or emails.

    ClaimHolder:
      type: object
      description: The user holding a task's claim. Omitted when the task is unclaimed.
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The name to show for the holder (currently their email). Empty
            when it could not be found.
          example: "officer@cda.gov.lk"
