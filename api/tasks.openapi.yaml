openapi: 3.0.3
info:
  title: NSW Sri Lanka / Tasks API
  description: |
    OpenAPI 3.0 specification for the task-orchestrator HTTP surface: reading
    a single task's rendered "zone view", advancing it by submitting a step or
    saving a draft of one, and the callback route external systems use to
    complete the step they were dispatched for. A task is one node of a case's
    workflow (in TNSW, a consignment; in an agency, an injected workflow).

    These routes run in both deployment modes. In TNSW (`mode: tnsw`) the
    trader portal reads and submits tasks, and agency backends call back on
    `POST /api/v1/callbacks/{token}`. In an agency (`mode: agency`) the
    agency's officer portal (the trader-app in agency mode) reads and submits
    tasks, and TNSW calls back on the agency's callback route.

    Every route requires a JWT bearer token (see `securitySchemes.BearerAuth`)
    carrying the scope named on each operation. The route is wrapped, outermost
    first, in: trace middleware (sets `X-Trace-ID`), the security log, CORS
    (answers an `OPTIONS` preflight itself with 204), authentication, the scope
    check, and the task authz gate (attaches the caller's identity and a lazy
    ownership resolver; it never writes a response itself).

    Errors the handlers write use the `ErrorResponse` envelope
    (`{"error": "...", "correlationId": "..."}`, `correlationId` equal to the
    `X-Trace-ID` response header). The authentication and scope middleware
    write their own `AuthError` body (`{"error": "...", "message": "..."}`)
    with no `correlationId`.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Docker Compose (TNSW API)
  - url: http://localhost:8081
    description: Local Docker Compose (NPQS agency API; CDA 8083, FCAU 8082, EFC 8085, SLTB 8086)

tags:
  - name: Tasks
    description: Read a task's zone view, submit or draft its active step, and complete a dispatched step by callback token.

security:
  - BearerAuth: []

paths:
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/XTraceIDRequest'
      - $ref: '#/components/parameters/XCorrelationIDRequest'
      - $ref: '#/components/parameters/XRequestIDRequest'
    get:
      tags:
        - Tasks
      summary: Get a task's rendered zone view
      description: |
        Returns the ZoneView payload for a single task, scoped to the
        caller: they must own the task's case in a role the task's render
        config admits (in TNSW, the trader or CHA company of its consignment;
        in an agency, an officer role). A task the caller may not read is
        reported the same as one that does not exist (404, same body), so the
        response cannot be used to probe which task IDs exist.

        Each value the task's render config declares under `files` is
        replaced by a **file reference** issued to the caller: an opaque
        string to pass to `GET /api/v1/storage/{key}`, never the stored
        file's key. When the caller may act on the task's active step, it
        can also be sent back in a submission or a draft. A reference
        expires after the deployment's `storage.tokenTTLSeconds`; refetch
        the task for fresh ones.

        Requires scope `nsw:task:read`.
      operationId: getTask
      x-required-scope: nsw:task:read
      x-deployment-modes: [tnsw, agency]
      x-callers: [trader-portal, agency-portal]
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: OK.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such task, or the caller may not read it (indistinguishable
            from "not found" by design). Body `{"error": "task not found"}`.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{id}/steps/{stepId}:
    parameters:
      - $ref: '#/components/parameters/XTraceIDRequest'
      - $ref: '#/components/parameters/XCorrelationIDRequest'
      - $ref: '#/components/parameters/XRequestIDRequest'
    post:
      tags:
        - Tasks
      summary: Advance a task by completing a step (portal)
      description: |
        Submits a command (and optional payload) to advance the task's
        underlying workflow. The body is read up to the deployment's
        `server.maxRequestBytes` (32 MiB in the shipped configs) and must
        contain exactly one JSON value; trailing data after it is rejected.
        Unknown top-level fields are ignored, and the `Content-Type` header
        is not checked.

        `{stepId}` is the step being completed: the `step_id` the task's zone
        view reported. Only that step is completed; a submission for a step
        the task has since left is rejected with 409 and changes nothing.
        External systems call back on `POST /api/v1/callbacks/{token}`
        instead.

        Each `payload` field the task's render config declares under `files`
        must hold a file reference issued to the caller that can be
        submitted, from an upload or the task's zone view; the stored value
        it stands for is what gets stored. A value that is not a reference,
        such as a raw storage key, is refused with 400. When the step's
        template names a form, the payload is then validated against it.

        Requires scope `nsw:task:write`.
      operationId: completeTaskStep
      x-required-scope: nsw:task:write
      x-deployment-modes: [tnsw, agency]
      x-callers: [trader-portal, agency-portal]
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/StepID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskStepRequest'
      responses:
        '204':
          description: |
            No Content. The workflow accepted the step; the task shows
            ADVANCING (or its next step) from then on, so refetch it rather
            than assume its state.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
        '400':
          description: |
            One of:
            - `invalid request body`: an empty body, malformed JSON (a
              `command` that is not a string or a `payload` that is not an
              object included), unexpected trailing data, a missing/empty
              `command`, or a `payload` that sets the reserved `__command` key.
            - `a file in the submission is not a file reference; upload it again`.
            - `a file field in the submission does not have the shape the task declares`
              (such as a list where one file is declared).
            - `submission does not match the form`: the payload fails the
              step's form schema, or changes a value the form marks read-only.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTaskAction'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: |
            `{stepId}` is not the task's active step: the task has moved on (or
            completed) since the caller read it. Body
            `{"error": "this step is no longer active; refetch the task"}`.
            Refetch the task; do not retry the same request.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/FileExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{id}/steps/{stepId}/draft:
    parameters:
      - $ref: '#/components/parameters/XTraceIDRequest'
      - $ref: '#/components/parameters/XCorrelationIDRequest'
      - $ref: '#/components/parameters/XRequestIDRequest'
    put:
      tags:
        - Tasks
      summary: Save a draft of the task's active step
      description: |
        Stores `payload` as a draft of the step, without completing it. The
        draft is stored where a submission would be, so the next read of the
        task shows it, but the step, its `step_id` and the task's `version`
        do not change, and other open views stay current. Drafts may be
        partial: the step's form schema is not applied, but values the form
        marks read-only must not change. Only a step whose template declares
        drafts accepts one; the server authorizes it as the command the
        template names for drafts, so the body carries no `command`.

        The body is read like a submission's (one JSON value within
        `server.maxRequestBytes`, unknown top-level fields ignored), and an
        empty body saves an empty draft. Declared file fields follow the same
        rule as a submission.

        Requires scope `nsw:task:write`.
      operationId: saveTaskStepDraft
      x-required-scope: nsw:task:write
      x-deployment-modes: [tnsw, agency]
      x-callers: [trader-portal, agency-portal]
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/StepID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTaskStepDraftRequest'
      responses:
        '204':
          description: No Content. The draft is stored.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
        '400':
          description: |
            One of:
            - `invalid request body`: malformed JSON, unexpected trailing
              data, a non-empty `command` in the body, or a `payload` that sets
              the reserved `__command` key.
            - `a file in the submission is not a file reference; upload it again`.
            - `a file field in the submission does not have the shape the task declares`.
            - `submission does not match the form`: the draft changes a value
              the form marks read-only.
            - `this step does not accept drafts`.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTaskAction'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: |
            `{stepId}` is not the task's active step, or it has already been
            submitted (including while this draft was being saved). Body
            `{"error": "this step is no longer active; refetch the task"}`.
            Refetch the task.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/FileExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/callbacks/{token}:
    parameters:
      - $ref: '#/components/parameters/XTraceIDRequest'
      - $ref: '#/components/parameters/XCorrelationIDRequest'
      - $ref: '#/components/parameters/XRequestIDRequest'
    post:
      tags:
        - Tasks
      summary: Complete the step an external system was dispatched for
      description: |
        The route a service calls back on to complete a step that was
        parked waiting for it. `{token}` is the opaque `callbackToken` the
        dispatch carried: an agency's API posts its decision to TNSW here
        (the agency's `notify_decision` step, as its `<AGENCY>_TO_NSW`
        client), and TNSW replies on an agency's own parked step here (as its
        `NSW_TO_<AGENCY>` client). The token names one step of one task, so a
        callback that arrives after the task has moved on is rejected with 409
        instead of completing a later step. Treat it as an opaque string; it
        is also the caller's idempotency key (the same on every retry of one
        dispatch, different for every step). The security log replaces it in
        the logged path.

        The body is the same envelope as the portal's
        `POST /api/v1/tasks/{id}/steps/{stepId}`, read the same way (one JSON
        value within `server.maxRequestBytes`, unknown top-level fields
        ignored). Its declared file fields follow the same rule: each must
        hold a file reference issued to the caller's client that can be
        submitted, such as one an upload returned. A reference the dispatch
        carried can only be opened, so it can't be sent back.

        A caller should retry on 5xx and on transport errors, and stop on
        409: the step is no longer waiting, so no retry can succeed. TNSW's
        own replies follow this rule.

        Requires scope `nsw:task:write`.
      operationId: completeTaskStepByCallbackToken
      x-required-scope: nsw:task:write
      x-deployment-modes: [tnsw, agency]
      x-callers: [agency-api, tnsw-api]
      parameters:
        - name: token
          in: path
          required: true
          description: The `callbackToken` from the dispatch envelope.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskStepRequest'
      responses:
        '204':
          description: No Content. The workflow accepted the step.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
        '400':
          description: |
            One of:
            - `invalid callback token`: the token does not decode.
            - `invalid request body`: an empty body, malformed JSON,
              unexpected trailing data, a missing/empty `command`, or a
              `payload` that sets the reserved `__command` key.
            - `a file in the submission is not a file reference; upload it again`.
            - `a file field in the submission does not have the shape the task declares`.
            - `submission does not match the form`.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTaskAction'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: |
            The token's step is no longer the task's active step: this callback
            was already applied, or the task has moved on. Body
            `{"error": "this step is no longer active; refetch the task"}`.
            Do not retry.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/XTraceID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/FileExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token issued by the deployment's ThunderID IdP; validated
        against its JWKS (cached for 5 minutes). The token must be signed with
        RS256, RS384 or RS512 under a `kid` the JWKS holds, carry the
        configured `iss` (`authn.issuer`) and `aud` (`authn.audience`), have
        an `exp` (expiry and not-before are checked with 30 seconds' leeway),
        a `client_id`, and a `grant_type` of `authorization_code` (a user
        token, which must also carry `sub`, `email`, `ouId` and `ouHandle`)
        or `client_credentials` (a client token). Scopes are read from
        `scope` and roles from `roles`. A request without an `Authorization`
        header, or with a token that fails any check, gets 401.

  headers:
    XTraceID:
      description: |
        The request's trace id: the caller's `X-Trace-ID`,
        `X-Correlation-ID` or `X-Request-ID` (first present, if 1-64
        characters of `[A-Za-z0-9-_:./=]`), else a generated 32-hex-character
        id. Equal to `correlationId` in an `ErrorResponse`. Set on every
        response.
      schema:
        type: string
        example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
    StepID:
      name: stepId
      in: path
      required: true
      description: The step being completed (the task's `step_id`).
      schema:
        type: string
    XTraceIDRequest:
      name: X-Trace-ID
      in: header
      required: false
      description: Trace id to reuse for this request (preferred over the two below). An invalid value is replaced by a generated one.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9\-_:./=]+$'
    XCorrelationIDRequest:
      name: X-Correlation-ID
      in: header
      required: false
      description: Used as the trace id when `X-Trace-ID` is absent.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9\-_:./=]+$'
    XRequestIDRequest:
      name: X-Request-ID
      in: header
      required: false
      description: Used as the trace id when `X-Trace-ID` and `X-Correlation-ID` are absent.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9\-_:./=]+$'

  responses:
    Unauthorized:
      description: |
        Unauthorized. Written by one of:
        - the authentication middleware (`AuthError`): `{"error":
          "unauthorized", "message": "authentication required"}` with no
          `Authorization` header, or `"message": "invalid authentication
          token"` for a malformed header or a token that fails validation;
        - the scope middleware (`AuthError`): `{"error": "unauthorized",
          "message": "authentication required"}` when no principal was
          attached;
        - the task handler (`ErrorResponse`): `{"error": "authentication
          required"}` when the task authz gate attached no identity, or the
          authz extension found none.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AuthError'
              - $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        Forbidden. The bearer token lacks the route's scope. Written by the
        scope middleware: `{"error": "forbidden", "message": "insufficient scope"}`.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    ForbiddenTaskAction:
      description: |
        Forbidden. One of:
        - the bearer token lacks scope `nsw:task:write` (scope middleware,
          `AuthError`: `{"error": "forbidden", "message": "insufficient scope"}`);
        - `you may not perform this action on this task` (`ErrorResponse`):
          the step's authz rule does not admit the caller for this command in
          the task's state (no role it allows, no ownership of the task's
          case, a client it does not name), or the step declares no authz
          rule at all;
        - `a file in the submission was issued to someone else` (`ErrorResponse`);
        - `a file in the submission can't be submitted; refetch the task`
          (`ErrorResponse`): a reference that may only be opened.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AuthError'
              - $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: 'No such task. Body `{"error": "task not found"}`.'
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileExpired:
      description: |
        A declared file field holds a file reference from the task's view
        that has expired. Body `{"error": "a file in the submission has
        expired; refetch the task and submit again"}`. Refetch the task and
        send again with fresh references.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: |
        The request body exceeds `server.maxRequestBytes`. Body
        `{"error": "request body too large"}`.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: |
        Internal error: resolving access, issuing or resolving file
        references (a render config whose `files` does not parse, or does not
        match the task's data, included), assembling the view, or completing
        or storing the step. Body `{"error": "An error occurred while
        processing your request"}`; the cause is logged under the
        `correlationId`. Safe to retry.
      headers:
        X-Trace-ID:
          $ref: '#/components/headers/XTraceID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: The error envelope the handlers write.
      required:
        - error
        - correlationId
      properties:
        error:
          type: string
          example: "task not found"
        correlationId:
          type: string
          description: The request's trace id, as in the `X-Trace-ID` response header.
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

    AuthError:
      type: object
      description: The body the authentication and scope middleware write. It carries no `correlationId`.
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - unauthorized
            - forbidden
        message:
          type: string
          enum:
            - authentication required
            - invalid authentication token
            - insufficient scope
      example:
        error: forbidden
        message: insufficient scope

    CompleteTaskStepRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          minLength: 1
          description: The step command to submit, e.g. "submit".
          example: "submit"
        payload:
          type: object
          description: |
            Command-specific data. Genuinely dynamic per task type; must not
            set the reserved `__command` key, which the server adds itself.
            Omitted or `null` is taken as an empty object.
          nullable: true
          additionalProperties: true
          not:
            required:
              - __command
            properties:
              __command: {}

    SaveTaskStepDraftRequest:
      type: object
      description: A `command` that is present but empty is tolerated; a non-empty one is refused.
      properties:
        command:
          type: string
          maxLength: 0
          description: Must be absent or empty.
        payload:
          type: object
          description: |
            The form data so far, as a submission would carry it. Must not set
            the reserved `__command` key. Omitted or `null` saves an empty draft.
          nullable: true
          additionalProperties: true
          not:
            required:
              - __command
            properties:
              __command: {}

    HandleClaim:
      type: object
      description: One zone's binding of a command to a renderer-defined screen element.
      required:
        - command
        - label
      properties:
        command:
          type: string
        label:
          type: string
        element:
          type: string
          description: Omitted when the render config names none.

    EnrichedComponent:
      type: object
      description: The per-zone wire shape after merging projector output with the zone's legal handles.
      required:
        - id
        - type
        - payload
      properties:
        id:
          type: string
          description: The section key from the task's render config. Unique within a view.
        title:
          type: string
          description: Heading for the section. Omitted when the render config gives none.
        type:
          type: string
        handles:
          type: array
          description: Present (non-empty) iff this zone is interactive in the task's current state.
          items:
            $ref: '#/components/schemas/HandleClaim'
        payload:
          description: Renderer-defined payload for this zone's component type; any JSON value.

    ZoneView:
      type: object
      description: |
        The wire shape the trader-app's zone renderer consumes. `view` is the
        ordered list of EnrichedComponent to render, in the order the task's
        render config lays them out for the current state; there is no separate
        top-level actions list — actions ship inside their claiming zone's `handles`.
      required:
        - task_id
        - task_type
        - state
        - version
        - view
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        task_type:
          type: string
        state:
          type: string
          description: e.g. PENDING_USER, QUEUED_EXTERNALLY, COMPLETED.
        step_id:
          type: string
          description: |
            The step the task is on. A submission is posted to
            `/api/v1/tasks/{id}/steps/{step_id}`. Omitted before the task's
            first step starts.
        version:
          type: integer
          format: int64
          description: Increases every time the task moves on. Read-only.
        claimed_by:
          type: string
          description: Who holds the task's claim, as the host recorded it. Omitted when the task is unclaimed.
        claimed_at:
          type: string
          format: date-time
          description: When the claim was taken. Omitted when the task is unclaimed.
        view:
          type: array
          description: Sections in render order.
          items:
            $ref: '#/components/schemas/EnrichedComponent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
