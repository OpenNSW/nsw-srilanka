openapi: 3.0.3
info:
  title: NSW Sri Lanka / Consignment API
  description: |
    OpenAPI 3.0 specification for the consignment domain: creating export
    consignments, and listing and reading a caller's own trader/CHA-owned
    consignments. Ops/admin views of any consignment are in the separate
    Admin API.

    All routes require a JWT bearer token (see `securitySchemes.BearerAuth`)
    carrying the scope named on each operation. Every error response uses the
    shared `ErrorResponse` envelope (`{"error": "...", "correlationId": "..."}`).
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /api/v1/consignments:
    post:
      summary: Create and start an export consignment
      description: |
        Creates an export consignment for the caller's trader company and
        immediately starts its workflow — no CHA company or HS code is
        collected up front; the workflow's own tasks collect those later.

        Requires scope `nsw:consignment:write`.
      operationId: createConsignment
      requestBody:
        required: false
        description: |
          Ignored in production: the workflow template is always
          `trade-export`. Only honored when the deployment runs in dev
          mode, where `template_id` may name a `test-*` template for testing.
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  description: Dev-mode only. Must equal `trade-export` or start with `test-`.
                  example: "test-export-v1"
      responses:
        '201':
          description: Created. The new consignment, with its workflow started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailDTO'
        '400':
          description: Invalid request body (dev mode only — e.g. a disallowed `template_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error creating or starting the consignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List the caller's own consignments
      description: |
        Lists consignments scoped to the caller's company, in the role given
        by `?role=`. The caller must actually hold the JWT role mapped to the
        requested logical role ("trader" or "cha") in the deployment's role
        catalog, or the request is forbidden.

        Requires scope `nsw:consignment:read`.
      operationId: listConsignments
      parameters:
        - name: role
          in: query
          description: Which company-side view to list as. Defaults to `trader`.
          schema:
            type: string
            enum: [trader, cha]
            default: trader
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/State'
        - name: flow
          in: query
          schema:
            $ref: '#/components/schemas/Flow'
        - name: q
          in: query
          description: Free-text search filter.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          description: Invalid `role`, or invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller does not hold the JWT role mapped to the requested
            `?role=`, or has no resolvable company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/consignments/{id}:
    get:
      summary: Get one of the caller's own consignments
      description: |
        Fetches full consignment detail, scoped to the caller's company and
        JWT role. A consignment that exists but is not owned by the caller's
        company/role is reported the same as one that does not exist (404,
        not 403), so the response cannot be used to probe which IDs exist.

        Requires scope `nsw:consignment:read`.
      operationId: getConsignmentByID
      parameters:
        - $ref: '#/components/parameters/ConsignmentID'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailDTO'
        '400':
          description: Missing consignment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller has no resolvable company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such consignment, or the caller's company/role does not own
            it (indistinguishable from "not found" by design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/consignments/{id}/flows:
    post:
      summary: Start a flow on one of the caller's own consignments
      description: |
        Starts one of the consignment's startable flows
        (`DetailDTO.startableFlows`, set by the deployment's
        `consignment.flows`), e.g. a port or agency fee payment, as its own
        workflow on the consignment. Its tasks appear in the consignment's
        `workflowNodes`. A consignment that has `FINISHED` still takes new
        flows; starting one sets it back to `IN_PROGRESS`.

        Access is checked as for `GET /api/v1/consignments/{id}`: a
        consignment the caller's company/role does not own is reported as
        not found.

        Requires scope `nsw:consignment:write`.
      operationId: startConsignmentFlow
      parameters:
        - $ref: '#/components/parameters/ConsignmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFlowRequest'
      responses:
        '201':
          description: The flow started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDTO'
        '400':
          description: >-
            Missing consignment ID; an invalid request body (malformed JSON, any
            field besides `templateId`, or anything after the JSON value); or a `templateId`
            that is not one of the consignment's startable flows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller has no resolvable company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such consignment, or the caller's company/role does not own
            it (indistinguishable from "not found" by design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body is larger than 1 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/consignments/{id}/agency:
    get:
      summary: Get the allowlisted agency-facing summary of a consignment
      description: |
        Returns a small, allowlisted projection of a consignment for
        authenticated M2M (or user) callers. Knowing the unguessable UUID is
        sufficient — there is no trader/CHA company ownership check. Access
        is audit-logged.

        Requires scope `nsw:consignment:read`.
      operationId: getConsignmentAgency
      parameters:
        - $ref: '#/components/parameters/ConsignmentID'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyDTO'
        '400':
          description: Missing consignment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. No usable principal on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such consignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConsignmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - correlationId
      properties:
        error:
          type: string
          example: "consignment not found"
        correlationId:
          type: string
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

    Flow:
      type: string
      enum: [IMPORT, EXPORT]

    State:
      type: string
      enum: [IN_PROGRESS, FINISHED]

    WorkflowNodeState:
      type: string
      enum: [IN_PROGRESS, QUEUED_EXTERNALLY, COMPLETED, FAILED, CANCELLED]
      description: >-
        `CANCELLED` is a task an admin closed by force-parking its node; it
        cannot be submitted.

    SummaryDTO:
      type: object
      description: The consignment shape returned in list responses.
      required:
        - id
        - flow
        - state
        - traderId
        - traderCompanyId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        flow:
          $ref: '#/components/schemas/Flow'
        state:
          $ref: '#/components/schemas/State'
        traderId:
          type: string
          description: Trader user who created the consignment.
        traderCompanyId:
          type: string
          description: Company the trader belongs to.
        chaCompanyId:
          type: string
          description: CHA company selected at Stage 1.
        chaId:
          type: string
          description: CHA assigned at Stage 2 (empty until claimed).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListResult:
      type: object
      description: Pagination envelope returned by the list-consignments endpoint.
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SummaryDTO'
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer

    AgencyDTO:
      type: object
      required:
        - consignmentId
        - traderCompanyName
      properties:
        consignmentId:
          type: string
          format: uuid
        traderCompanyName:
          type: string

    WorkflowNodeTemplateResponseDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string

    WorkflowNodeResponseDTO:
      type: object
      required:
        - id
        - workflowNodeTemplate
        - state
      properties:
        id:
          type: string
          description: |
            The task's ID, for `GET /api/v1/tasks/{id}`. It names one run of a
            TASK node, not the node in the workflow definition: a loop revisit
            of the same node is a new task with a new ID.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        workflowNodeTemplate:
          $ref: '#/components/schemas/WorkflowNodeTemplateResponseDTO'
        state:
          $ref: '#/components/schemas/WorkflowNodeState'

    DetailDTO:
      type: object
      description: The full consignment shape returned by the single-consignment endpoints.
      required:
        - id
        - flow
        - state
        - traderId
        - traderCompanyId
        - workflowNodes
        - startableFlows
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        flow:
          $ref: '#/components/schemas/Flow'
        state:
          $ref: '#/components/schemas/State'
        traderId:
          type: string
        traderCompanyId:
          type: string
        chaCompanyId:
          type: string
        chaId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        workflowNodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeResponseDTO'
        startableFlows:
          type: array
          description: >-
            The flows the caller may start on the consignment with
            `POST /api/v1/consignments/{id}/flows`.
          items:
            $ref: '#/components/schemas/FlowOption'

    FlowOption:
      type: object
      description: A flow that can be started on a consignment.
      required:
        - templateId
        - label
      properties:
        templateId:
          type: string
        label:
          type: string
          description: The text of the flow's button.

    StartFlowRequest:
      type: object
      additionalProperties: false
      required:
        - templateId
      properties:
        templateId:
          type: string
          description: >-
            One of the consignment's `startableFlows`. It is the whole request:
            the server sets the flow's variables (the consignment ID and the
            trader company), and the flow's own tasks collect anything from
            the user.

    FlowDTO:
      type: object
      description: One top-level workflow (flow) of a consignment.
      required:
        - workflowId
        - templateId
        - templateName
        - status
        - createdAt
        - updatedAt
      properties:
        workflowId:
          type: string
        templateId:
          type: string
        templateName:
          type: string
          description: The workflow definition's name, else `templateId`.
        status:
          type: string
          enum: [STARTING, STARTED, COMPLETED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
