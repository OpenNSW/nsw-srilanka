openapi: 3.0.3
info:
  title: NSW Sri Lanka / Static Data API
  description: |
    OpenAPI 3.0 specification for the static reference-data lookup endpoint.
    Serves immutable JSON artifacts (HS code lists, lookup tables, etc.) out
    of the artifact registry, keyed by (id, version).

    Requires a JWT bearer token (see `securitySchemes.BearerAuth`) carrying
    scope `task:read` — reused from the task domain since static data is
    consumed alongside rendered tasks, not a distinct resource of its own.
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /api/v1/static-data/{id}:
    get:
      summary: Get a static reference-data artifact
      description: |
        Without `q`, `offset` or `limit`, returns the raw JSON artifact
        registered under `id` at the given `version`.

        With any of them, searches the artifact's `data` rows instead and
        returns one page of them (`StaticDataSearchPage`): rows are kept when
        `parent` is empty or in their `parents` list, ranked against `q` on the
        `searchKeys` row keys, and returned exactly as the artifact has them.

        Either response is cacheable by the caller's own browser for up to one
        year (see the `Cache-Control` response header) — `(id, version)`
        identifies immutable content — but marked `private` since this
        endpoint is scope-protected.

        Requires scope `task:read`.
      operationId: getStaticData
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "hscode-list"
        - name: version
          in: query
          required: true
          schema:
            type: string
          example: "2026.1"
        - name: q
          in: query
          required: false
          description: |
            Search text, matched case-insensitively on the `searchKeys` values. Rows
            rank by the best match on any key: exact value, then prefix, then a
            later word, then substring. Empty keeps artifact order.
          schema:
            type: string
          example: "colombo"
        - name: searchKeys
          in: query
          required: false
          description: |
            Comma-separated row keys to search, in priority order; ties go to the
            shorter value of the first key, then to the other keys in order. Each key
            uses letters, digits and underscores only. Defaults to `title,const`.
            String, number and boolean values are searched; other values are not.
          schema:
            type: string
          example: "title,const"
        - name: parent
          in: query
          required: false
          description: Keeps only rows whose `parents` list contains this value. Empty keeps every row.
          schema:
            type: string
          example: "Tea"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Page size, capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: |
            OK. Without `q`, `offset` or `limit`: the raw JSON artifact, its shape
            defined by the artifact itself. With any of them: one page of rows.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=31536000, immutable"
          content:
            application/json:
              schema:
                oneOf:
                  - description: The raw artifact. Arbitrary valid JSON; may be an object, array, string, number, boolean, or null.
                  - $ref: '#/components/schemas/StaticDataSearchPage'
        '400':
          description: Missing `version`, invalid `offset` / `limit`, or a `searchKeys` entry that is not letters, digits and underscores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `task:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No artifact registered for this `(id, version)`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error loading the artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StaticDataSearchPage:
      type: object
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          description: The matching rows, each exactly as the artifact has it.
          items:
            type: object
            additionalProperties: true
          example:
            - const: "VCMBC"
              title: "Colombo Cargo Verification"
        total:
          type: integer
          format: int64
          description: Number of rows that match, across all pages.
          example: 1
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 20

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "static data not found"
        correlationId:
          type: string
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"
