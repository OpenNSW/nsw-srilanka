openapi: 3.0.3
info:
  title: NSW Sri Lanka / Admin API
  description: |
    OpenAPI 3.0 specification for the ops/admin views of any consignment —
    full detail and raw workflow-engine state, with no trader/CHA ownership
    check.

    All routes require a JWT bearer token (see `securitySchemes.BearerAuth`)
    carrying the scope named on each operation. Every error response uses the
    shared `ErrorResponse` envelope (`{"error": "...", "correlationId": "..."}`).
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /api/v1/admin/consignments/{id}:
    get:
      summary: "[Admin] Get any consignment's full detail"
      description: |
        Ops/admin view: fetches the full consignment detail for **any**
        consignment, with no trader/CHA ownership check — unlike
        `GET /api/v1/consignments/{id}`, which is scoped to the caller's own
        consignments.

        Requires scope `nsw:consignment:adminread`.
      operationId: adminGetConsignmentByID
      parameters:
        - $ref: '#/components/parameters/ConsignmentID'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailDTO'
        '400':
          description: Missing consignment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `nsw:consignment:adminread`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such consignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/consignments/{id}/engine-status:
    get:
      summary: "[Admin] Get a consignment's raw workflow-engine state"
      description: |
        Returns the root workflow's raw engine state (per-node status
        straight from the workflow manager, e.g. `RUNNING` /
        `COMPLETED` / `AWAITING_ADMIN`) — distinct from the trader-facing
        `GET /api/v1/consignments/{id}`, which reflects task-store/business
        state instead. No per-consignment ownership check: any caller
        holding the admin scope may view any consignment's engine state.

        `global_variables` may hold business/PII data, which is why this is
        gated on the admin scope rather than the trader/CHA read scope.

        Requires scope `nsw:consignment:adminread`.
      operationId: getConsignmentEngineStatus
      parameters:
        - $ref: '#/components/parameters/ConsignmentID'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatusDTO'
        '400':
          description: Missing consignment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. No usable principal on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `nsw:consignment:adminread`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow execution exists for this consignment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/task/{id}/engine-status:
    get:
      summary: "[Admin] Get a task workflow's raw engine state"
      description: |
        Returns the raw engine state of a TASK node's independent per-task
        ("micro") workflow — a separate ID space and workflow manager from
        the consignment/child-workflow IDs used by
        `GET /api/v1/admin/consignments/{id}/engine-status`. The ID is
        obtained from `EngineNodeDTO.task_workflow_id` on the TASK node that
        spawned it.

        Requires scope `nsw:consignment:adminread`.
      operationId: getTaskWorkflowEngineStatus
      parameters:
        - name: id
          in: path
          required: true
          description: A task workflow's own workflow ID (see `EngineNodeDTO.task_workflow_id`).
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatusDTO'
        '400':
          description: Missing task workflow ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. No usable principal on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `nsw:consignment:adminread`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow execution exists for this task workflow ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/consignments/{id}/nodes/{nodeId}/resolve:
    post:
      summary: "[Admin] Resolve a node parked for admin intervention"
      description: |
        Resolves a node that is parked in `AWAITING_ADMIN` (see
        `EngineNodeDTO.park_category` and `last_error` for why it parked):
        retry it, complete it without running it, or abort it. See `action`
        on the request body.

        `{id}` is the ID of the workflow instance that contains the node, not
        a consignment record ID (for a consignment's root workflow the two
        are the same). It is the root workflow, a child-branch workflow
        (`EngineNodeDTO.child_workflow_ids`) or a task workflow
        (`EngineNodeDTO.task_workflow_id`). `{nodeId}` is the node's
        composite ID, `EngineNodeDTO.id`, from that workflow's own
        engine-status response.

        The node is re-checked to be parked before the resolution is sent.
        `204` means the resolution was handed to the workflow, not that it has
        been applied: fetch the engine status again to see the outcome. Two
        admins resolving the same node at the same moment can both receive
        `204` although only the first takes effect; resolution is expected to
        be done by one admin at a time.

        Requires scope `nsw:consignment:adminwrite`.
      operationId: resolveAdminIntervention
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            The ID of the workflow instance containing the node (see above),
            not a consignment record ID.
          schema:
            type: string
        - name: nodeId
          in: path
          required: true
          description: The node's composite ID (`EngineNodeDTO.id`), of the form `<template ID>:<uuid>`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAdminInterventionRequest'
      responses:
        '204':
          description: The resolution was handed to the workflow.
        '400':
          description: >-
            Missing path ID; an invalid request body (malformed JSON, an
            unknown field, or anything after the JSON value); an `action`
            other than `RETRY`, `COMPLETE` or `ABORT`; a missing or blank
            `reason`; or `COMPLETE` on a GATEWAY node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. No usable principal on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. The bearer token lacks scope `nsw:consignment:adminwrite`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow execution exists for `{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The node is not currently awaiting admin intervention: it was
            already resolved, has not parked yet, or `{nodeId}` matches no node
            in this workflow (including an ID from before a retry re-ran the
            node, which gets a new one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConsignmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - correlationId
      properties:
        error:
          type: string
          example: "consignment not found"
        correlationId:
          type: string
          example: "1d67eb9ce46b7b08c6bcf1bdd91de5d5"

    Flow:
      type: string
      enum: [IMPORT, EXPORT]

    State:
      type: string
      enum: [IN_PROGRESS, FINISHED]

    WorkflowNodeState:
      type: string
      enum: [IN_PROGRESS, QUEUED_EXTERNALLY, COMPLETED, FAILED]

    WorkflowNodeTemplateResponseDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string

    WorkflowNodeResponseDTO:
      type: object
      required:
        - id
        - workflowNodeTemplate
        - state
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        workflowNodeTemplate:
          $ref: '#/components/schemas/WorkflowNodeTemplateResponseDTO'
        state:
          $ref: '#/components/schemas/WorkflowNodeState'

    DetailDTO:
      type: object
      description: The full consignment shape returned by the single-consignment endpoints.
      required:
        - id
        - flow
        - state
        - traderId
        - traderCompanyId
        - workflowNodes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        flow:
          $ref: '#/components/schemas/Flow'
        state:
          $ref: '#/components/schemas/State'
        traderId:
          type: string
        traderCompanyId:
          type: string
        chaCompanyId:
          type: string
        chaId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        workflowNodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeResponseDTO'

    EngineNodeDTO:
      type: object
      description: |
        Presentational view of one DAG node's raw engine state — distinct
        from WorkflowNodeResponseDTO, which reflects task-store/business
        semantics instead.
      required:
        - id
        - type
        - status
      properties:
        id:
          type: string
        type:
          type: string
        gateway_type:
          type: string
        task_template_id:
          type: string
        task_workflow_id:
          type: string
          description: |
            Set only for a TASK node whose task has actually started its own
            per-task ("micro") workflow. Pass this as `{id}` to
            `GET /api/v1/admin/task/{id}/engine-status` to view that
            workflow's engine state.
        status:
          type: string
        last_error:
          type: string
        park_category:
          type: string
          enum:
            - INPUT_MAPPING
            - OUTPUT_MAPPING
            - TASK_FAILURE
            - GATEWAY_CONDITION
            - SPLIT_DATA
            - CHILD_FAILURE
            - DEFINITION_ERROR
            - UNKNOWN
          description: |
            Why a node in `AWAITING_ADMIN` parked, set together with
            `last_error`.

            - `INPUT_MAPPING`: a workflow variable the node's input mapping
              requires is not set.
            - `OUTPUT_MAPPING`: the Activity ran, but its result lacks a field
              the output mapping requires.
            - `TASK_FAILURE`: the node's own work (the Activity, a signal send)
              failed.
            - `GATEWAY_CONDITION`: a gateway condition failed to evaluate, or
              no edge matched.
            - `SPLIT_DATA`: the items or branch data a split or join needs is
              missing or malformed.
            - `CHILD_FAILURE`: a spawned child workflow failed.
            - `DEFINITION_ERROR`: the workflow definition itself is invalid, so
              no variable fixes it.
            - `UNKNOWN`: the error was not categorized.
        input_mapping:
          type: object
          additionalProperties:
            type: string
          description: |
            The node's input mapping, present only while it is parked (and left
            on a node an admin aborted). Each key is a workflow variable the
            node reads, dotted-path style, with a trailing `?` if it is
            optional; each value is the task input it fills. A `RETRY` that
            follows an `INPUT_MAPPING` park needs the missing keys set.
        output_mapping:
          type: object
          additionalProperties:
            type: string
          description: |
            The node's output mapping, present only while it is parked (and
            left on a node an admin aborted). Each key is a field of the task
            result, with a trailing `?` if it is optional; each value is the
            workflow variable it writes. A `COMPLETE` stands in for the node's
            output, so its `global_variables_patch` should set these variables.
        cached_task_result:
          type: object
          additionalProperties: true
          description: |
            The raw Activity result of a TASK node whose Activity already ran,
            until the node completes. It shows what came back before choosing
            between `RETRY` (which runs the Activity again) and `COMPLETE`. May
            hold business/PII data.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        child_workflow_ids:
          type: array
          description: |
            Any child workflow executions spawned by this node (e.g. a
            SPLIT_TASK / BATCH_SPLIT gateway).
          items:
            type: string

    EngineStatusDTO:
      type: object
      required:
        - consignment_id
        - status
        - nodes
        - audit_trail
      properties:
        consignment_id:
          type: string
          format: uuid
        status:
          type: string
          description: The root workflow's overall status, e.g. RUNNING, COMPLETED, AWAITING_ADMIN.
        nodes:
          type: array
          description: Only nodes the interpreter has already reached; not-yet-started nodes are omitted.
          items:
            $ref: '#/components/schemas/EngineNodeDTO'
        audit_trail:
          type: array
          items:
            type: string
        global_variables:
          type: object
          description: |
            The workflow instance's shared, dynamic business data —
            workflow-wide, not per node. May contain business/PII data.
          additionalProperties: true
        edges:
          type: array
          description: |
            The workflow's graph connections, so an admin can see what a parked
            GATEWAY's outgoing edges check.
          items:
            $ref: '#/components/schemas/EngineEdgeDTO'

    EngineEdgeDTO:
      type: object
      required:
        - id
        - source_id
        - target_id
      properties:
        id:
          type: string
        source_id:
          type: string
          description: The composite ID of the source node (`EngineNodeDTO.id`).
        target_id:
          type: string
          description: The composite ID of the target node (`EngineNodeDTO.id`).
        condition:
          type: string
          description: >-
            The expression evaluated against `global_variables`, verbatim.
            Absent for an edge with no condition.

    ResolveAdminInterventionRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - reason
      properties:
        action:
          type: string
          enum: [RETRY, COMPLETE, ABORT]
          description: |
            - `RETRY` re-runs the node from scratch, after applying
              `global_variables_patch`: it calls the Activity again for a TASK
              node, or re-evaluates the conditions of a GATEWAY. Making that
              safe is the admin's job; a TASK with a `cached_task_result` has
              already run its Activity.
            - `COMPLETE` applies `global_variables_patch`, then marks the node
              completed without running it and continues down its first
              outgoing edge. The patch stands in for the node's output; an
              empty patch just moves past the node. Not allowed for GATEWAY
              nodes (`400`), since that would skip their routing.
            - `ABORT` fails the node and the workflow with the node's
              original error.
        global_variables_patch:
          type: object
          additionalProperties: true
          description: |
            Only used by `RETRY` and `COMPLETE`. A patch, not the full variable
            set: each key is a dotted path (for example `review.outcome`) and
            each value is written there. A map value is merged into an existing
            map at that path, and any other value replaces it. Variables it
            does not name are untouched. The variables are workflow-wide and
            persist, so they affect every later node too.
        reason:
          type: string
          minLength: 1
          description: Why the admin is doing this. Required, and must not be blank.
