# Example override values for the Trade National Single Window (TNSW) platform
# chart (Backend API + Trader Portal frontend, one release).
#   helm install lk-tnsw ./lk-tnsw -f ./values-example.yaml
#
# This chart deploys the app only. Infra dependencies (Postgres, Temporal,
# Thunder ID, Argus) are separate deployments — backend.config below just
# points at their in-cluster Service names / external URLs.
#
# NON-secret config lives here in plain text: backend.config is the server's
# config.yaml (same schema as configs/config.example.yaml). SECRETS are
# referenced from a Kubernetes Secret and must NEVER be written here:
# backend.env exposes each one as an env var, and backend.config reads it by
# "{{env:NAME}}" placeholder. Create the Secrets out-of-band, e.g.:
#   kubectl create secret generic nsw-secrets \
#     --from-literal=db-password=... \
#     --from-literal=argus-api-key=... \
#     --from-literal=slpa-webhook-secret=... \
#     --from-literal=notification-email-token=... \
#     --from-literal=notification-sms-password=... \
#     --from-literal=m2m-npqs-secret=... \
#     --from-literal=m2m-fcau-secret=... \
#     --from-literal=m2m-cda-secret=... \
#     --from-literal=m2m-slpa-secret=... \
#     --from-literal=m2m-customs-secret=... \
#     --from-literal=m2m-sltb-secret=... \
#     --from-literal=m2m-asycuda-secret=...
#   kubectl create secret generic govpay-go-private-key \
#     --from-file=go_private.pem=...
#
# Adding a secret takes three steps: a key in the Secret, an entry in
# backend.env, and a "{{env:NAME}}" placeholder in backend.config (migration.env
# and migration.config for the migration Job). A placeholder whose env var is
# unset stops the server, or the migration Job, at startup.
#
# The https:// URLs and client IDs below are placeholders — replace them with
# your environment's real IdP, Temporal, and Argus endpoints.

# Drives the backend/frontend resource names via
# lk-tnsw.{backend,frontend}.fullname (templates/_helpers.tpl) — with
# "tnsw" below, resources are named tnsw-api / tnsw-web.
fullnameOverride: "tnsw"

backend:
  # No image tag: the chart deploys the images of its own release (its
  # appVersion). Set backend.image.tag only to run other images.

  # podSecurityContext / securityContext are intentionally left unset here so
  # the cluster decides the UID. The images run correctly under any UID, and on
  # clusters that allocate it themselves an explicit runAsUser is rejected at
  # admission. See values.yaml for the full note.

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80

  # Only what config.yaml cannot hold: APP_ENV, and the secrets it (and
  # services.json) references as {{env:NAME}} / env:NAME — each pulled from a
  # Kubernetes Secret, never inlined.
  env:
    # Gates authn.insecureSkipTLSVerify and services.json's per-service
    # insecure_skip_tls_verify. Leave unset in any real deployment — the
    # backend then fails closed rather than trusting an unverified cert.
    APP_ENV: ""

    DB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nsw-secrets
          key: db-password
    ARGUS_API_KEY:
      valueFrom:
        secretKeyRef:
          name: nsw-secrets
          key: argus-api-key
    # Inbound: SLPA signs each service order webhook with this shared secret and
    # it is the whole of that route's authentication, so the service refuses to
    # start without it. Required on any deployment SLPA calls back.
    SLPA_WEBHOOK_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: slpa-webhook-secret }
    NOTIFICATION_EMAIL_TOKEN:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: notification-email-token }
    NOTIFICATION_SMS_PASSWORD:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: notification-sms-password }

    # --- Outbound M2M (NSW -> Agency): client secrets referenced as
    # env:M2M_NSW_TO_<AGENCY>_SECRET in configs/services*.json. ---
    M2M_NSW_TO_NPQS_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-npqs-secret }
    M2M_NSW_TO_FCAU_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-fcau-secret }
    M2M_NSW_TO_CDA_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-cda-secret }
    # SLPA's is issued by SLPA's own OAuth2 server for the CMS client, not by
    # the IdP; the "slpa" service reads it like any other agency's.
    M2M_NSW_TO_SLPA_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-slpa-secret }
    M2M_NSW_TO_CUSTOMS_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-customs-secret }
    M2M_NSW_TO_SLTB_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-sltb-secret }
    # Outbound (NSW -> Sri Lanka Customs ASYCUDA/CIG declarations API).
    M2M_NSW_TO_ASYCUDA_SECRET:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: m2m-asycuda-secret }

  # GovPay+ encrypts every call to this GO to its RSA public key, so the govpay
  # gateway needs the private key. payment_methods.json points at it with
  # "private_key": "file:/certs/govpay/go_private.pem"; this mounts it there
  # from the govpay-go-private-key Secret (see the top of this file). Without the key the
  # backend starts but answers every GovPay+ call with 500; a key that is set
  # but unreadable stops the backend at startup.
  volumes:
    - name: govpay-go-private-key
      secret:
        secretName: govpay-go-private-key
  volumeMounts:
    - name: govpay-go-private-key
      mountPath: /certs/govpay
      readOnly: true

  # The server's config.yaml, authored here as values; the chart mounts it and
  # sets CONFIG_PATH (see values.yaml). There are no built-in defaults: every
  # setting the server needs is set below, and one left out stops it at
  # startup. Full schema and every option: configs/config.example.yaml.
  config:
    # "tnsw" or "agency" — see docs/agency.md. Required.
    mode: tnsw

    server:
      port: 8080               # keep in step with containerPort above
      logLevel: info
      serviceURL: "https://nsw-api.example.com"
      # Request-body size cap and server timeouts (Slowloris/DoS hardening).
      maxRequestBytes: 33554432   # 32 MiB
      readHeaderTimeout: 5s
      readTimeout: 15s
      writeTimeout: 30s
      idleTimeout: 60s
      # Config file paths, relative to the image's /app working directory.
      # (Only the *.example.json templates ship in the image — see the root
      # Dockerfile. The live files below are gitignored, so supply them via a
      # ConfigMap/volume mounted at /app/configs, or point these at the templates.)
      servicesConfigPath: configs/services.json
      paymentMethodsConfigPath: configs/payment_methods.json
      catalogConfigPath: configs/catalog.json

    # The server's (and the otc CLI's) database connection: core/database's
    # Config (github.com/OpenNSW/core/database). The schema migrator has its own,
    # under migration.config below.
    db:
      # postgres is the only driver supported today.
      driver: postgres
      postgres:
        host: nsw-db             # Postgres Service name in the cluster
        port: 5432
        user: postgres
        password: "{{env:DB_PASSWORD}}"
        name: nsw_db
        # "disable" only for local/dev
        sslMode: require
        pool:
          maxIdleConns: 10
          maxOpenConns: 100
          maxConnLifetimeSeconds: 3600

    # Workflow/form definitions and manifest.json, fetched at startup from
    # OpenNSW/one-trade-artifacts (tnsw/ base path) rather than baked into the
    # image.
    artifactLoader:
      type: github
      github:
        owner: OpenNSW
        repo: one-trade-artifacts
        ref: main              # prefer an immutable tag/SHA in production
        basePath: tnsw
        # Required for a private repo (lifts the rate limit on a public one).
        # Add ARTIFACT_GITHUB_TOKEN to backend.env from a Secret first.
        # token: "{{env:ARTIFACT_GITHUB_TOKEN}}"

    # Trader/agency portals calling this API.
    cors:
      allowedOrigins: ["https://trader.example.com"]
      allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
      allowedHeaders: [Content-Type, Authorization]
      allowCredentials: true
      maxAge: 3600

    # Uploaded document blobs: local | s3 | proxy (see configs/config.example.yaml).
    storage:
      type: s3
      presignTTLSeconds: 900
      # What clients may upload. Not read when type is proxy: the owning service
      # applies its own. MIME types, compared exactly with the upload's.
      allowedUploadTypes:
        - application/pdf
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        # .xlsx only: OOXML workbooks cannot carry VBA macros, unlike legacy .xls,
        # a known malware vector.
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      # Largest upload, in bytes (32 MiB). Not read when type is proxy.
      maxUploadBytes: 33554432
      s3:
        bucket: nsw-uploads
        region: auto
        endpoint: "https://<accountid>.r2.cloudflarestorage.com"
        # Static credentials, set together; leave both out to use the default
        # AWS credential chain (e.g. IRSA). R2 needs them. Add
        # STORAGE_S3_ACCESS_KEY / STORAGE_S3_SECRET_KEY to backend.env from a
        # Secret first.
        # accessKey: "{{env:STORAGE_S3_ACCESS_KEY}}"
        # secretKey: "{{env:STORAGE_S3_SECRET_KEY}}"

    # Inbound auth: tokens this backend accepts.
    authn:
      jwksURL: "https://idp.example.com/oauth2/jwks"
      issuer: "https://idp.example.com"
      audience: "https://api.nsw-srilanka.local"
      clientIDs:
        - TRADER_PORTAL_APP
        - FCAU_TO_NSW
        - NPQS_TO_NSW
        - CDA_TO_NSW
        - SLPA_TO_NSW
        - CUSTOMS_TO_NSW
        - SLTB_TO_NSW
        - SLCE_TO_NSW
        - GOVPAY_TO_NSW
      insecureSkipTLSVerify: false

    temporal:
      host: temporal
      port: 7233
      namespace: default

    # Email/SMS gateways, one settings block per channel.
    notification:
      providers:
        email:
          baseURL: "https://email.example.com"
          token: "{{env:NOTIFICATION_EMAIL_TOKEN}}"
        sms:
          baseURL: "https://sms.example.com"
          userName: "nsw"
          password: "{{env:NOTIFICATION_SMS_PASSWORD}}"
          sidCode: "NSW"

    # Audit service (Argus).
    audit:
      baseURL: "http://argus:3001"
      apiKey: "{{env:ARGUS_API_KEY}}"

    integrations:
      slpaWebhookSecret: "{{env:SLPA_WEBHOOK_SECRET}}"

    # Reference ID formats for the REFID_GENERATOR task plugin. Empty means
    # generation is off, and any task using the plugin fails.
    refid:
      issuers: []
      # issuers:
      #   - issuer: TNSW
      #     formats:
      #       - idType: consignment_ref       # TNSW-CMB-20260930-000042
      #         segments:
      #           - {type: literal, value: "TNSW-"}
      #           - {type: list, list: port, param: portCode}
      #           - {type: literal, value: "-"}
      #           - {type: date, layout: "20060102"}
      #           - {type: literal, value: "-"}
      #           - type: sequence
      #             sequence: {scopeKey: "{issuer}:{idType}:{portCode}:{yyyyMMdd}", padding: 6}
      # lists:
      #   port: [CMB, HBT]

  # Expose the backend API. Enable the one that matches your platform.
  #
  # OpenShift Route (default):
  route:
    enabled: true
    host: "nsw-api.example.com"
    tls:
      enabled: true
      termination: edge

  # Standard Kubernetes Ingress (use instead of route on non-OpenShift clusters):
  ingress:
    enabled: false
    className: "nginx"
    hosts:
      - host: "nsw-api.example.com"
        paths:
          - path: "/"
            pathType: Prefix
    # TLS termination at the ingress. secretName must reference a
    # kubernetes.io/tls Secret you create out-of-band, e.g.:
    #   kubectl create secret tls tnsw-api-tls --cert=tls.crt --key=tls.key
    tls: []
    #  - secretName: tnsw-api-tls
    #    hosts:
    #      - nsw-api.example.com

# Run database migrations as a pre-install/pre-upgrade hook before the server
# rolls out, with the separate tnsw-migrate image (see values.yaml). It shares
# nothing with backend above: its config and env are its own, so it gets only
# the database secret.
migration:
  enabled: true

  # podSecurityContext / securityContext are left unset for the same reason as
  # the backend's above.

  # DATABASE ACCOUNT: this example uses ONE account for the server and the
  # migrator — the same user here as in backend.config.db, and the same
  # db-password Secret key — so it works with no extra database setup. For
  # production, prefer a SEPARATE migrator account that owns the schema, so the
  # server's account can only read and write rows: set its user below, point
  # DB_PASSWORD at its own Secret key, and apply the grants under "Database
  # accounts" in the chart README.
  env:
    DB_PASSWORD:
      valueFrom:
        secretKeyRef: { name: nsw-secrets, key: db-password }

  # The migrator's config.yaml: db only, same schema as backend.config.db.
  config:
    db:
      # Required: the migrator defaults it to sqlite.
      driver: postgres
      postgres:
        host: nsw-db
        port: 5432
        user: postgres
        password: "{{env:DB_PASSWORD}}"
        name: nsw_db
        sslMode: require

frontend:
  # No image tag: the chart deploys the images of its own release (its
  # appVersion). Set frontend.image.tag only to run other images.

  # Left unset for the same reason as the backend above; the image writes only
  # to /tmp and to group-0 writable paths, so any assigned UID works.

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80

  # Same keys as apps/trader-app/public/config.example.js (the local dev
  # equivalent of this config block). Rendered into a ConfigMap and mounted
  # as config.js (see templates/frontend/configmap.yaml) for the browser to
  # read — none of these are secrets, and they must point at the
  # host-exposed URLs the browser will actually use (not in-cluster Service
  # names). No VITE_ prefix: nothing here goes through Vite's build-time
  # import.meta.env, so the prefix would be misleading. DEV_ENABLE_TEST_FLOW
  # is deliberately omitted here — that's a dev-only "🧪 Test Flow" button,
  # not something a real deployment wants.
  config:
    API_BASE_URL: "https://nsw-api.example.com"
    IDP_BASE_URL: "https://idp.example.com"
    IDP_CLIENT_ID: "TRADER_PORTAL_APP"
    # Extra /authorize parameters, query-string encoded (use "&" for more than one).
    # The `resource` value must equal backend.config.authn.audience / the NSW_API resource-server identifier.
    IDP_EXTRA_QUERY_PARAMS: "resource=https://api.nsw-srilanka.local"
    APP_URL: "https://trader.example.com"
    IDP_SCOPES: "openid,profile,email,group,role,ou,nsw:consignment:read,nsw:consignment:write,nsw:task:read,nsw:task:write,nsw:hscode:read,nsw:company:read,nsw:cha:read,nsw:storage:read,nsw:storage:write,nsw:profile:read,nsw:consignment:adminread,nsw:consignment:adminwrite"
    # ID-token claim holding the roles (an array), and the role names in it. For an IdP that
    # models roles as groups, set the claim to "groups" and use the group names.
    IDP_ROLE_CLAIM_NAME: "roles"
    IDP_TRADER_ROLE_NAME: "Trader"
    IDP_CHA_ROLE_NAME: "CHA"
    IDP_NSW_ADMIN_ROLE_NAME: "NSW Admin"
    SHOW_AUTOFILL_BUTTON: "false"
    # "tnsw" (default) lists consignments; "agency" lists an agency's cases instead.
    APP_MODE: "tnsw"

  # Overrides the image's baked-in public/configs/branding.json (see
  # values.yaml and the chart README). Replace these example.com links with
  # your environment's real policy/accessibility/support pages.
  branding:
    systemName: "NSW"
    appName: "Trader Portal"
    portalName: "Trader Portal"
    description: "A unified digital platform enabling seamless and secure trade facilitation services."
    footerLinks:
      - key: policy
        url: "https://gov.example.lk/policy"
      - key: accessibility
        url: "https://gov.example.lk/accessibility"
      - key: support
        url: "https://gov.example.lk/support"
    copyrightNotice: "© 2026 Trader Portal. All rights reserved."

  # Expose the portal. Enable the one that matches your platform.
  #
  # OpenShift Route (default):
  route:
    enabled: true
    host: "trader.example.com"
    tls:
      enabled: true
      termination: edge

  # Standard Kubernetes Ingress (use instead of route on non-OpenShift clusters):
  ingress:
    enabled: false
    className: "nginx"
    hosts:
      - host: "trader.example.com"
        paths:
          - path: "/"
            pathType: Prefix
    # TLS termination at the ingress. secretName must reference a
    # kubernetes.io/tls Secret you create out-of-band, e.g.:
    #   kubectl create secret tls trader-portal-tls --cert=tls.crt --key=tls.key
    tls: []
    #  - secretName: trader-portal-tls
    #    hosts:
    #      - trader.example.com
