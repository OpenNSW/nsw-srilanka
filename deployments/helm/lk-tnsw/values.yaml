# Neutral defaults for the NSW Single Window platform: the Backend API
# (cmd/server) and the Trader Portal frontend (portals/apps/trader-app), as
# two components of one chart/release. Their infra dependencies (Postgres,
# Temporal, Thunder ID, Argus) are separate deployments — component env just
# points at their in-cluster Service names or external URLs.
#
# Everything below is intentionally left as neutral defaults and is filled in
# by an override file, e.g.:
#
#   helm install lk-tnsw ./lk-tnsw -f ../values-example.yaml

nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 1

  image:
    # Published image (see .github/workflows/release.yml).
    repository: ghcr.io/opennsw/tnsw-api
    # Defaults to the chart's appVersion: chart 1.2.3 deploys the 1.2.3 images
    # it was released with. Set it only to run other images, e.g. a dev build
    # (--set backend.image.tag=dev-<run>-<sha>).
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Pod-level security context. Empty by default, which suits both cases
  # below. The images own their files by
  # group 0 and make every writable path group-0 writable, so they run correctly
  # under whatever UID the cluster gives them — no override is required. Where
  # the platform allocates the UID itself, leave this unset: an explicit
  # runAsUser/runAsGroup/fsGroup outside the range it permits is rejected at
  # admission. Where you control the UID, you may set, e.g.
  #   runAsNonRoot: true
  #   runAsUser: 1001   # must match the image's numeric USER
  #   fsGroup: 1001
  podSecurityContext: {}

  # Container-level security context, e.g.
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: true
  #   capabilities:
  #     drop: ["ALL"]
  securityContext: {}

  # Port the server listens on (must match server.port in config below and the
  # Dockerfile's EXPOSE).
  containerPort: 8080

  service:
    type: ClusterIP
    port: 80

  # Server environment variables (key-value map). Supports raw values and
  # valueFrom maps. The server reads only APP_ENV and CONFIG_PATH itself; the
  # rest are the secrets config below (and services.json) reference by name.
  env: {}

  # Load server environment from existing ConfigMaps or Secrets
  envFrom: []

  # The server's config file (config.yaml), authored as values: this section IS
  # config.yaml, with the same schema as configs/config.example.yaml. The chart
  # always renders it into a ConfigMap mounted read-only at
  # configMountPath/config.yaml and points CONFIG_PATH at it, unless env above
  # sets CONFIG_PATH itself. There are no built-in defaults: every setting the
  # server needs must be set here, or it refuses to start — see
  # ../values-example.yaml for a complete one.
  #
  # Non-secret only. A secret goes in as a placeholder the server resolves at
  # startup, e.g. "{{env:SOME_SECRET}}" with SOME_SECRET set via env/valueFrom;
  # Helm passes it through untouched.
  config: {}

  # Directory config.yaml is mounted into. Kept apart from /app/configs so the
  # mount doesn't hide the image's baked templates or any files mounted there.
  configMountPath: /app/config

  # Configuration for OpenShift Routes
  route:
    enabled: false
    host: ""
    tls:
      enabled: true
      termination: edge

  # Configuration for standard Kubernetes Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    # TLS termination at the ingress. Each entry: {secretName, hosts: []}. The
    # secretName must reference a kubernetes.io/tls Secret you create out-of-band.
    tls: []

  resources: {}

  # No default liveness probe: /health returns 503 while the database or authn
  # dependency is unhealthy (internal/bootstrap/app.go), which is a readiness
  # concern, not a liveness one — restarting an otherwise healthy server won't
  # fix an external DB/authn outage. Set one explicitly (e.g. a tcpSocket
  # check on `http`) if you want liveness restarts for hung/deadlocked
  # processes.
  livenessProbe: {}
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  volumes: []
  volumeMounts: []

# Database migration Job, run as a Helm pre-install/pre-upgrade hook so the
# schema is migrated before the new server rolls out. A component of its own:
# it runs a DIFFERENT image from the server (see templates/migration/job.yaml)
# — the external nsw-agency migrate binary, published from this repo's
# Dockerfile `migrate` stage as tnsw-migrate — and shares no configuration with
# the backend, so it can connect as a database account of its own. Off by
# default; enabled via the example override file.
migration:
  enabled: false

  image:
    repository: ghcr.io/opennsw/tnsw-migrate
    # Defaults to backend.image.tag, then the chart's appVersion: release.yml
    # publishes both images from the same git tag.
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Same reasoning as backend.podSecurityContext / securityContext: the image
  # runs under any cluster-assigned UID, so leave these unset unless you
  # control the UID yourself.
  podSecurityContext: {}
  securityContext: {}

  # Overrides the image's default CMD (["migrate", "up"]), e.g. ["migrate", "status"].
  command: []
  backoffLimit: 1

  # Migrator environment variables (key-value map), raw values or valueFrom
  # maps: the secrets config below references by name, and nothing else.
  env: {}
  envFrom: []

  # The migrator's config file (config.yaml), authored as values. It reads only
  # db (core/database's Config, the same schema as backend.config.db) and,
  # optionally, migrationDir (defaulting to the image's ./migrations). Rendered
  # into a ConfigMap mounted at configMountPath/config.yaml, with CONFIG_PATH
  # pointed at it unless env sets CONFIG_PATH itself. db.driver must be
  # postgres — the migrator defaults it to sqlite, so the chart refuses to
  # render without it. Secrets go in as "{{env:NAME}}" placeholders, as for
  # backend.config.
  #
  # Database account: the migrator may connect as the same account as the
  # server (same user as backend.config.db, env pointing at the same Secret
  # key), or — recommended for production — as a separate account that owns
  # the schema, leaving the server's account to read and write rows. See
  # "Database accounts" in the chart README for the grants that needs.
  config: {}

  configMountPath: /app/config

  resources: {}

frontend:
  replicaCount: 1

  image:
    # Published image (see .github/workflows/release.yml).
    repository: ghcr.io/opennsw/tnsw-web
    # Defaults to the chart's appVersion, like backend.image.tag.
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Pod-level security context. Same reasoning as the backend above: the image
  # runs under any cluster-assigned UID, so leave this unset unless you control
  # the UID yourself, in which case you may set, e.g.
  #   runAsNonRoot: true
  #   runAsUser: 101   # the image's nginx-unprivileged user
  #   fsGroup: 101
  podSecurityContext: {}

  # Container-level security context, e.g.
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: true
  #   capabilities:
  #     drop: ["ALL"]
  securityContext: {}

  # Port nginx listens on inside the image (nginx-unprivileged, not 80).
  containerPort: 8080

  service:
    type: ClusterIP
    port: 80

  # Runtime config values, rendered into a ConfigMap and mounted as
  # /usr/share/nginx/html/config.js for the browser to read (see
  # templates/frontend/configmap.yaml). Not container env vars — unlike
  # backend.env above, nothing here reaches the container's process
  # environment, so it's named `config`, not `env`. See ../values-example.yaml
  # for the full set. No secrets here — see the chart README.
  config: {}

  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # Branding/footer content for the portal — systemName, appName, logoUrl,
  # footerLinks, copyrightNotice, etc. (see
  # portals/apps/trader-app/src/configs/types.ts for the full schema). Empty
  # by default: the image ships public/configs/branding.json baked in at
  # build time with neutral placeholder content, which is fine to run with
  # but not meant to reach real users. Set this per deployment to override
  # that file — when non-empty, it's rendered into a ConfigMap and mounted
  # over /usr/share/nginx/html/configs/branding.json, which initAppConfig()
  # (src/config.ts) fetches at app start. See ../values-example.yaml.
  branding: {}

  # Configuration for OpenShift Routes
  route:
    enabled: false
    host: ""
    tls:
      enabled: true
      termination: edge

  # Configuration for standard Kubernetes Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  resources: {}

  # Defaults match nginx.conf's /health location (returns 200 'OK').
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  volumes: []
  volumeMounts: []
