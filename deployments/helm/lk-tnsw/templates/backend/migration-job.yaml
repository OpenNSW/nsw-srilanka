{{- if .Values.backend.migration.enabled }}
{{- /* The migrator defaults db.driver to sqlite, where the server defaults it to
postgres: left unset, the Job would migrate a throwaway sqlite file and report
success against a database the server never uses. */}}
{{- $driver := dig "db" "driver" "" (.Values.backend.config | default dict) }}
{{- if ne $driver "postgres" }}
{{- fail (printf "backend.config.db.driver must be set to \"postgres\" when backend.migration.enabled (got %q): the migrator defaults it to sqlite" $driver) }}
{{- end }}
{{- /* backend.env carries the secrets config.yaml references, and the migrator
resolves every placeholder in the file; migration.env adds to or overrides it. */}}
{{- $env := merge (deepCopy (.Values.backend.migration.env | default dict)) (deepCopy (.Values.backend.env | default dict)) }}
{{- $envFrom := concat (.Values.backend.envFrom | default list) (.Values.backend.migration.envFrom | default list) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" (include "lk-tnsw.backend.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "lk-tnsw.backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run as a Helm hook BEFORE the Deployment rolls out, on every install and
    # upgrade. The release only proceeds if this Job succeeds; a failed
    # migration aborts the upgrade and leaves the running server untouched.
    "helm.sh/hook": pre-install,pre-upgrade
    # Negative weight => runs earlier than other hooks.
    "helm.sh/hook-weight": "-5"
    # Delete the previous migration Job just before creating a new one, so the
    # last attempt's logs stick around for debugging.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Number of retries before the Job is marked failed (and the upgrade aborts).
  backoffLimit: {{ .Values.backend.migration.backoffLimit | default 1 }}
  template:
    metadata:
      labels:
        {{- include "lk-tnsw.backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      # A Job pod must not be restarted forever; run once and stop.
      restartPolicy: Never
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # A separate image from the server (see the Dockerfile's `migrate`
          # stage, published as tnsw-migrate) — it runs the standalone
          # nsw-agency migrate binary, not this backend's code. Defaults its
          # tag to the server's image.tag when unset, since release.yml
          # publishes both images from the same git tag.
          image: "{{ .Values.backend.migration.image.repository }}:{{ include "lk-tnsw.imageTag" (dict "tag" (.Values.backend.migration.image.tag | default .Values.backend.image.tag) "root" .) }}"
          imagePullPolicy: {{ .Values.backend.migration.image.pullPolicy | default .Values.backend.image.pullPolicy }}
          {{- if .Values.backend.migration.command }}
          command: {{ .Values.backend.migration.command | toJson }}
          {{- end }}
          env:
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              {{- if kindIs "map" $value }}
              {{- toYaml $value | nindent 14 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
            {{- /* The hook copy of config.yaml, unless env names another. */}}
            {{- if not (hasKey $env "CONFIG_PATH") }}
            - name: CONFIG_PATH
              value: {{ printf "%s/config.yaml" .Values.backend.configMountPath | quote }}
            {{- end }}
          {{- with $envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Beside the image's baked /app/migrations, not over it.
            - name: config
              mountPath: {{ .Values.backend.configMountPath }}
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-migrate-config" (include "lk-tnsw.backend.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}
