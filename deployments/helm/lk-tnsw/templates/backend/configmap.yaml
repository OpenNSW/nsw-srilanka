{{- /*
Always rendered, even when backend.config is empty: the server refuses to start
without config.yaml, and an empty mapping is a valid one.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lk-tnsw.backend.fullname" . }}-config
  labels:
    {{- include "lk-tnsw.backend.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "lk-tnsw.backend.configYAML" . | nindent 4 }}
