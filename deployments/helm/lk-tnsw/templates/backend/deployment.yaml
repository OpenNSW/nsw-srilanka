apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lk-tnsw.backend.fullname" . }}
  labels:
    {{- include "lk-tnsw.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "lk-tnsw.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Rolls the pods when config.yaml changes; nothing else in the pod spec references the ConfigMap's contents. */}}
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "lk-tnsw.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.backend.image.repository }}:{{ include "lk-tnsw.imageTag" (dict "tag" .Values.backend.image.tag "root" .) }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              {{- if kindIs "map" $value }}
              {{- toYaml $value | nindent 14 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
            {{- /* The chart-rendered config.yaml, unless env names another. */}}
            {{- if not (hasKey (.Values.backend.env | default dict) "CONFIG_PATH") }}
            - name: CONFIG_PATH
              value: {{ printf "%s/config.yaml" .Values.backend.configMountPath | quote }}
            {{- end }}
          {{- if .Values.backend.envFrom }}
          envFrom:
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.backend.configMountPath }}
              readOnly: true
            {{- with .Values.backend.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- range .Values.backend.volumes }}
        {{- if eq .name "config" }}
        {{- fail "backend.volumes: the name \"config\" is reserved for the chart-rendered config.yaml; rename this volume" }}
        {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "lk-tnsw.backend.fullname" . }}-config
        {{- with .Values.backend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
