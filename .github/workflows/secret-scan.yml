name: Secret Scan
# Scans the commits of every PR to main for credentials with gitleaks
# (.gitleaks.toml), whatever files they touch. In the merge queue the job is
# skipped: the queue's commit holds only commits already scanned on their PRs,
# and a skipped required check counts as passed.

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BASE}..${HEAD}" \
            --verbose
