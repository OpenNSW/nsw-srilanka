name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The merge queue waits for required checks on its merge commit. These check
  # the PR itself, so they skip there; a skipped required check counts as passed.
  merge_group:

jobs:
  title:
    name: Conventional Commit Title
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
