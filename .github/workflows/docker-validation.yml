name: Docker Validation CI
# Validates that the deployable Docker images build successfully, and that each
# has no fixable CRITICAL CVE, on PRs to main and in the merge queue, when any
# file in a Docker build context changes; otherwise the builds are skipped. The
# scan policy and accepted risks are in .github/scripts/trivy-image.sh and
# .trivyignore. This workflow never pushes images. Image publishing is handled
# by build-dev.yaml (on push to main).

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # ---------------------------------------------------------------------------
  # Lists the files this PR or merge-queue entry changes, and reports whether
  # any is one this workflow checks. The jobs below skip only when this job
  # succeeds and finds none; if it fails, they run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed files
        id: match
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PATTERN: '^portals/|^Dockerfile$|\.go$|^go\.(mod|sum)$|^migrations/|^configs/|^\.dockerignore$|^\.trivyignore$|^\.github/scripts/trivy-image\.sh$|^\.github/workflows/docker-validation\.yml$'
        run: |
          # --no-renames lists both paths of a rename, so a file moved out of a
          # watched path still counts as a change to it.
          FILES=$(git diff --no-renames --name-only "$BASE...$HEAD")
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "None of the changed files is one this workflow checks, so its jobs are skipped."
          fi

  docker-validate:
    name: Validate ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tnsw-web
            context: ./portals
            dockerfile: ./portals/apps/trader-app/Dockerfile
            tags: tnsw-web:validate
            target: ''
          - name: tnsw-api
            context: .
            dockerfile: ./Dockerfile
            tags: tnsw-api:validate
            target: ''
          - name: tnsw-migrate
            context: .
            dockerfile: ./Dockerfile
            tags: tnsw-migrate:validate
            target: migrate

    steps:
      - uses: actions/checkout@v4

      # BuildKit is required for cache-from/cache-to and multi-stage build optimisations.
      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # The final stage is built without its layer cache: a cached
          # `apk upgrade` or `apk add` layer would keep the packages of an
          # earlier build, and with them a CVE Alpine has since fixed. The
          # builder stages keep their cache. The final stage is the target, or
          # the Dockerfile's `runtime` stage when there is none.
          no-cache-filters: ${{ matrix.target || 'runtime' }}
          push: false # validation only — never push in this workflow
          load: true  # into the local daemon, for the scan below
          tags: ${{ matrix.tags }}
          # Scope cache per image so matrix builds don't overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Same Trivy version as release.yml.
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.69.3

      - name: Scan ${{ matrix.name }} image
        id: trivy-scan
        env:
          IMAGE_REF: ${{ matrix.tags }}
          IMAGE_NAME: ${{ matrix.name }}
        run: bash .github/scripts/trivy-image.sh scan "$IMAGE_REF" "$IMAGE_NAME"

      # Fails on a fixable CRITICAL CVE; fixable HIGH findings are reported only.
      - name: Gate on image CVEs
        env:
          IMAGE_NAME: ${{ matrix.name }}
          UNSCANNED: ${{ steps.trivy-scan.outputs.failed_platforms }}
        run: bash .github/scripts/trivy-image.sh gate "$IMAGE_NAME"

  # The required check for this workflow. A skipped matrix job reports a single
  # check whose name isn't expanded, so the per-image checks can't be required;
  # this job passes when every image built, or when the builds were skipped
  # because no build context changed.
  docker-images:
    name: Docker images
    needs: [changes, docker-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the image builds
        env:
          BUILDS: ${{ needs.docker-validate.result }}
        run: |
          echo "Image builds: ${BUILDS}"
          case "$BUILDS" in
            success|skipped) ;;
            *) echo "::error::An image build did not succeed (${BUILDS})."; exit 1 ;;
          esac
