name: Build and Push Development Helm Chart
# Publishes a prerelease Helm chart to GHCR when the chart itself changes, so
# chart changes can be tested before a release. Does NOT run on ordinary code
# merges (dev images are handled by the build-*-dev.yaml workflows). Release
# charts are handled by release-chart.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'deployments/helm/**'
      - '.github/workflows/build-dev-chart.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CHART_NAME: lk-tnsw
  CHART_DIR: deployments/helm/lk-tnsw
  VALUES_EXAMPLE: deployments/helm/values-example.yaml

jobs:
  publish-dev-chart:
    name: Package & Push Dev Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }} -f ${{ env.VALUES_EXAMPLE }}

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package chart
        # Chart version must be valid SemVer: 0.0.0-dev.<run> sorts below any
        # real release, so `helm install` skips it unless --devel is passed.
        # appVersion is left as-is from Chart.yaml (metadata only). Both
        # backend.image.tag and frontend.image.tag are required and have no
        # default, so installers must set them to the dev images they want to
        # test, e.g. --set backend.image.tag=dev-<run>-<sha>.
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version "0.0.0-dev.${{ github.run_number }}" \
            --destination .

      - name: Push chart to GHCR
        run: |
          helm push ${{ env.CHART_NAME }}-0.0.0-dev.${{ github.run_number }}.tgz \
            oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts

      - name: Summary
        run: |
          {
            echo "## Dev Helm Chart Published"
            echo ""
            echo "- Chart: \`oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts/${{ env.CHART_NAME }}\`"
            echo "- Version: 0.0.0-dev.${{ github.run_number }} (prerelease — install with --devel or --version)"
            echo "- backend.image.tag and frontend.image.tag are required at install, e.g.:"
            echo "  \`--set backend.image.tag=dev-<run>-<sha> --set frontend.image.tag=dev-<run>-<sha>\`"
          } >> "$GITHUB_STEP_SUMMARY"
