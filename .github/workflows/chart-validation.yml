name: Chart Validation CI
# Validates that the Helm chart lints, renders, and packages successfully on
# PRs to main and in the merge queue, when the chart changes; otherwise the
# check is skipped. This workflow never publishes anything — that's chart-build-dev.yml
# (push to main) and release.yml (each app release). Purely a correctness
# check, so a broken chart (a template that fails to render or package) is
# caught at PR time instead of at the next chart release.

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_NAME: lk-tnsw
  CHART_DIR: deployments/helm/lk-tnsw
  VALUES_EXAMPLE: deployments/helm/values-example.yaml

jobs:
  # ---------------------------------------------------------------------------
  # Lists the files this PR or merge-queue entry changes, and reports whether
  # any is one this workflow checks. The jobs below skip only when this job
  # succeeds and finds none; if it fails, they run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed files
        id: match
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PATTERN: '^deployments/helm/|^\.github/workflows/chart-validation\.yml$'
        run: |
          FILES=$(git diff --name-only "$BASE...$HEAD")
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "None of the changed files is one this workflow checks, so its jobs are skipped."
          fi

  validate-chart:
    name: Lint, Render & Package Helm Chart
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Package chart
        # Packaged the way release.yml packages it, with a throwaway version as
        # both version and appVersion, so the steps below check the chart as
        # released — including image tags defaulting to the appVersion.
        # Nothing is published.
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version "0.0.0-ci.${{ github.run_number }}" \
            --app-version "0.0.0-ci.${{ github.run_number }}" \
            --destination /tmp/chart-validate

      - name: Lint chart
        run: helm lint /tmp/chart-validate/${{ env.CHART_NAME }}-*.tgz -f ${{ env.VALUES_EXAMPLE }}

      - name: Render chart
        # helm lint doesn't fully render templates — this catches template
        # errors (bad refs, invalid YAML after rendering) lint can miss.
        run: helm template ${{ env.CHART_NAME }} /tmp/chart-validate/${{ env.CHART_NAME }}-*.tgz -f ${{ env.VALUES_EXAMPLE }} > /dev/null
