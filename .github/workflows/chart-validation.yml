name: Chart Validation CI
# Validates that the Helm chart lints, renders, and packages successfully on
# PRs to main. This workflow never publishes anything — that's build-dev-chart.yml
# (push to main) and release-chart.yml (chart-v* tags). Purely a correctness
# check, so a broken chart (bad appVersion, a template that fails to render
# or package) is caught at PR time instead of at the next chart release.

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployments/helm/**'
      - '.github/actions/chart-appversion-check/**'
      - '.github/workflows/chart-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_NAME: lk-tnsw
  CHART_DIR: deployments/helm/lk-tnsw
  VALUES_EXAMPLE: deployments/helm/values-example.yaml

jobs:
  validate-chart:
    name: Lint, Render & Package Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so the appVersion check can find the latest
          # app release tag (v*.*.*).
          fetch-depth: 0
          fetch-tags: true

      - name: Validate appVersion matches the latest app release
        uses: ./.github/actions/chart-appversion-check
        with:
          chart-dir: ${{ env.CHART_DIR }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }} -f ${{ env.VALUES_EXAMPLE }}

      - name: Render chart
        # helm lint doesn't fully render templates — this catches template
        # errors (bad refs, invalid YAML after rendering) lint can miss.
        run: helm template ${{ env.CHART_NAME }} ${{ env.CHART_DIR }} -f ${{ env.VALUES_EXAMPLE }} > /dev/null

      - name: Package chart
        # Same packaging step as release-chart.yml, minus GHCR login/push —
        # proves the chart packages cleanly with a throwaway version. Nothing
        # is published.
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version "0.0.0-pr.${{ github.event.pull_request.number }}" \
            --destination /tmp/chart-validate
