name: Docs CI
# Checks the Markdown files on PRs to main and in the merge queue, when a
# Markdown file or a docs check setting changes; otherwise the checks are
# skipped. Each job runs the make target developers run locally, so the tool
# versions are pinned once, in the Makefile.

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lists the files this PR or merge-queue entry changes, and reports whether
  # any is one this workflow checks. The jobs below skip only when this job
  # succeeds and finds none; if it fails, they run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed files
        id: match
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PATTERN: '\.md$|\.markdownlint-cli2\.jsonc$|^lychee\.toml$|^\.vale\.ini$|^\.github/styles/|^\.github/workflows/docs-ci\.yml$|^Makefile$'
        run: |
          # --no-renames lists both paths of a rename, so a file moved out of a
          # watched path still counts as a change to it.
          FILES=$(git diff --no-renames --name-only "$BASE...$HEAD")
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "None of the changed files is one this workflow checks, so its jobs are skipped."
          fi

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        run: make mdlint

  linkcheck:
    name: Link Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lychee
        env:
          # Raises GitHub's rate limit for the github.com links.
          GITHUB_TOKEN: ${{ github.token }}
        run: make linkcheck

  prose:
    name: Prose Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Vale
        # Advisory: findings are listed in this step's log without failing the
        # job. Add project words to .github/styles/config/vocabularies/TNSW/accept.txt.
        continue-on-error: true
        run: make prose
