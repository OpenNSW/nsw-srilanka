name: Backend CI
# Three-stage Go quality and security pipeline, run on PRs and in the merge
# queue when Go code, the module files, the Dockerfile, migrations or the
# Makefile change; otherwise its jobs are skipped.
# Stage 1: quality-gate   — mod tidy + golangci-lint (fast; blocks further work)
# Stage 2: test-and-security — go test -race + gosec SARIF (heavy; blocks security scans)
# Stage 3: govulncheck (PRs only; the vulnerability database changes independently of the code)
# Secrets are scanned on every PR by secret-scan.yml.

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # ---------------------------------------------------------------------------
  # Lists the files this PR or merge-queue entry changes, and reports whether
  # any is one this workflow checks. The jobs below skip only when this job
  # succeeds and finds none; if it fails, they run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed files
        id: match
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PATTERN: '\.go$|^go\.(mod|sum)$|^Dockerfile$|^migrations/|^Makefile$|^\.github/workflows/backend-ci\.yml$'
        run: |
          FILES=$(git diff --name-only "$BASE...$HEAD")
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "None of the changed files is one this workflow checks, so its jobs are skipped."
          fi

  # ---------------------------------------------------------------------------
  # STAGE 1: Quality Gate
  # Verifies go.mod tidiness and runs the linter. Fast — if this fails, there
  # is no point running tests or security scans.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --config .golangci.yml
        env:
          GOWORK: off

  # ---------------------------------------------------------------------------
  # STAGE 2: Test & Security
  # Runs the full test suite with the race detector, then gosec for SAST.
  # gosec findings are uploaded to the GitHub Security tab (informational).
  # ---------------------------------------------------------------------------
  test-and-security:
    name: Test & Security
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      security-events: write
    env:
      GOWORK: off
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run gosec
        uses: securego/gosec@v2.29.0
        with:
          # -no-fail: upload findings to Security tab without blocking the build.
          # gosec is informational here; govulncheck (stage 3) is the blocking gate.
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: gosec.sarif
          category: gosec

  # ---------------------------------------------------------------------------
  # STAGE 3: Vulnerability Check
  # govulncheck: call-graph-precise vulnerability check against the Go vuln DB.
  # Runs on PRs once the test stage passes. It is advisory and skips in the
  # merge queue: a new advisory can turn it red without any change to the code.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    needs: test-and-security
    if: github.event_name != 'merge_group'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
        env:
          GOWORK: off
