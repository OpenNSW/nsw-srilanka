name: Release - Build and Publish Images
# Builds and publishes the platform Docker images (Trader Portal + Backend API)
# to GHCR, and the lk-tnsw Helm chart at the same version.
#
# Triggers:
#   - Automatic: merging a change to version.txt. auto-tag.yml tags the merge
#                commit and dispatches this workflow on that tag.
#   - Manual:    pushing a SemVer tag (e.g. v1.2.0), or workflow_dispatch with a
#                version input; either way version.txt must say that version.
#
# Release mode vs Dry Run:
#   Images are only pushed when triggered by a tag push OR a manual dispatch
#   with a version input. Any other trigger runs in dry-run mode: images are
#   built but not pushed and no GitHub Release is created.
#
# Outputs for gitops.yaml:
#   The image digest is written to the GitHub Release as a JSON asset
#   (release-digests.json). gitops.yaml reads this file to verify the image
#   before updating ArgoCD manifests — no rebuild, no guesswork.
#
# Release notes:
#   The released commit's CHANGELOG.md must have a `## [X.Y.Z]` section for the
#   version, and must be the commit that wrote it (the release PR's merge
#   commit), so nothing merged later ships undescribed. The section opens the
#   GitHub Release body, and version.txt must name the same version. Otherwise
#   the run fails before anything is built or pushed. To retry a release,
#   re-run the failed run or dispatch on the tag.

on:
  # Automatic: pushing a SemVer tag (e.g. v1.2.0) triggers a full release.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

env:
  REGISTRY: ghcr.io
  # Platforms in every published manifest list; the Trivy steps iterate it too.
  # Adding one needs a matching "Upload Trivy results" step — each SARIF upload
  # needs its own category.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 0: Take this version's section out of CHANGELOG.md. Everything else
  # waits on it, so a version without notes — or tagged on a later commit than
  # the one that wrote them — fails here, before any image is built or pushed.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-notes.sh looks back for the commit that wrote the section

      - name: Extract the CHANGELOG section
        env:
          # Passed through env, never interpolated into the script.
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"

          FILE_VERSION=$(tr -d '[:space:]' < version.txt 2>/dev/null || true)
          if [ "$FILE_VERSION" != "v${VERSION}" ]; then
            echo "::error file=version.txt::Releasing v${VERSION}, but version.txt at this commit says '${FILE_VERSION}'. Release by merging a PR that sets version.txt."
            exit 1
          fi

          # Fails unless this commit is the one that wrote the version's section,
          # so the notes describe exactly what is being released.
          if ! bash .github/scripts/release-notes.sh "$VERSION" > release-notes.md 2> error.txt; then
            MESSAGE=$(cat error.txt)
            MESSAGE=${MESSAGE//'%'/'%25'}
            echo "::error file=CHANGELOG.md::${MESSAGE//$'\n'/'%0A'}"
            exit 1
          fi
          echo "Release notes for ${VERSION}:"
          cat release-notes.md

          # By convention a release is dated the day its release PR merges, in
          # Sri Lanka time: the merge commit's date there. Warn, never fail,
          # when the heading says otherwise, so CHANGELOG.md can be corrected in
          # a later PR. Sri Lanka keeps UTC+05:30 with no daylight saving, so a
          # fixed offset is exact and needs no timezone database.
          HEADING=$(awk -v h="## [${VERSION}]" 'index($0, h) == 1 { print; exit }' CHANGELOG.md)
          HEADING_DATE=$(printf '%s\n' "$HEADING" | sed -nE 's/^## \[[^]]+\] - ([0-9]{4}-[0-9]{2}-[0-9]{2})[[:space:]]*$/\1/p')
          MERGE_DATE=$(TZ='<+0530>-05:30' git log -1 --date=format-local:%Y-%m-%d --format=%cd HEAD)
          if [ "$HEADING_DATE" != "$MERGE_DATE" ]; then
            echo "::warning file=CHANGELOG.md::CHANGELOG.md dates ${VERSION} '${HEADING_DATE:-no date}', but it was merged on ${MERGE_DATE} (Sri Lanka time). Releases are dated the merge day in Sri Lanka time; correct the heading in a later PR."
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  # ---------------------------------------------------------------------------
  # STAGE 1: Build, tag, and publish the image. Writes the image digest to a
  # file so Stage 2 can bundle it into release-digests.json and attach it to
  # the GitHub Release.
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build and Publish - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    needs: release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: Trader Portal
            image_name: tnsw-web
            context: ./portals
            dockerfile: ./portals/apps/trader-app/Dockerfile
            description: NSW Trader Portal Frontend
          - service_name: NSW Backend API
            image_name: tnsw-api
            context: .
            dockerfile: ./Dockerfile
            description: NSW Backend API Service
          - service_name: NSW Migrate
            image_name: tnsw-migrate
            context: .
            dockerfile: ./Dockerfile
            description: NSW schema migrator (nsw-agency migrate tool)
            # The migrator is a non-default stage; other entries have no target
            # and build their Dockerfile's default (last) stage.
            target: migrate
    permissions:
      packages: write          # push images to GHCR
      security-events: write   # upload Trivy SARIF results to GitHub Security
      id-token: write          # required for SLSA provenance attestation signing

    env:
      GIT_COMMIT: ${{ github.sha }}

    outputs:
      release_enabled: ${{ steps.release-mode.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git metadata

      - name: Set build time
        id: build-time
        run: |
          # repository.pushed_at is reliably populated on both push and workflow_dispatch.
          # github.event.head_commit.timestamp is NOT available on workflow_dispatch
          # so we fall back to the current time if pushed_at is also empty.
          TIMESTAMP="${{ github.event.repository.pushed_at }}"
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_time=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "Build time set to: $TIMESTAMP"

      - name: Determine release mode
        id: release-mode
        run: |
          # Release mode: tag push OR manual dispatch with a version input.
          # Pure branch pushes without a version input remain a dry run.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release mode enabled - image will be pushed"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dry run mode - image will be built only"
          fi

      # binfmt for the foreign-arch RUN steps in the final stages; the builder
      # stages are $BUILDPLATFORM-pinned, so little is emulated. Must come BEFORE
      # setup-buildx-action — buildkitd fixes its platform list at startup.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release-mode.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          # Resolve the version string from whichever trigger fired.
          # Strip the leading 'v' so downstream steps always get a bare semver (e.g. 1.2.0).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            # semver tags for tag-push releases: 1.2.3, 1.2, 1
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' }}
            # For manual dispatch, raw tag covers the exact version supplied.
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'workflow_dispatch' }}
            # 'latest' is only written in release mode (never on dry runs)
            type=raw,value=latest,enable=${{ steps.release-mode.outputs.enabled == 'true' }}
            # Always write a full-length SHA tag for traceability
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ env.GIT_COMMIT }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.build_time }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Empty for default-stage images; set to `migrate` for the migrator.
          target: ${{ matrix.target }}
          # One manifest list per tag, so steps.build.outputs.digest is the list
          # digest — which is what release-digests.json should pin.
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release-mode.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.tag }}
          # provenance and sbom attach SLSA build attestations to the image in GHCR.
          provenance: mode=max
          sbom: true
          # Scope cache per image so the two matrix builds don't overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

      # Write the image digest to a file so the collate job can bundle it
      # into release-digests.json for gitops.yaml to consume.
      - name: Save image digest
        if: steps.release-mode.outputs.enabled == 'true' && steps.build.outputs.digest != ''
        run: |
          mkdir -p /tmp/digests
          echo '${{ steps.build.outputs.digest }}' > /tmp/digests/${{ matrix.image_name }}.txt
          echo "Saved digest for ${{ matrix.image_name }}: ${{ steps.build.outputs.digest }}"

      - name: Upload digest artifact
        if: steps.release-mode.outputs.enabled == 'true' && steps.build.outputs.digest != ''
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image_name }}
          path: /tmp/digests/${{ matrix.image_name }}.txt
          retention-days: 1

      # Scans the pushed image for HIGH/CRITICAL CVEs. Reports only — see
      # "Report Trivy findings" below.
      - name: Setup Trivy
        if: steps.release-mode.outputs.enabled == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.69.3

      # `trivy image` resolves a manifest list to ONE entry, so each platform is
      # scanned explicitly or arm64 goes unscanned. --platform needs the full
      # os/arch form; a bare `arm64` parses as an OS name and matches nothing.
      # --exit-code 0 so a finding neither aborts the loop nor skips the uploads
      # below, which is what the old --exit-code 1 did.
      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        if: steps.release-mode.outputs.enabled == 'true'
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          # Collected rather than raised: a platform that cannot be scanned is
          # reported by "Report Trivy findings", not failed here.
          FAILED_PLATFORMS=""
          for PLATFORM in ${PLATFORMS//,/ }; do
            SLUG="${PLATFORM//\//-}"
            echo "::group::Trivy ${{ matrix.image_name }} ${PLATFORM}"
            # --image-src remote is load-bearing: the default `docker` source has
            # priority and silently IGNORES --platform, which would turn both
            # per-platform scans into two scans of the same arch.
            if trivy image \
                 --image-src remote \
                 --platform "$PLATFORM" \
                 --severity HIGH,CRITICAL \
                 --ignore-unfixed \
                 --format sarif \
                 --output "trivy-${{ matrix.image_name }}-${SLUG}.sarif" \
                 --exit-code 0 \
                 "$IMAGE_REF"; then
              # Same scan again as a readable table; caches are warm, so it is cheap.
              trivy image \
                --image-src remote \
                --platform "$PLATFORM" \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --format table \
                --exit-code 0 \
                "$IMAGE_REF" || true
            else
              echo "::warning::Trivy could not scan ${PLATFORM} — it is reported as unscanned below."
              FAILED_PLATFORMS="${FAILED_PLATFORMS} ${PLATFORM}"
            fi
            echo "::endgroup::"
          done
          echo "failed_platforms=${FAILED_PLATFORMS# }" >> "$GITHUB_OUTPUT"

      # One upload per (image, platform) — two uploads sharing a tool+category fails
      # the whole run. hashFiles tolerates a missing SARIF (narrowed PLATFORMS, or a
      # platform that failed to scan).
      - name: Upload Trivy results (linux/amd64)
        if: always() && steps.trivy-scan.outcome == 'success' && hashFiles(format('trivy-{0}-linux-amd64.sarif', matrix.image_name)) != ''
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image_name }}-linux-amd64.sarif
          category: ${{ matrix.image_name }}-linux-amd64

      - name: Upload Trivy results (linux/arm64)
        if: always() && steps.trivy-scan.outcome == 'success' && hashFiles(format('trivy-{0}-linux-arm64.sarif', matrix.image_name)) != ''
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image_name }}-linux-arm64.sarif
          category: ${{ matrix.image_name }}-linux-arm64

      # Report-only: cannot fail the release. Base-image CVEs arrive on the CVE
      # feed's schedule and often have no same-day fix, so gating on them blocks
      # shipping on something nobody can action. Runs after the uploads, so the
      # alerts it points at already exist.
      - name: Report Trivy findings
        if: always() && steps.trivy-scan.outcome == 'success'
        run: |
          {
            echo "### ${{ matrix.image_name }} — image CVEs (report only)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          UNSCANNED="${{ steps.trivy-scan.outputs.failed_platforms }}"
          if [ -n "$UNSCANNED" ]; then
            echo "::warning::Trivy could not scan: ${UNSCANNED} — published without a CVE report for those platforms."
            {
              echo "> **Not scanned:** \`${UNSCANNED}\` — published without a CVE report for those platforms."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # `[ -e ]` guards the no-match case: an unexpanded glob would otherwise
          # reach jq as a literal filename.
          TOTAL=0
          for FILE in trivy-${{ matrix.image_name }}-*.sarif; do
            [ -e "$FILE" ] || continue
            COUNT=$(jq '[.runs[].results[]] | length' "$FILE")
            TOTAL=$(( TOTAL + COUNT ))
            echo "$FILE: $COUNT fixable HIGH/CRITICAL finding(s)"
            echo "- \`${FILE}\`: ${COUNT} fixable HIGH/CRITICAL" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::${TOTAL} fixable HIGH/CRITICAL CVE(s) in ${{ matrix.image_name }} — the release was NOT blocked; triage under Security → Code scanning."
            echo "Triage under **Security → Code scanning**, category \`${{ matrix.image_name }}-linux-<arch>\`. The release was not blocked." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No fixable HIGH/CRITICAL CVEs on any scanned platform." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate service summary
        if: always()
        run: |
          echo "## Service: ${{ matrix.service_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.release-mode.outputs.enabled == 'true' && 'Release' || 'Dry Run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            echo "- Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # STAGE 2: Collate the digest artifact into one JSON file and attach it to
  # the GitHub Release so gitops.yaml can fetch it.
  # Runs only in release mode after the build finishes.
  # ---------------------------------------------------------------------------
  collate-digests:
    name: Collate Image Digests
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: needs.build-and-publish.outputs.release_enabled == 'true'
    outputs:
      version: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digest artifact
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Build release-digests.json
        run: |
          # Merge the per-service digest file into one JSON object:
          # { "trader-app": "sha256:abc..." }
          echo "{" > release-digests.json
          FIRST=true
          for FILE in /tmp/digests/*.txt; do
            IMAGE_NAME=$(basename "$FILE" .txt)
            DIGEST=$(cat "$FILE")
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> release-digests.json
            fi
            echo "  \"${IMAGE_NAME}\": \"${DIGEST}\"" >> release-digests.json
          done
          echo "}" >> release-digests.json
          echo "Generated release-digests.json:"
          cat release-digests.json

      - name: Upload collated digests
        uses: actions/upload-artifact@v7
        with:
          name: release-digests
          path: release-digests.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # STAGE 2b: Publish the Helm chart in lockstep with the app: chart X.Y.Z has
  # appVersion X.Y.Z, so it deploys the X.Y.Z images unless told otherwise.
  # Runs once the images exist; Chart.yaml only holds placeholders.
  # ---------------------------------------------------------------------------
  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: needs.build-and-publish.outputs.release_enabled == 'true'
    permissions:
      contents: read
      packages: write   # push the chart to GHCR
    env:
      CHART_NAME: lk-tnsw
      CHART_DIR: deployments/helm/lk-tnsw
      VALUES_EXAMPLE: deployments/helm/values-example.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Package and lint the chart
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "CHART_VERSION=${VERSION}" >> "$GITHUB_ENV"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination .
          # Linted as packaged, so the example values render against the real appVersion.
          helm lint "${CHART_NAME}-${VERSION}.tgz" -f "$VALUES_EXAMPLE"

      - name: Push the chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"
          {
            echo "## Helm Chart"
            echo ""
            echo "- Chart: \`oci://${REGISTRY}/${OWNER}/charts/${CHART_NAME}\`, version ${CHART_VERSION} (appVersion ${CHART_VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # STAGE 3: Create the GitHub Release entry and attach release-digests.json.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-notes, collate-digests, publish-chart]
    permissions:
      contents: write   # required to create a GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download collated digests
        uses: actions/download-artifact@v8
        with:
          name: release-digests
          path: .

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ needs.collate-digests.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          else
            echo "Tag $TAG already exists — skipping creation"
          fi

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Rendered in a step rather than inlined in the action's `body:` so the
      # digests can be read out of release-digests.json and shown next to each
      # image, instead of pointing the reader at an attachment. The image list is
      # taken from that file's keys too, so adding one to the build matrix needs no
      # change here. The version's CHANGELOG.md section comes first.
      - name: Render release body
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          VERSION: ${{ needs.collate-digests.outputs.version }}
        run: |
          {
            cat release-notes.md
            echo ""
            echo "_From [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)._"
            echo ""
            echo "---"
            echo ""
            echo "### Published Images"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            for IMG in $(jq -r 'keys[]' release-digests.json); do
              DIGEST=$(jq -r --arg k "$IMG" '.[$k]' release-digests.json)
              echo "| \`${{ env.REGISTRY }}/${OWNER}/${IMG}:${VERSION}\` | \`${DIGEST}\` |"
            done
            echo ""
            echo "### Pull Images"
            echo '```bash'
            for IMG in $(jq -r 'keys[]' release-digests.json); do
              echo "docker pull ${{ env.REGISTRY }}/${OWNER}/${IMG}:${VERSION}"
            done
            echo '```'
            echo ""
            echo "### Helm Chart"
            echo "Chart ${VERSION} deploys the images above by default:"
            echo '```bash'
            echo "helm install lk-tnsw oci://${{ env.REGISTRY }}/${OWNER}/charts/lk-tnsw --version ${VERSION} -f values.yaml"
            echo '```'
            echo ""
            echo "### Supported Platforms"
            echo "Every image above is a multi-arch manifest list covering \`linux/amd64\`"
            echo "and \`linux/arm64\` — one tag resolves correctly on both x86_64 and arm64"
            echo "(Graviton/Ampere) nodes, and on Apple Silicon."
            echo ""
            echo "The digests above are manifest-list digests. \`release-digests.json\` is"
            echo "attached for the GitOps pipeline, which verifies them before deploying."
          } > release-body.md
          echo "Rendered release body:"
          cat release-body.md

      # GitHub's generated notes list the PRs merged since the previous release.
      # With no previous release they would list every PR in the repo's history,
      # so the first release goes without them; its CHANGELOG section covers it.
      - name: Check for an earlier release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.collate-digests.outputs.version }}
        run: |
          COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[] | select(.tagName != env.TAG)] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No earlier release — GitHub's generated notes are left off this one."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.collate-digests.outputs.version) || github.ref }}
          name: TNSW ${{ needs.collate-digests.outputs.version }}
          body_path: release-body.md
          # Appends GitHub's own changelog — merged PRs since the previous release,
          # grouped by label per .github/release.yml, plus a compare link. `body`
          # above is PRE-pended and `name` is kept, so this only adds a section.
          # Off for the first release; see "Check for an earlier release".
          generate_release_notes: ${{ steps.previous.outputs.exists == 'true' }}
          draft: false
          prerelease: ${{ needs.collate-digests.outputs.is_prerelease == 'true' }}
          # Attach the digest manifest so gitops.yaml can fetch it directly
          # from the release assets without needing to rebuild or re-tag anything.
          files: release-digests.json