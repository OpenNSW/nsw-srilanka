name: Portals CI
# Runs on PRs and in the merge queue when portals/ changes; otherwise its jobs
# are skipped.

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # ---------------------------------------------------------------------------
  # Lists the files this PR or merge-queue entry changes, and reports whether
  # any is one this workflow checks. The jobs below skip only when this job
  # succeeds and finds none; if it fails, they run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed files
        id: match
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PATTERN: '^portals/|^\.github/workflows/portals-ci\.yml$'
        run: |
          FILES=$(git diff --name-only "$BASE...$HEAD")
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "None of the changed files is one this workflow checks, so its jobs are skipped."
          fi

  # STAGE 1: Code Quality & Build
  # Groups Type Check, Lint, and Build.
  # These all require the exact same 'pnpm install' environment.
  qa-and-build:
    name: Quality Check & Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    defaults:
      run:
        working-directory: ./portals
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: 'pnpm'
          cache-dependency-path: './portals/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Type Check (Strict)
      # We run this first. If types are broken, there is no point linting or building.
      - name: TypeScript Type Check
        run: pnpm run type-check

      # 2. Lint
      # TODO: Fix pre-existing lint errors and remove continue-on-error to enforce linting.
      - name: Run ESLint
        run: pnpm run --recursive --parallel lint
        continue-on-error: true

      # 3. Check Formatting (Prettier)
      - name: Check Formatting (Prettier)
        run: pnpm run format:check

      # 4. Build (Final Verification)
      # Only runs if Type Check passed.
      - name: Build all workspaces
        run: pnpm run build

  # STAGE 2: Security
  # Only runs if the code builds successfully (Fail-Fast). Advisory, and PRs
  # only: dependency review compares the PR's base and head, and new advisories
  # can turn pnpm audit red without any change to the code.
  security-scan:
    name: Security Scan
    needs: qa-and-build
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portals
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dependency Review needs the git history to compare base/head.
      # TODO: Remove continue-on-error once GitHub Dependency Graph is enabled for this repo
      # (requires a repo admin to enable it under Settings → Code security and analysis).
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      # Setup environment for Audit
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: 'pnpm'
          cache-dependency-path: './portals/pnpm-lock.yaml'

      # Audit usually doesn't need a full install, but it needs the lockfile.
      # Running install ensures the lockfile is valid and synced.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the build on high-severity advisories in production dependencies.
      # --prod excludes devDep tool chains (vite, rollup, etc.) from the audit.
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
