name: Chart appVersion check
description: >
  Validates that a Helm chart's Chart.yaml appVersion matches the latest app
  release tag (v*.*.*), so a chart release always ships pointing at the
  current app version. Requires the calling workflow to check out full
  history and tags first (fetch-depth: 0, fetch-tags: true).

inputs:
  chart-dir:
    description: Path to the chart directory (containing Chart.yaml), relative to the repo root.
    required: true

runs:
  using: composite
  steps:
    - name: Compare chart appVersion to latest app release tag
      shell: bash
      run: |
        CHART_FILE="${{ inputs.chart-dir }}/Chart.yaml"
        if [ ! -f "$CHART_FILE" ]; then
          echo "::error::Chart.yaml not found at $CHART_FILE"
          exit 1
        fi

        CHART_APP_VERSION=$(yq '.appVersion' "$CHART_FILE")
        if [ -z "$CHART_APP_VERSION" ] || [ "$CHART_APP_VERSION" = "null" ]; then
          echo "::error::$CHART_FILE has no appVersion set."
          exit 1
        fi

        # 'v*.*.*' would also match prerelease tags like v1.2.3-rc.1, so
        # filter to exact numeric SemVer (vMAJOR.MINOR.PATCH) before sorting.
        LATEST_APP_TAG=$(
          git tag --list |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V -r |
            head -n1
        )
        if [ -z "$LATEST_APP_TAG" ]; then
          echo "::error::No app release tag (v*.*.*) found — release the app images (release.yml) before releasing the chart."
          exit 1
        fi
        LATEST_APP_VERSION="${LATEST_APP_TAG#v}"

        echo "Chart appVersion:   $CHART_APP_VERSION"
        echo "Latest app release: $LATEST_APP_VERSION ($LATEST_APP_TAG)"

        if [ "$CHART_APP_VERSION" != "$LATEST_APP_VERSION" ]; then
          echo "::error::$CHART_FILE appVersion ($CHART_APP_VERSION) does not match the latest app release tag ($LATEST_APP_VERSION). Bump appVersion in a PR to match the app release this chart should ship with."
          exit 1
        fi

        echo "OK — chart appVersion matches the latest app release."
