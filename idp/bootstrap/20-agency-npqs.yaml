# File: NPQSPortalApp.yaml
resource_type: application
id: 01a13912-e45e-779b-8a34-42ee1e8d1031
ouId: 01a13912-d27c-78d7-ab13-e260c82ce84f
name: NPQSPortalApp
description: Application for the NPQS officer portal (trader-app in agency mode)
type: browser
template: react
logoUrl: https://ssl.gstatic.com/docs/common/profile/kiwi_lg.png
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
themeId: 01900000-0000-7000-8000-000000000073
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
allowedUserTypes:
  - Government_User
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: OGA_PORTAL_APP_NPQS
      redirectUris:
        - http://localhost:5174
        - https://localhost:5174
      postLogoutRedirectUris:
        - http://localhost:5174
        - https://localhost:5174
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      tokenEndpointAuthMethod: none
      pkceRequired: true
      publicClient: true
      requirePushedAuthorizationRequests: false
      dpopBoundAccessTokens: false
      includeActClaim: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - email
              - phone_number
              - family_name
              - given_name
              - groups
              - roles
              - ouHandle
              - ouId
              - ouName
              - username
        idToken:
          validityPeriod: 3600
          userAttributes:
            - email
            - family_name
            - given_name
            - groups
            - roles
            - ouHandle
            - ouId
            - ouName
            - username
          responseType: JWT
        refreshToken:
          validityPeriod: 86400
      scopes:
        - openid
        - profile
        - email
        - group
        - role
        - ou
        - nsw:consignment:read
        - nsw:task:read
        - nsw:task:write
        - nsw:profile:read
        - nsw:storage:read
        - nsw:storage:write
      userInfo:
        responseType: JSON
        userAttributes:
          - family_name
          - given_name
          - email
      scopeClaims:
        role:
          - roles
        email:
          - email
        group:
          - groups
        ou:
          - ouId
          - ouHandle
        phone:
          - phone_number
        profile:
          - given_name
          - family_name
