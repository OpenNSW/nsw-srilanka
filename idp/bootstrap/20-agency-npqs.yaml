type: API
ouId: 01a13912-d27c-78d7-ab13-e260c82ce84f
delimiter: ":"
resources:
  - name: NPQS API
    handle: nsw
    description: NPQS API resource
  - name: Consignment
    handle: consignment
    description: Consignment resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Task
    handle: task
    description: Task resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Workflow
    handle: workflow
    description: Workflow resource
    parent: nsw
    actions:
      - name: Inject
        handle: inject
        description: Inject action
