# File: SLPAPortalApp.yaml
resource_type: application
id: 01a13912-e9fb-77a3-8338-c68730f4a01f
ouId: 01a13912-d30d-7e07-830d-b2d229c43a28
name: SLPAPortalApp
description: Application for SLPA portal built with React
type: browser
template: react
logoUrl: https://ssl.gstatic.com/docs/common/profile/kiwi_lg.png
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
themeId: 01900000-0000-7000-8000-000000000073
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
allowedUserTypes:
  - Government_User
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: OGA_PORTAL_APP_SLPA
      redirectUris:
        - http://localhost:5177
        - https://localhost:5177
      postLogoutRedirectUris:
        - http://localhost:5177
        - https://localhost:5177
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      tokenEndpointAuthMethod: none
      pkceRequired: true
      publicClient: true
      requirePushedAuthorizationRequests: false
      dpopBoundAccessTokens: false
      includeActClaim: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - email
              - phone_number
              - family_name
              - given_name
              - groups
              - roles
              - ouHandle
              - ouId
              - ouName
              - username
        idToken:
          validityPeriod: 3600
          userAttributes:
            - email
            - family_name
            - given_name
            - groups
            - roles
            - ouHandle
            - ouId
            - ouName
            - username
          responseType: JWT
        refreshToken:
          validityPeriod: 86400
      scopes:
        - openid
        - profile
        - email
        - group
        - role
        - ou
        - agency:application:read
        - agency:application:review
        - agency:application:feedback
        - agency:consignment:read
        - agency:storage:read
        - agency:storage:write
        - agency:profile:read
      userInfo:
        responseType: JSON
        userAttributes:
          - family_name
          - given_name
          - email
      scopeClaims:
        email:
          - email
        group:
          - groups
        ou:
          - ouId
          - ouHandle
        phone:
          - phone_number
        profile:
          - given_name
          - family_name
        role:
          - roles
