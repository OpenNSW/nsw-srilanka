# Agency: SLPA. Still on the legacy shared Agency API resource server, with the OGA
# Reviewer role and group and the NswM2M role, which only SLPA uses now.
# Needs 10-nsw-platform.yaml.
#
# LOCAL-DEV bootstrap, mounted by compose.yml's thunderid-setup and applied with the
# image's own documents as one upsert import (see idp/README.md). Client IDs and the
# localhost URIs are the local-dev values; client secrets come from M2M_CLIENT_SECRET.
# Placeholders resolve from idp/.env before parsing, comments included, so never
# write placeholder syntax in a comment.

# File: SLPA.yaml
resource_type: organization_unit
id: 01a13912-d30d-7e07-830d-b2d229c43a28
handle: slpa
name: SLPA
description: Sri Lanka Ports Authority
parent: 01a13912-d1aa-7deb-8259-1f32e1f7983b
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
createdAt:
updatedAt:
---
# File: Agency_API.yaml
resource_type: resource_server
id: 01a13912-c6e8-719a-9bb3-46344b46e424
name: Agency API
description: Agency API resource server
identifier: https://api.nsw-agency.local
type: API
ouId: 01900000-0000-7000-8000-000000000001
delimiter: ":"
resources:
  - name: Agency API
    handle: agency
    description: Agency API resource
  - name: Application
    handle: application
    description: Application resource
    parent: agency
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Review
        handle: review
        description: Review action
      - name: Feedback
        handle: feedback
        description: Feedback action
      - name: Inject
        handle: inject
        description: Inject action
  - name: Consignment
    handle: consignment
    description: Consignment resource
    parent: agency
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    parent: agency
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    parent: agency
    actions:
      - name: Read
        handle: read
        description: Read action
