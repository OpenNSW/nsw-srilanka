# NSW platform: user types, the Government Organization and Private Sector OUs, the
# NSW API resource server, the trader, CHA and NSW admin roles and groups, the trader
# portal, the SLCE and GovPay webhook clients, and CORS. References nothing in the
# agency or sample files.
#
# LOCAL-DEV bootstrap, mounted by compose.yml's thunderid-setup and applied with the
# image's own documents as one upsert import (see idp/README.md). Client IDs and the
# localhost URIs are the local-dev values; client secrets come from M2M_CLIENT_SECRET.
# Placeholders resolve from idp/.env before parsing, comments included, so never
# write placeholder syntax in a comment.

# File: TraderApp.yaml
resource_type: application
id: 01a13912-e79b-7f19-999c-ae0911abc18f
ouId: 01900000-0000-7000-8000-000000000001
name: TraderApp
description: Application for trader portal built with React
type: browser
template: react
logoUrl: https://ssl.gstatic.com/docs/common/profile/kiwi_lg.png
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
themeId: 01900000-0000-7000-8000-000000000073
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
allowedUserTypes:
  - Private_User
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: TRADER_PORTAL_APP
      redirectUris:
        - http://localhost:5173
        - https://localhost:5173
      postLogoutRedirectUris:
        - http://localhost:5173
        - https://localhost:5173
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      tokenEndpointAuthMethod: none
      pkceRequired: true
      publicClient: true
      requirePushedAuthorizationRequests: false
      dpopBoundAccessTokens: false
      includeActClaim: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - email
              - phone_number
              - family_name
              - given_name
              - groups
              - roles
              - ouHandle
              - ouId
              - ouName
              - username
        idToken:
          validityPeriod: 3600
          userAttributes:
            - email
            - family_name
            - given_name
            - groups
            - roles
            - ouHandle
            - ouId
            - ouName
            - username
          responseType: JWT
        refreshToken:
          validityPeriod: 86400
      scopes:
        - openid
        - profile
        - email
        - group
        - role
        - ou
        - nsw:consignment:read
        - nsw:consignment:write
        - nsw:task:read
        - nsw:task:write
        - nsw:hscode:read
        - nsw:company:read
        - nsw:cha:read
        - nsw:profile:read
        - nsw:storage:read
        - nsw:storage:write
      userInfo:
        responseType: JSON
        userAttributes:
          - family_name
          - given_name
          - email
      scopeClaims:
        ou:
          - ouId
          - ouHandle
        phone:
          - phone_number
        profile:
          - given_name
          - family_name
        role:
          - roles
        email:
          - email
        group:
          - groups
---
# File: SLCE_to_NSW.yaml
resource_type: application
id: 01a13912-e7d9-7dd6-a187-1e9c60456335
ouId: 01900000-0000-7000-8000-000000000001
name: SLCE to NSW
description: Machine-to-machine client for SLC Edge (ASYCUDA) to call the NSW SLCE webhook endpoint
type: m2m
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: SLCE_TO_NSW
      clientSecret: "{{ .M2M_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      pkceRequired: false
      publicClient: false
      requirePushedAuthorizationRequests: false
      dpopBoundAccessTokens: false
      includeActClaim: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
          clientConfig:
            validityPeriod: 3600
        idToken:
          validityPeriod: 3600
        refreshToken:
          validityPeriod: 86400
      scopes:
        - nsw:slce-webhooks:write
      userInfo:
        responseType: JSON
      scopeClaims:
        phone:
        profile:
        roles:
          - roles
        address:
        email:
