# Agency: EFC. Its OU, API resource server, officer role and group, officer portal,
# and the two M2M clients with their roles (EFC_TO_NSW calls TNSW; NSW_TO_EFC injects
# into the agency and replies on its parked steps). Needs 10-nsw-platform.yaml.
#
# LOCAL-DEV bootstrap, mounted by compose.yml's thunderid-setup and applied with the
# image's own documents as one upsert import (see idp/README.md). Client IDs and the
# localhost URIs are the local-dev values; client secrets come from M2M_CLIENT_SECRET.
# Placeholders resolve from idp/.env before parsing, comments included, so never
# write placeholder syntax in a comment.

# File: EFC.yaml
resource_type: organization_unit
id: 01a13912-d22e-7f09-a8cd-486cf6438e0f
handle: efc
name: EFC
description: Export Facilitation Center
parent: 01a13912-d1aa-7deb-8259-1f32e1f7983b
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
createdAt:
updatedAt:
---
# File: EFC_API.yaml
resource_type: resource_server
id: 01a13912-cb36-74ad-aab0-b49b1c19fbf9
name: EFC API
description: EFC API resource server
identifier: https://api.efc.nsw-agency.local
type: API
ouId: 01a13912-d22e-7f09-a8cd-486cf6438e0f
delimiter: ":"
resources:
  - name: EFC API
    handle: nsw
    description: EFC API resource
  - name: Workflow
    handle: workflow
    description: Workflow resource
    parent: nsw
    actions:
      - name: Inject
        handle: inject
        description: Inject action
  - name: Consignment
    handle: consignment
    description: Consignment resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Task
    handle: task
    description: Task resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
