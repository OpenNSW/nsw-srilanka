type: API
ouId: 01a13912-d22e-7f09-a8cd-486cf6438e0f
delimiter: ":"
resources:
  - name: Workflow
    handle: workflow
    description: Workflow resource
    actions:
      - name: Inject
        handle: inject
        description: Inject action
  - name: Consignment
    handle: consignment
    description: Consignment resource
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Admin Read
        handle: adminread
        description: Admin Read action
      - name: Admin Write
        handle: adminwrite
        description: Admin Write action
  - name: Task
    handle: task
    description: Task resource
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
