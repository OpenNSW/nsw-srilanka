            validityPeriod: 3600
        idToken:
          validityPeriod: 3600
        refreshToken:
          validityPeriod: 86400
      scopes:
        - nsw:task:write
        - nsw:consignment:read
        - nsw:storage:read
        - nsw:storage:write
        - nsw:storage:internalwrite
      userInfo:
        responseType: JSON
      scopeClaims:
        phone:
        profile:
        roles:
          - roles
        address:
        email:
