# File: NSW_TO_EFC_M2M.yaml
resource_type: application
id: 01a13912-e227-72b4-9ae2-56e1bd7fa0c0
ouId: 01a13912-d22e-7f09-a8cd-486cf6438e0f
name: NSW_TO_EFC_M2M
description: Machine-to-machine integration for NSW to EFC
type: m2m
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: NSW_TO_EFC
      clientSecret: "{{ .M2M_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      pkceRequired: false
      publicClient: false
      requirePushedAuthorizationRequests: false
      dpopBoundAccessTokens: false
      includeActClaim: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
          clientConfig:
            validityPeriod: 3600
        idToken:
          validityPeriod: 3600
        refreshToken:
          validityPeriod: 86400
      scopes:
        - workflow:inject
        - task:write
      userInfo:
        responseType: JSON
      scopeClaims:
        address:
        email:
        phone:
        profile:
        roles:
          - roles
