name: CDA
description: Coconut Development Authority
parent: 01a13912-d1aa-7deb-8259-1f32e1f7983b
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
createdAt:
updatedAt:
---
# File: CDA_API.yaml
resource_type: resource_server
id: 01a13912-c931-7455-a232-a8dded191be7
name: CDA API
description: CDA API resource server
identifier: https://api.cda.nsw-agency.local
type: API
ouId: 01a13912-d209-78da-9de0-dd544935e1ae
delimiter: ":"
resources:
  - name: CDA API
    handle: nsw
    description: CDA API resource
  - name: Consignment
    handle: consignment
    description: Consignment resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Task
    handle: task
    description: Task resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Workflow
    handle: workflow
    description: Workflow resource
    parent: nsw
    actions:
      - name: Inject
        handle: inject
        description: Inject action
