    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Workflow
    handle: workflow
    description: Workflow resource
    actions:
      - name: Inject
        handle: inject
        description: Inject action
