# Agency: FCAU. Its OU, API resource server, officer role and group, officer portal,
# and the two M2M clients with their roles (FCAU_TO_NSW calls TNSW; NSW_TO_FCAU injects
# into the agency). Needs 10-nsw-platform.yaml.
#
# LOCAL-DEV bootstrap, mounted by compose.yml's thunderid-setup and applied with the
# image's own documents as one upsert import (see idp/README.md). Client IDs and the
# localhost URIs are the local-dev values; client secrets come from M2M_CLIENT_SECRET.
# Placeholders resolve from idp/.env before parsing, comments included, so never
# write placeholder syntax in a comment.

# File: FCAU.yaml
resource_type: organization_unit
id: 01a13912-d251-7172-bd54-14a0e3c2f594
handle: fcau
name: FCAU
description: Food Control Administration Unit
parent: 01a13912-d1aa-7deb-8259-1f32e1f7983b
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
createdAt:
updatedAt:
---
# File: FCAU_API.yaml
resource_type: resource_server
id: 01a13912-d026-758a-a663-b319c8de3a44
name: FCAU API
description: FCAU API resource server
identifier: https://api.fcau.nsw-agency.local
type: API
ouId: 01a13912-d251-7172-bd54-14a0e3c2f594
delimiter: ":"
resources:
  - name: FCAU API
    handle: nsw
    description: FCAU API resource
  - name: Workflow
    handle: workflow
    description: Workflow resource
    parent: nsw
    actions:
      - name: Inject
        handle: inject
        description: Inject action
  - name: Consignment
    handle: consignment
    description: Consignment resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Task
    handle: task
    description: Task resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
      - name: Write
        handle: write
        description: Write action
  - name: Profile
    handle: profile
    description: Profile resource
    parent: nsw
    actions:
      - name: Read
        handle: read
        description: Read action
  - name: Storage
    handle: storage
    description: Storage resource
    parent: nsw
    actions:
      - name: Write
        handle: write
        description: Write action
      - name: Read
        handle: read
        description: Read action
