# ThunderID server configuration (mounted over /opt/thunderid/deployment.yaml).
#
# Minimal override, not a full config: the image's config/default.json already has the
# right tls, database and crypto values. Keep it small — the decoder uses
# KnownFields(true), so a key that upstream renames or drops becomes a startup error.
#
# Placeholders are resolved from ./.env before the YAML is parsed. An unset variable is
# a hard error, and resolution covers comments too, so never write placeholder syntax in
# a comment unless that variable is set.
server:
  hostname: {{.HOSTNAME}}
  public_url: {{.PUBLIC_URL}}
  port: {{.PORT}}
  security:
    # Gates the Direct API endpoints, which we do not use. setup.sh generates the
    # value; an empty secret blocks those endpoints rather than failing boot.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

email:
  smtp:
    host: {{.SMTP_HOST}}
    port: {{.SMTP_PORT}}
    username: {{.SMTP_USERNAME}}
    password: {{.SMTP_PASSWORD}}
    from_address: {{.SMTP_FROM_ADDRESS}}
    enable_start_tls: {{.SMTP_ENABLE_START_TLS}}
    enable_authentication: {{.SMTP_ENABLE_AUTHENTICATION}}

passkey:
  allowed_origins:
    - {{.PUBLIC_URL}}

