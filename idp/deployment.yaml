# Minimal override of the image's config/default.json. Keep it small: the decoder uses
# KnownFields(true), so any key upstream renames or drops becomes a startup error.
#
# Placeholders resolve from ./.env before parsing. An unset variable is a hard error,
# and resolution covers comments too — never write placeholder syntax in a comment.
#
# Mounted into thunderid-setup too, where setup.sh reads the server block with grep
# (the image has no yq) to build the Console's URLs. That parse does not resolve
# placeholders, so the server block holds literal values.
server:
  hostname: "0.0.0.0"
  public_url: "http://localhost:8090"
  port: 8090
  # Plain HTTP for local dev, so no client needs to trust the self-signed cert.
  http_only: true
  security:
    # Gates the Direct API endpoints, which we do not use. setup.sh generates the
    # value; an empty secret blocks those endpoints rather than failing boot.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

email:
  smtp:
    host: {{.SMTP_HOST}}
    port: {{.SMTP_PORT}}
    username: {{.SMTP_USERNAME}}
    password: {{.SMTP_PASSWORD}}
    from_address: {{.SMTP_FROM_ADDRESS}}
    enable_start_tls: {{.SMTP_ENABLE_START_TLS}}
    enable_authentication: {{.SMTP_ENABLE_AUTHENTICATION}}

passkey:
  allowed_origins:
    - "http://localhost:8090"

