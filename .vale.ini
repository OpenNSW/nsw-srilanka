# Vale prose linter settings, used by `make prose` and CI
# (.github/workflows/docs-ci.yml). Reference: https://vale.sh/docs/vale-ini
#
# The built-in Vale style checks spelling, repeated words and term casing.
# Project words the dictionary lacks go in
# .github/styles/config/vocabularies/TNSW/accept.txt, one regex per line.
# An entry without (?i) also enforces its exact casing (Vale.Terms).

StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = TNSW

[*.md]
BasedOnStyles = Vale
